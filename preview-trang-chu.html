                  <span className="section-eyebrow">GIỚI THIỆU DỰ ÁN GIÁO DỤC SỐ</span>
                  <h2 className="section-title">
                    Khơi dậy tình yêu Biển đảo từ <span className="text-ocean">Tri thức Chuẩn</span> &{' '}
                    <span className="text-navy">Công nghệ Mới</span>
                  </h2>
                  <p className="section-subtitle">
                    Dự án <strong>BIỂN ĐẢO VIỆT NAM — Chạm tri thức, Vững chủ quyền</strong> được xây dựng
                    nhằm mang đến một nền tảng học liệu trực quan, kết nối chặt chẽ kiến thức liên môn Lịch
                    sử - Địa lý - Giáo dục Quốc phòng & An ninh cho học sinh và giáo viên THPT.
                  </p>
                </div>

                <div className="pillars-grid">
                  {PROJECT_PILLARS.map((pillar, index) => (
                    <article key={pillar.id} className="pillar-card">
                      <div className="pillar-card-top">
                        <div className="pillar-icon-box" style={{ fontSize: '24px' }}>{pillar.icon}</div>
                        <span className="pillar-number">0{index + 1}</span>
                      </div>
                      <h3 className="pillar-title">{pillar.title}</h3>
                      <p className="pillar-desc">{pillar.description}</p>
                      <div className="pillar-tag">✦ {pillar.highlight}</div>
                    </article>
                  ))}
                </div>

                <div id="doi-tuong" className="audience-showcase-box">
                  <div className="audience-header-bar">
                    <div className="audience-header-text">
                      <span className="audience-label-tag">ĐỐI TƯỢNG SỬ DỤNG TRỌNG TÂM</span>
                      <h3>Thiết kế chuyên biệt cho nhà trường THPT</h3>
                    </div>
                    <div className="audience-tab-buttons">
                      <button
                        type="button"
                        className={`audience-tab-btn ${activeRole === 'student' ? 'active' : ''}`}
                        onClick={() => setActiveRole('student')}
                      >
                        ✨ Dành cho Học sinh THPT
                      </button>
                      <button
                        type="button"
                        className={`audience-tab-btn ${activeRole === 'teacher' ? 'active' : ''}`}
                        onClick={() => setActiveRole('teacher')}
                      >
                        🎓 Dành cho Giáo viên
                      </button>
                    </div>
                  </div>

                  <div className="audience-content-grid">
                    <div className="audience-info-col">
                      <span className="audience-mode-badge">{currentAudience.badge}</span>
                      <h4 className="audience-mode-title">{currentAudience.title}</h4>
                      <p className="audience-mode-subtitle">{currentAudience.subtitle}</p>
                      <button type="button" className="btn-primary-gold" onClick={handleStartExplore}>
                        <span>{currentAudience.ctaLabel} ↗</span>
                      </button>
                    </div>
                    <div className="audience-benefits-col">
                      {currentAudience.benefits.map((item, idx) => (
                        <div key={idx} className="audience-benefit-card">
                          <div className="benefit-check-icon">✔</div>
                          <div className="benefit-text">
                            <h5>{item.title}</h5>
                            <p>{item.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* 6 Features Section */}
            <section id="chuc-nang" className="features-section">
              <div className="container">
                <div className="section-header">
                  <span className="section-eyebrow">6 PHÂN HỆ TRỌNG TÂM</span>
                  <h2 className="section-title">
                    Hệ sinh thái Học tập & Khám phá <span className="text-ocean">Biển Đảo Số</span>
                  </h2>
                  <p className="section-subtitle">
                    Mỗi thẻ chức năng mở ra một phương thức tiếp cận tri thức độc đáo dành cho Học sinh THPT và Giáo viên.
                  </p>
                </div>

                <div className="features-grid">
                  {FEATURES_DATA.map((feature) => (
                    <article key={feature.id} className={`feature-card accent-${feature.accentColor}`}>
                      <div className="feature-card-header">
                        <div className="feature-icon-wrapper" style={{ fontSize: '26px' }}>
                          {feature.emoji}
                        </div>
                        <div className="feature-meta-tags">
                          <span className="feature-badge">{feature.badge}</span>
                          <span className="feature-code">#{feature.code}</span>
                        </div>
                      </div>

                      <div className="feature-card-body">
                        <h3 className="feature-title">{feature.title}</h3>
                        <p className="feature-subtitle">{feature.subtitle}</p>
                        <p className="feature-description">{feature.shortDesc}</p>
                        <ul className="feature-highlights">
                          {feature.highlights.map((point, i) => (
                            <li key={i}>
                              <span className="highlight-icon">✓</span>
                              <span>{point}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                      <div className="feature-card-footer">
                        <div className="feature-preview-strip">
                          <span className="preview-strip-text">{feature.samplePreview.coordinate}</span>
                        </div>
                        <button
                          type="button"
                          className="feature-action-btn"
                          onClick={() => setSelectedFeatureId(feature.id)}
                        >
                          <span>{feature.samplePreview.actionText}</span>
                          <span>→</span>
                        </button>
                      </div>
                    </article>
                  ))}
                </div>
              </div>
            </section>

            {/* Footer */}
            <footer className="site-footer">
              <div className="container">
                <div className="footer-bottom">
                  <p>
                    © {new Date().getFullYear()} <strong>BIỂN ĐẢO VIỆT NAM</strong> — Chạm tri thức, Vững chủ quyền.
                  </p>
                </div>
              </div>
            </footer>

            {/* Modal */}
            {activeFeature && (
              <div className="modal-backdrop" onClick={() => setSelectedFeatureId(null)}>
                <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
                  <div className="modal-header">
                    <div>
                      <span className="modal-eyebrow">TRẢI NGHIỆM TRƯỚC PHÂN HỆ</span>
                      <h3 className="modal-title">{activeFeature.title}</h3>
                    </div>
                    <button type="button" className="modal-close-btn" onClick={() => setSelectedFeatureId(null)}>
                      ✕
                    </button>
                  </div>
                  <div className="modal-body">
                    <p className="modal-feature-desc">{activeFeature.shortDesc}</p>
                    <div className="modal-coord-strip">
                      <strong>Tâm điểm:</strong> {activeFeature.samplePreview.coordinate}
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn-primary-gold" onClick={() => setSelectedFeatureId(null)}>
                      Đóng cửa sổ
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<PreviewApp />);
    </script>
  </body>
</html>
