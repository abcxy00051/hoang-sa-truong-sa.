<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" fill="none">
  <defs>
    <linearGradient id="oa3-bg" x1="0" y1="0" x2="480" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A718D"/>
      <stop offset="55%" stop-color="#113747"/>
      <stop offset="100%" stop-color="#1A718D"/>
    </linearGradient>
  </defs>

  <rect width="480" height="260" fill="url(#oa3-bg)"/>
  <path d="M0 220 Q120 202 240 220 T480 220 V260 H0 Z" fill="#113747" fill-opacity="0.55"/>

  <!-- Connecting Maritime Route Curves in Cyan & Ice-Aqua -->
  <path d="M188 50 C235 50 245 108 292 108" stroke="#B6E0EB" stroke-width="3" stroke-dasharray="5 4"/>
  <path d="M188 108 C235 108 245 50 292 50" stroke="#29B4D1" stroke-width="3"/>
  <path d="M188 166 L292 166" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Left Column: Mốc thời gian -->
  <g transform="translate(26, 28)">
    <rect x="0" y="0" width="162" height="44" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="2"/>
    <circle cx="22" cy="22" r="6" fill="#29B4D1"/>
    <text x="92" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="900">Năm 1816</text>

    <rect x="0" y="58" width="162" height="44" rx="10" fill="#113747" stroke="#B6E0EB" stroke-width="2"/>
    <circle cx="22" cy="80" r="6" fill="#B6E0EB"/>
    <text x="92" y="85" text-anchor="middle" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="900">Năm 1982</text>

    <rect x="0" y="116" width="162" height="44" rx="10" fill="#29B4D1" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="22" cy="138" r="6" fill="#113747"/>
    <text x="92" y="143" text-anchor="middle" fill="#113747" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="900">Năm 2012</text>
  </g>

