<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="b3-gold" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="b3-core" x1="25" y1="20" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747"/>
      <stop offset="100%" stop-color="#1A718D"/>
    </linearGradient>
  </defs>

  <!-- Outer Medallion Rosette -->
  <circle cx="80" cy="76" r="68" fill="#F59E0B" fill-opacity="0.14"/>
  <circle cx="80" cy="76" r="60" fill="url(#b3-gold)" stroke="#113747" stroke-width="2.5"/>
  <circle cx="80" cy="76" r="52" fill="url(#b3-core)" stroke="#B6E0EB" stroke-width="2"/>
  <circle cx="80" cy="76" r="46" fill="none" stroke="url(#b3-gold)" stroke-width="1.2" stroke-dasharray="5 3"/>

  <!-- Imperial Scroll (Châu bản triều Nguyễn) & Legal Scale (UNCLOS 1982) -->
  <!-- Scroll Backdrop -->
  <rect x="52" y="46" width="56" height="44" rx="4" fill="#FEF3C7" stroke="url(#b3-gold)" stroke-width="2"/>
  <rect x="47" y="43" width="6" height="50" rx="3" fill="url(#b3-gold)" stroke="#113747" stroke-width="1.2"/>
  <rect x="107" y="43" width="6" height="50" rx="3" fill="url(#b3-gold)" stroke="#113747" stroke-width="1.2"/>

  <!-- Red Imperial Seal & Balance of Law inside Scroll -->
  <rect x="58" y="54" width="14" height="14" rx="2" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  <circle cx="65" cy="61" r="3.5" fill="#FDE047"/>

  <!-- Legal Scale on Right of Scroll -->
  <line x1="90" y1="52" x2="90" y2="82" stroke="#113747" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78" y1="58" x2="102" y2="58" stroke="#113747" stroke-width="2" stroke-linecap="round"/>
  <path d="M78 58 L74 68 H82 Z" fill="#29B4D1" stroke="#113747" stroke-width="1.2"/>
  <path d="M102 58 L98 68 H106 Z" fill="#29B4D1" stroke="#113747" stroke-width="1.2"/>
  <path d="M83 82 H97" stroke="#113747" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Text lines on scroll -->
  <line x1="58" y1="74" x2="76" y2="74" stroke="#1A718D" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="80" x2="72" y2="80" stroke="#1A718D" stroke-width="2" stroke-linecap="round"/>

  <!-- Maritime Waves Below Scroll -->
  <path d="M44 102 Q62 95 80 102 T116 102" fill="none" stroke="#29B4D1" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="40" text-anchor="middle" fill="#FDE68A" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8">1816 • 1982 • 2012</text>

  <!-- Bottom Ribbon -->
  <path d="M20 126 L32 118 H128 L140 126 L132 144 H28 Z" fill="#29B4D1" stroke="#113747" stroke-width="2"/>
  <text x="80" y="135" text-anchor="middle" fill="#113747" font-family="Inter, Segoe UI, sans-serif" font-size="10.2" font-weight="900" letter-spacing="0.7">SỨ GIẢ PHÁP LÝ</text>
</svg>
