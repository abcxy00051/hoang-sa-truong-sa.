<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="b1-ring" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6E0EB"/>
      <stop offset="50%" stop-color="#29B4D1"/>
      <stop offset="100%" stop-color="#1A718D"/>
    </linearGradient>
    <linearGradient id="b1-core" x1="25" y1="20" x2="135" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A718D"/>
      <stop offset="100%" stop-color="#113747"/>
    </linearGradient>
    <linearGradient id="b1-aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B6E0EB"/>
      <stop offset="100%" stop-color="#29B4D1"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="76" r="68" fill="#29B4D1" fill-opacity="0.18"/>
  <polygon points="80,4 96,24 126,18 124,48 148,66 130,90 138,118 108,122 94,146 80,128 66,146 52,122 22,118 30,90 12,66 36,48 34,18 64,24" fill="url(#b1-ring)" stroke="#113747" stroke-width="2.5"/>

  <circle cx="80" cy="76" r="52" fill="url(#b1-core)" stroke="#B6E0EB" stroke-width="2.5"/>
  <circle cx="80" cy="76" r="46" fill="none" stroke="#29B4D1" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Compass Rose Background -->
  <g opacity="0.35" stroke="#B6E0EB" stroke-width="1.5">
    <line x1="80" y1="32" x2="80" y2="120"/>
    <line x1="36" y1="76" x2="124" y2="76"/>
    <line x1="49" y1="45" x2="111" y2="107"/>
    <line x1="111" y1="45" x2="49" y2="107"/>
  </g>

  <!-- Star at Top -->
  <polygon points="80,32 83,40 91,40 85,45 87,53 80,48 73,53 75,45 69,40 77,40" fill="#B6E0EB"/>

  <!-- Sailing Ship Cutting Waves -->
  <path d="M80 46 L80 92 L52 88 Z" fill="#FFFFFF"/>
  <path d="M83 50 L83 92 L108 86 Z" fill="#B6E0EB"/>
  <path d="M80 42 L80 94" stroke="#29B4D1" stroke-width="3" stroke-linecap="round"/>
  <path d="M80 42 L95 46 L80 50 Z" fill="#29B4D1"/>

  <!-- Ship Hull -->
  <path d="M48 92 H112 L102 104 H58 Z" fill="url(#b1-aqua)" stroke="#113747" stroke-width="1.5"/>

  <!-- Ocean Waves -->
  <path d="M40 105 Q50 99 60 105 T80 105 T100 105 T120 105" fill="none" stroke="#29B4D1" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M46 112 Q56 107 66 112 T86 112 T106 112" fill="none" stroke="#B6E0EB" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom Ribbon -->
  <path d="M26 126 L38 118 H122 L134 126 L126 144 H34 Z" fill="url(#b1-aqua)" stroke="#113747" stroke-width="2"/>
  <text x="80" y="135" text-anchor="middle" fill="#113747" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="900" letter-spacing="1.2">RA KHƠI</text>
</svg>
