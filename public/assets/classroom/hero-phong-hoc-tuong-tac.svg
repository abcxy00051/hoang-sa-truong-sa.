<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" fill="none">
  <defs>
    <linearGradient id="clsHeroBg" x1="0" y1="0" x2="920" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#051B34" />
      <stop offset="52%" stop-color="#0B3866" />
      <stop offset="100%" stop-color="#062847" />
    </linearGradient>
    <linearGradient id="clsGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="920" height="520" rx="24" fill="url(#clsHeroBg)" />

  <!-- Subtle Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="130" x2="920" y2="130" stroke-dasharray="6 6" />
    <line x1="0" y1="260" x2="920" y2="260" />
    <line x1="0" y1="390" x2="920" y2="390" stroke-dasharray="6 6" />
    <line x1="230" y1="0" x2="230" y2="520" />
    <line x1="460" y1="0" x2="460" y2="520" stroke-dasharray="6 6" />
    <line x1="690" y1="0" x2="690" y2="520" />
  </g>

  <!-- Interactive Smartboard Centerpiece -->
  <g transform="translate(235, 48)">
    <rect width="450" height="295" rx="18" fill="#07192E" stroke="#38BDF8" stroke-width="3" />
    <rect x="14" y="14" width="422" height="267" rx="12" fill="#0B2748" />
    <text x="32" y="46" fill="#FDE68A" font-family="sans-serif" font-size="14" font-weight="800">LỚP HỌC SỐ BIỂN ĐẢO THPT (GDPT 2018)</text>
    <line x1="32" y1="58" x2="418" y2="58" stroke="#38BDF8" stroke-opacity="0.35" />

    <!-- Mini East Sea Map inside Smartboard -->
    <rect x="32" y="72" width="185" height="188" rx="10" fill="#061A33" stroke="#38BDF8" stroke-opacity="0.4" />
    <path d="M72,92 C92,106 85,125 74,142 C64,158 88,178 106,198 C118,215 112,235 92,248"
          stroke="url(#clsGold)" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="145" cy="142" r="7" fill="#EF4444" stroke="#FEF08A" stroke-width="2" />
    <text x="156" y="146" fill="#FEF08A" font-family="sans-serif" font-size="10" font-weight="700">Hoàng Sa</text>
    <circle cx="158" cy="212" r="7" fill="#EF4444" stroke="#FEF08A" stroke-width="2" />
    <text x="169" y="216" fill="#FEF08A" font-family="sans-serif" font-size="10" font-weight="700">Trường Sa</text>

    <!-- Interactive Quiz & Score Chart Preview -->
    <g transform="translate(232, 72)">
      <rect width="186" height="86" rx="10" fill="#061A33" stroke="#F59E0B" stroke-opacity="0.45" />
      <text x="14" y="24" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="700">6 HOẠT ĐỘNG TƯƠNG TÁC</text>
      <text x="14" y="44" fill="#E0F2FE" font-family="sans-serif" font-size="10">✓ 8 Chuyên đề • 80 câu trắc nghiệm</text>
      <text x="14" y="60" fill="#E0F2FE" font-family="sans-serif" font-size="10">✓ Đúng/Sai • Ghép mốc • Bản đồ</text>
      <text x="14" y="76" fill="#6EE7B7" font-family="sans-serif" font-size="10">✓ Thử thách &amp; Kiểm tra tổng hợp</text>

      <rect y="98" width="186" height="90" rx="10" fill="#061A33" stroke="#34D399" stroke-opacity="0.45" />
      <text x="14" y="120" fill="#6EE7B7" font-family="sans-serif" font-size="11" font-weight="700">CHẤM ĐIỂM &amp; HUY HIỆU THỰC</text>
      <rect x="18" y="158" width="22" height="18" rx="3" fill="#38BDF8" />
      <rect x="48" y="146" width="22" height="30" rx="3" fill="#2DD4BF" />
      <rect x="78" y="136" width="22" height="40" rx="3" fill="#F59E0B" />
      <rect x="108" y="128" width="22" height="48" rx="3" fill="#34D399" />
      <circle cx="156" cy="152" r="16" fill="url(#clsGold)" />
      <text x="156" y="156" text-anchor="middle" fill="#451A03" font-family="sans-serif" font-size="11" font-weight="800">10đ</text>
