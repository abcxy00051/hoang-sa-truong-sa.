  <!-- Left Card: Active Learning -->
  <g transform="translate(36, 95)">
    <rect width="175" height="205" rx="14" fill="#061629" fill-opacity="0.92" stroke="#38BDF8" stroke-opacity="0.45" />
    <circle cx="87" cy="48" r="24" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="2" />
    <text x="87" y="54" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="16" font-weight="800">08</text>
    <text x="87" y="94" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">CHUYÊN ĐỀ THPT</text>
    <text x="87" y="118" text-anchor="middle" fill="#BAE6FD" font-family="sans-serif" font-size="10">Lịch sử • Địa lý</text>
    <text x="87" y="136" text-anchor="middle" fill="#BAE6FD" font-family="sans-serif" font-size="10">Pháp lý UNCLOS 1982</text>
    <text x="87" y="154" text-anchor="middle" fill="#BAE6FD" font-family="sans-serif" font-size="10">Kinh tế &amp; Môi trường</text>
    <text x="87" y="178" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="10" font-weight="700">100% Có nguồn chuẩn</text>
  </g>

  <!-- Right Card: Real Progress & Badges -->
  <g transform="translate(709, 95)">
    <rect width="175" height="205" rx="14" fill="#061629" fill-opacity="0.92" stroke="#F59E0B" stroke-opacity="0.45" />
    <circle cx="87" cy="48" r="24" fill="#D97706" fill-opacity="0.3" stroke="#FDE047" stroke-width="2" />
    <text x="87" y="54" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="16" font-weight="800">★</text>
    <text x="87" y="94" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">THỬ THÁCH THỰC TẾ</text>
    <text x="87" y="118" text-anchor="middle" fill="#BAE6FD" font-family="sans-serif" font-size="10">Biểu đồ điểm số</text>
    <text x="87" y="136" text-anchor="middle" fill="#BAE6FD" font-family="sans-serif" font-size="10">Huy hiệu thành tích</text>
    <text x="87" y="154" text-anchor="middle" fill="#BAE6FD" font-family="sans-serif" font-size="10">Giải thích từng câu</text>
    <text x="87" y="178" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="10" font-weight="700">Lưu theo Tài khoản</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="36" y="425" width="848" height="54" rx="12" fill="#041224" fill-opacity="0.92" stroke="#F59E0B" stroke-opacity="0.45" />
  <text x="460" y="457" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="14" font-weight="800">
    PHÒNG HỌC TƯƠNG TÁC • HỌC TẬP CHỦ ĐỘNG – KHÁM PHÁ KIẾN THỨC – THỬ THÁCH BẢN THÂN
  </text>
</svg>
