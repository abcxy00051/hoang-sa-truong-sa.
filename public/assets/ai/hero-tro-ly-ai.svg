    <text x="18" y="52" fill="#E0F2FE" font-family="sans-serif" font-size="11">• Đội Hoàng Sa kiêm quản Bắc Hải</text>
    <text x="18" y="70" fill="#E0F2FE" font-family="sans-serif" font-size="11">• Châu bản, Mộc bản triều Nguyễn</text>
    <text x="18" y="88" fill="#FDE68A" font-family="monospace" font-size="10">AI Knowledge Graph: Verified</text>
  </g>

  <g transform="translate(42, 205)">
    <rect width="235" height="105" rx="14" fill="#071E38" fill-opacity="0.92" stroke="#F59E0B" stroke-opacity="0.5" />
    <text x="18" y="30" fill="#FDE68A" font-family="sans-serif" font-size="12" font-weight="800">PHÁP LÝ BIỂN QUỐC TẾ</text>
    <text x="18" y="52" fill="#E0F2FE" font-family="sans-serif" font-size="11">• Công ước Luật Biển UNCLOS 1982</text>
    <text x="18" y="70" fill="#E0F2FE" font-family="sans-serif" font-size="11">• Luật Biển Việt Nam năm 2012</text>
    <text x="18" y="88" fill="#67E8F9" font-family="monospace" font-size="10">5 Vùng biển • Điều 121</text>
  </g>

  <!-- Right Knowledge Nodes: Bản đồ GIS & Coze AI Engine -->
  <g transform="translate(643, 72)">
    <rect width="235" height="105" rx="14" fill="#071E38" fill-opacity="0.92" stroke="#38BDF8" stroke-opacity="0.5" />
    <text x="18" y="30" fill="#67E8F9" font-family="sans-serif" font-size="12" font-weight="800">BẢN ĐỒ SỐ &amp; ĐỊA LÝ BIỂN</text>
    <text x="18" y="52" fill="#E0F2FE" font-family="sans-serif" font-size="11">• Tọa độ Hoàng Sa &amp; Trường Sa</text>
    <text x="18" y="70" fill="#E0F2FE" font-family="sans-serif" font-size="11">• Kinh tế biển &amp; Hệ sinh thái</text>
    <text x="18" y="88" fill="#FDE68A" font-family="monospace" font-size="10">GIS Telemetry Connected</text>
  </g>

  <g transform="translate(643, 205)">
    <rect width="235" height="105" rx="14" fill="#071E38" fill-opacity="0.92" stroke="#34D399" stroke-opacity="0.5" />
    <text x="18" y="30" fill="#6EE7B7" font-family="sans-serif" font-size="12" font-weight="800">COZE WEBCHAT SDK 1.2.0</text>
    <text x="18" y="52" fill="#E0F2FE" font-family="sans-serif" font-size="11">• Bot ID: 7699128420429725701</text>
    <text x="18" y="70" fill="#E0F2FE" font-family="sans-serif" font-size="11">• Xác thực Token bảo mật qua Server</text>
    <text x="18" y="88" fill="#6EE7B7" font-family="monospace" font-size="10">Zero Frontend PAT Exposure</text>
  </g>

  <!-- Connector Beams -->
  <g stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" opacity="0.65">
    <line x1="277" y1="125" x2="345" y2="180" />
    <line x1="277" y1="258" x2="335" y2="245" />
    <line x1="643" y1="125" x2="575" y2="180" />
    <line x1="643" y1="258" x2="585" y2="245" />
  </g>

  <!-- Bottom Banner -->
  <rect x="42" y="432" width="836" height="52" rx="12" fill="#041224" fill-opacity="0.92" stroke="#38BDF8" stroke-opacity="0.4" />
  <text x="460" y="463" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="14" font-weight="800">
    TRỢ LÝ AI BIỂN ĐẢO VIỆT NAM • ĐỒNG HÀNH CÙNG HỌC SINH THPT KHÁM PHÁ TRI THỨC CHỦ QUYỀN
  </text>
</svg>
