<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" fill="none">
  <defs>
    <linearGradient id="aiHeroBg" x1="0" y1="0" x2="920" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#031326" />
      <stop offset="50%" stop-color="#08284B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="aiCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="aiGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="920" height="520" rx="24" fill="url(#aiHeroBg)" />

  <!-- Digital GIS Grid & Neural Network Lines -->
  <g stroke="#38BDF8" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="104" x2="920" y2="104" stroke-dasharray="6 6" />
    <line x1="0" y1="208" x2="920" y2="208" />
    <line x1="0" y1="312" x2="920" y2="312" stroke-dasharray="6 6" />
    <line x1="0" y1="416" x2="920" y2="416" />
    <line x1="184" y1="0" x2="184" y2="520" />
    <line x1="368" y1="0" x2="368" y2="520" stroke-dasharray="6 6" />
    <line x1="552" y1="0" x2="552" y2="520" />
    <line x1="736" y1="0" x2="736" y2="520" stroke-dasharray="6 6" />
  </g>

  <!-- Central AI Core & Radar Map Hub -->
  <g transform="translate(460, 235)">
    <circle r="165" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle r="128" fill="#061D36" fill-opacity="0.75" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2" />
    <circle r="92" fill="none" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 5" />

    <!-- Stylized Vietnam Coast & Archipelagos inside AI Radar -->
    <path d="M-38,-68 C-15,-52 -22,-30 -36,-12 C-50,6 -18,32 5,58 C22,78 18,105 -8,122"
          stroke="url(#aiGold)" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="32" cy="-12" r="8" fill="#EF4444" stroke="#FEF08A" stroke-width="2" />
    <text x="46" y="-8" fill="#FEF08A" font-family="sans-serif" font-size="11" font-weight="700">Hoàng Sa</text>
    <circle cx="52" cy="56" r="8" fill="#EF4444" stroke="#FEF08A" stroke-width="2" />
    <text x="66" y="60" fill="#FEF08A" font-family="sans-serif" font-size="11" font-weight="700">Trường Sa</text>

    <!-- AI Sparkle Core Badge -->
    <circle cx="-18" cy="18" r="26" fill="url(#aiCyan)" fill-opacity="0.25" stroke="#67E8F9" stroke-width="2" />
    <path d="M-18,0 L-13,13 L0,18 L-13,23 L-18,36 L-23,23 L-36,18 L-23,13 Z" fill="#FDE047" />
  </g>

  <!-- Left Knowledge Nodes: Lịch sử & Pháp lý -->
  <g transform="translate(42, 72)">
    <rect width="235" height="105" rx="14" fill="#071E38" fill-opacity="0.92" stroke="#38BDF8" stroke-opacity="0.5" />
