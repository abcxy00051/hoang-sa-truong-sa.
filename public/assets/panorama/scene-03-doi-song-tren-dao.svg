<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" fill="none">
  <defs>
    <linearGradient id="lifeSky360" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#041026" />
      <stop offset="35%" stop-color="#0C2D5E" />
      <stop offset="56%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#051833" />
    </linearGradient>
  </defs>

  <rect width="2400" height="1200" fill="url(#lifeSky360)" />

  <!-- Spherical Grid -->
  <g stroke="#7DD3FC" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="10 8">
    <line x1="0" y1="300" x2="2400" y2="300" />
    <line x1="0" y1="600" x2="2400" y2="600" stroke="#FBBF24" stroke-opacity="0.38" stroke-dasharray="none" />
    <line x1="0" y1="900" x2="2400" y2="900" />
    <line x1="600" y1="0" x2="600" y2="1200" />
    <line x1="1200" y1="0" x2="1200" y2="1200" />
    <line x1="1800" y1="0" x2="1800" y2="1200" />
  </g>

  <path d="M0 620 Q600 595 1200 620 T2400 620 L2400 1200 L0 1200 Z" fill="#0369A1" fill-opacity="0.72" />

  <!-- Left Zone: Trường học, Bệnh xá Quân dân y & Chùa trên đảo -->
  <g transform="translate(210, 420)">
    <rect x="40" y="90" width="210" height="110" rx="10" fill="#1E3A8A" stroke="#FDE047" stroke-width="2.5" />
    <polygon points="25,90 145,35 265,90" fill="#DC2626" stroke="#FEF08A" stroke-width="2" />
    <rect x="285" y="100" width="175" height="100" rx="10" fill="#0F2952" stroke="#38BDF8" stroke-width="2.5" />
    <path d="M362 122 L382 122 M372 112 L372 132" stroke="#EF4444" stroke-width="5" />
    <text x="250" y="255" text-anchor="middle" fill="#FEF08A" font-family="Inter, sans-serif" font-size="22" font-weight="800">TRƯỜNG HỌC &amp; BỆNH XÁ QUÂN DÂN Y THỊ TRẤN TRƯỜNG SA</text>
  </g>

  <!-- Center Zone: Cụm Nhà giàn DK1 trên Thềm lục địa phía Nam -->
  <g transform="translate(980, 340)">
    <line x1="130" y1="160" x2="95" y2="310" stroke="#FBBF24" stroke-width="6" />
    <line x1="310" y1="160" x2="345" y2="310" stroke="#FBBF24" stroke-width="6" />
    <line x1="110" y1="235" x2="330" y2="235" stroke="#38BDF8" stroke-width="4" />
    <rect x="85" y="75" width="270" height="88" rx="10" fill="#0F2952" stroke="#FEF08A" stroke-width="3" />
    <rect x="145" y="38" width="150" height="37" rx="6" fill="#0284C7" stroke="#BAE6FD" stroke-width="2" />
    <text x="220" y="365" text-anchor="middle" fill="#FEF08A" font-family="Inter, sans-serif" font-size="24" font-weight="800">CỤM NHÀ GIÀN DK1 — THỀM LỤC ĐỊA PHÍA NAM TỔ QUỐC</text>
  </g>

  <!-- Right Zone: Âu tàu & Làng chài Ngư dân bám biển -->
  <g transform="translate(1680, 440)">
    <path d="M60 175 L390 175 L355 230 L95 230 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
    <rect x="165" y="120" width="120" height="55" rx="6" fill="#1E3A8A" stroke="#93C5FD" stroke-width="2" />
    <line x1="225" y1="68" x2="225" y2="120" stroke="#FEF08A" stroke-width="3" />
    <rect x="225" y="68" width="48" height="30" fill="#EF4444" />
    <text x="225" y="285" text-anchor="middle" fill="#BAE6FD" font-family="Inter, sans-serif" font-size="22" font-weight="800">ÂU TÀU TRÁNH BÃO &amp; NGƯ DÂN VƯƠN KHƠI BÁM BIỂN</text>
  </g>
</svg>
