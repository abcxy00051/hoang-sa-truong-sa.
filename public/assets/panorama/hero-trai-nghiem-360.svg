<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" fill="none">
  <defs>
    <linearGradient id="sky360" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020817" />
      <stop offset="38%" stop-color="#082046" />
      <stop offset="68%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#04142E" />
    </linearGradient>
    <linearGradient id="sea360" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#0E7490" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#041026" stop-opacity="0.96" />
    </linearGradient>
    <radialGradient id="sunGlow360" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#020817" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold360" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Panoramic Sky & Ocean Background -->
  <rect width="1400" height="620" fill="url(#sky360)" />
  <circle cx="700" cy="295" r="460" fill="url(#sunGlow360)" />

  <!-- 360 Equirectangular Spherical Grid Projection -->
  <g stroke="#38BDF8" stroke-opacity="0.24" stroke-width="1.2">
    <ellipse cx="700" cy="310" rx="650" ry="255" stroke-dasharray="8 6" />
    <ellipse cx="700" cy="310" rx="520" ry="200" stroke-dasharray="6 6" />
    <ellipse cx="700" cy="310" rx="360" ry="145" />
    <ellipse cx="700" cy="310" rx="190" ry="85" stroke-dasharray="4 4" />
    <path d="M50 310 Q700 175 1350 310" />
    <path d="M50 310 Q700 445 1350 310" />
    <line x1="700" y1="40" x2="700" y2="580" stroke-dasharray="6 6" />
    <line x1="50" y1="310" x2="1350" y2="310" stroke="#FBBF24" stroke-opacity="0.4" />
  </g>

  <!-- Panoramic Ocean Horizon & Waves -->
  <path d="M0 345 Q350 322 700 345 T1400 345 L1400 620 L0 620 Z" fill="url(#sea360)" />
  <path d="M0 405 Q350 382 700 405 T1400 405 L1400 620 L0 620 Z" fill="#04132C" fill-opacity="0.78" />

  <!-- Distant Islands, Coral Atoll Ring & DK1 Platform -->
  <g transform="translate(170, 265)">
    <ellipse cx="120" cy="88" rx="115" ry="22" fill="#0EA5E9" fill-opacity="0.28" stroke="#38BDF8" stroke-width="1.5" />
    <path d="M40 85 Q120 48 200 85 Z" fill="#0C2D5E" stroke="#7DD3FC" stroke-width="1.5" />
    <rect x="114" y="25" width="12" height="45" fill="#E2E8F0" />
    <circle cx="120" cy="20" r="8" fill="#FDE047" />
    <text x="120" y="122" text-anchor="middle" fill="#BAE6FD" font-family="Inter, sans-serif" font-size="12" font-weight="700">QUẦN ĐẢO HOÀNG SA (16°32′B)</text>
  </g>

  <!-- Center Sovereignty Island & Lighthouse 360 Focal Point -->
  <g transform="translate(560, 175)">
    <ellipse cx="140" cy="182" rx="175" ry="34" fill="#22D3EE" fill-opacity="0.24" stroke="#38BDF8" stroke-width="1.8" />
    <path d="M25 178 Q140 125 255 178 Z" fill="#0A254D" stroke="url(#gold360)" stroke-width="2.2" />
    <!-- Lighthouse -->
    <path d="M108 42 L134 42 L142 158 L100 158 Z" fill="#0F172A" stroke="#FBBF24" stroke-width="2" />
    <rect x="102" y="28" width="38" height="14" rx="4" fill="#F59E0B" />
    <circle cx="121" cy="18" r="11" fill="#FEF08A" />
    <!-- Sovereignty Marker -->
    <path d="M168 86 L182 64 L196 86 L196 158 L168 158 Z" fill="#1E293B" stroke="#FDE047" stroke-width="2" />
    <circle cx="182" cy="96" r="6" fill="#EF4444" />
    <text x="182" y="100" text-anchor="middle" fill="#FEF08A" font-size="9" font-weight="900">★</text>
    <text x="140" y="226" text-anchor="middle" fill="#FEF08A" font-family="Inter, sans-serif" font-size="13" font-weight="800">TRƯỜNG SA &amp; CỘT MỐC CHỦ QUYỀN (08°38′B)</text>
  </g>

  <!-- Right DK1 Platform & Marine Ecosystem -->
  <g transform="translate(1015, 250)">
    <line x1="75" y1="55" x2="60" y2="115" stroke="#FBBF24" stroke-width="3" />
    <line x1="115" y1="55" x2="130" y2="115" stroke="#FBBF24" stroke-width="3" />
    <line x1="65" y1="85" x2="125" y2="85" stroke="#38BDF8" stroke-width="2" />
    <rect x="52" y="26" width="86" height="30" rx="5" fill="#0F2952" stroke="#FDE047" stroke-width="2" />
    <rect x="78" y="12" width="34" height="14" rx="3" fill="#0284C7" />
    <text x="95" y="138" text-anchor="middle" fill="#BAE6FD" font-family="Inter, sans-serif" font-size="12" font-weight="700">NHÀ GIÀN DK1 &amp; SINH THÁI BIỂN</text>
  </g>

  <!-- 360 Degree Compass Ring HUD Badge -->
  <g transform="translate(700, 95)">
    <rect x="-215" y="-34" width="430" height="52" rx="26" fill="#041026" fill-opacity="0.86" stroke="url(#gold360)" stroke-width="1.8" />
    <text x="0" y="-4" text-anchor="middle" fill="#FEF08A" font-family="Inter, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">GÓC NHÌN TOÀN CẢNH 360° • LA BÀN 0° – 360°</text>
    <text x="0" y="12" text-anchor="middle" fill="#7DD3FC" font-family="Inter, sans-serif" font-size="11" font-weight="600">XOAY CHUỘT / CẢM ỨNG • HOTSPOT TƯƠNG TÁC • CHÚ THÍCH ĐỊA DANH</text>
  </g>

  <!-- Interactive Hotspot Pulsing Pins -->
  <g transform="translate(290, 255)">
    <circle r="16" fill="#F59E0B" fill-opacity="0.28" />
    <circle r="8" fill="#FDE047" stroke="#041026" stroke-width="2" />
  </g>
  <g transform="translate(742, 240)">
    <circle r="18" fill="#38BDF8" fill-opacity="0.32" />
    <circle r="9" fill="#38BDF8" stroke="#041026" stroke-width="2" />
  </g>
  <g transform="translate(1110, 245)">
    <circle r="16" fill="#10B981" fill-opacity="0.28" />
    <circle r="8" fill="#34D399" stroke="#041026" stroke-width="2" />
  </g>
</svg>
