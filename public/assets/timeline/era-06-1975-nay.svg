<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="era6Bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747" />
      <stop offset="52%" stop-color="#1A718D" />
      <stop offset="100%" stop-color="#113747" />
    </linearGradient>
    <linearGradient id="era6Card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B6E0EB" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="18" fill="url(#era6Bg)" />

  <!-- Nautical Grid Lines -->
  <g stroke="#B6E0EB" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="5 5" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="5 5" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" stroke-dasharray="5 5" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" stroke-dasharray="5 5" />
  </g>

  <!-- Header Banner -->
  <rect x="24" y="20" width="752" height="52" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="2" />
  <rect x="38" y="31" width="136" height="30" rx="8" fill="#29B4D1" />
  <text x="106" y="51" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="12.5" font-weight="900">
    GIAI ĐOẠN 06
  </text>
  <text x="190" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900">
    TỪ NĂM 1975 ĐẾN NAY: QUẢN LÝ THỐNG NHẤT, LUẬT BIỂN &amp; BỀN VỮNG
  </text>
  <text x="190" y="63" fill="#B6E0EB" font-family="sans-serif" font-size="11.5" font-weight="700">
    Huyện đảo Hoàng Sa &amp; Trường Sa (1982) • Nhà giàn DK1 (1989) • UNCLOS 1982 (1994) • Luật Biển Việt Nam (2012)
  </text>

  <!-- Left Visual Panel: Modern Legal & Administrative Architecture -->
  <g transform="translate(24, 88)">
    <rect width="348" height="296" rx="14" fill="#113747" stroke="#29B4D1" stroke-width="1.8" />
    <text x="174" y="28" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="12" font-weight="900">
      HỆ THỐNG HÀNH CHÍNH &amp; PHÁP LÝ BIỂN HIỆN ĐẠI
    </text>
    <line x1="20" y1="38" x2="328" y2="38" stroke="#1A718D" stroke-width="1.5" />

    <!-- 2 Island Districts Row -->
    <rect x="20" y="50" width="148" height="74" rx="10" fill="url(#era6Card)" stroke="#29B4D1" stroke-width="1.5" />
    <text x="94" y="70" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="11" font-weight="900">HUYỆN ĐẢO HOÀNG SA</text>
    <text x="94" y="88" text-anchor="middle" fill="#1A718D" font-family="sans-serif" font-size="10" font-weight="800">Trực thuộc TP. Đà Nẵng</text>
    <text x="94" y="106" text-anchor="middle" fill="#455C68" font-family="sans-serif" font-size="9.5" font-weight="700">(Quyết định 194-HĐBT 1982)</text>

    <rect x="180" y="50" width="148" height="74" rx="10" fill="url(#era6Card)" stroke="#29B4D1" stroke-width="1.5" />
    <text x="254" y="70" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="11" font-weight="900">HUYỆN ĐẢO TRƯỜNG SA</text>
    <text x="254" y="88" text-anchor="middle" fill="#1A718D" font-family="sans-serif" font-size="10" font-weight="800">Trực thuộc Tỉnh Khánh Hòa</text>
    <text x="254" y="106" text-anchor="middle" fill="#455C68" font-family="sans-serif" font-size="9.5" font-weight="700">TT. Trường Sa, Song Tử Tây, Sinh Tồn</text>

    <!-- 5 Maritime Zones Diagram (Luật Biển Việt Nam 2012 & UNCLOS 1982) -->
    <rect x="20" y="136" width="308" height="144" rx="10" fill="#1A718D" stroke="#29B4D1" stroke-width="1.5" />
    <text x="174" y="156" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900">
      5 VÙNG BIỂN THEO LUẬT BIỂN VIỆT NAM 2012 &amp; UNCLOS 1982
    </text>

    <g transform="translate(30, 168)" font-family="sans-serif">
      <rect x="0" y="0" width="138" height="28" rx="6" fill="#B6E0EB" />
      <text x="69" y="18" text-anchor="middle" fill="#113747" font-size="10" font-weight="900">1. Nội thủy (Đường cơ sở)</text>

      <rect x="150" y="0" width="138" height="28" rx="6" fill="#B6E0EB" />
      <text x="219" y="18" text-anchor="middle" fill="#113747" font-size="10" font-weight="900">2. Lãnh hải (12 hải lý)</text>

      <rect x="0" y="36" width="138" height="28" rx="6" fill="#B6E0EB" />
      <text x="69" y="54" text-anchor="middle" fill="#113747" font-size="10" font-weight="900">3. Tiếp giáp lãnh hải (24hl)</text>

      <rect x="150" y="36" width="138" height="28" rx="6" fill="#29B4D1" />
      <text x="219" y="54" text-anchor="middle" fill="#113747" font-size="10" font-weight="900">4. Đặc quyền kinh tế 200hl</text>

      <rect x="0" y="72" width="288" height="28" rx="6" fill="#113747" stroke="#29B4D1" stroke-width="1.2" />
      <text x="144" y="90" text-anchor="middle" fill="#29B4D1" font-size="10" font-weight="900">5. Thềm lục địa &amp; Cụm Trạm Nhà giàn DK1 (1989)</text>
    </g>
  </g>

  <!-- Right Panel: 4 Key Historical Milestones of Era 6 -->
  <g transform="translate(388, 88)">
    <rect width="388" height="68" rx="10" fill="url(#era6Card)" stroke="#29B4D1" stroke-width="1.6" />
    <rect x="12" y="12" width="106" height="20" rx="5" fill="#113747" />
    <text x="65" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">THÁNG 11 &amp; 12/1982</text>
    <text x="128" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Đường cơ sở (A1–A11) &amp; Lập 2 Huyện đảo</text>
    <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
      Tuyên bố đường cơ sở 12/11/1982; lập huyện Hoàng Sa &amp; huyện Trường Sa.
    </text>

    <g transform="translate(0, 76)">
      <rect width="388" height="68" rx="10" fill="url(#era6Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="106" height="20" rx="5" fill="#113747" />
      <text x="65" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">1988 – 1989 – 1994</text>
      <text x="128" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Nhà giàn DK1 &amp; Phê chuẩn UNCLOS 1982</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Lập cụm trạm DK1 (1989); Quốc hội phê chuẩn Công ước Luật Biển (23/6/1994).
      </text>
    </g>

    <g transform="translate(0, 152)">
      <rect width="388" height="68" rx="10" fill="url(#era6Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="106" height="20" rx="5" fill="#113747" />
      <text x="65" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">NGÀY 21/6/2012</text>
      <text x="128" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Quốc hội thông qua Luật Biển Việt Nam</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Luật số 18/2012/QH13 gồm 7 chương, 55 điều bảo vệ chủ quyền hòa bình.
      </text>
    </g>

    <g transform="translate(0, 228)">
      <rect width="388" height="68" rx="10" fill="url(#era6Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="106" height="20" rx="5" fill="#1A718D" />
      <text x="65" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9.5" font-weight="900">2014 – 2018 – NAY</text>
      <text x="128" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Di sản UNESCO &amp; Chiến lược Biển 2030–2045</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        UNESCO vinh danh Châu bản (2014); Nghị quyết 36-NQ/TW kinh tế biển bền vững.
      </text>
    </g>
  </g>

  <!-- Footer Summary Bar -->
  <rect x="24" y="398" width="752" height="36" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="1.5" />
  <text x="400" y="421" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="12" font-weight="800">
    HOÀN THIỆN KHUNG PHÁP LÝ QUỐC GIA – QUỐC TẾ &amp; PHÁT TRIỂN BỀN VỮNG KINH TẾ BIỂN VIỆT NAM
  </text>
</svg>
