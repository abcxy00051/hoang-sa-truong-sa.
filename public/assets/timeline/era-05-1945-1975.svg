<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="era5Bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747" />
      <stop offset="52%" stop-color="#1A718D" />
      <stop offset="100%" stop-color="#113747" />
    </linearGradient>
    <linearGradient id="era5Card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B6E0EB" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="18" fill="url(#era5Bg)" />

  <!-- Nautical Grid Lines -->
  <g stroke="#B6E0EB" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="5 5" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="5 5" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" stroke-dasharray="5 5" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" stroke-dasharray="5 5" />
  </g>

  <!-- Header Banner -->
  <rect x="24" y="20" width="752" height="52" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="2" />
  <rect x="38" y="31" width="136" height="30" rx="8" fill="#29B4D1" />
  <text x="106" y="51" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="12.5" font-weight="900">
    GIAI ĐOẠN 05
  </text>
  <text x="190" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900">
    GIAI ĐOẠN 1945 – 1975: ĐẤU TRANH NGOẠI GIAO &amp; TIẾP QUẢN BẢO VỆ
  </text>
  <text x="190" y="63" fill="#B6E0EB" font-family="sans-serif" font-size="11.5" font-weight="700">
    Hội nghị San Francisco (07/9/1951) • Sắc lệnh 143-NV (1956) &amp; 174-NV (1961) • Giải phóng Trường Sa (4/1975)
  </text>

  <!-- Left Visual Panel: San Francisco 1951 & April 1975 Liberation Route -->
  <g transform="translate(24, 88)">
    <rect width="348" height="296" rx="14" fill="#113747" stroke="#29B4D1" stroke-width="1.8" />
    <text x="174" y="28" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="12" font-weight="900">
      PHÁP LÝ QUỐC TẾ 1951 &amp; CHIẾN DỊCH GIẢI PHÓNG 4/1975
    </text>
    <line x1="20" y1="38" x2="328" y2="38" stroke="#1A718D" stroke-width="1.5" />

    <!-- Top Box: San Francisco Conference 1951 -->
    <rect x="20" y="50" width="308" height="96" rx="10" fill="url(#era5Card)" stroke="#29B4D1" stroke-width="1.8" />
    <rect x="32" y="62" width="136" height="20" rx="5" fill="#113747" />
    <text x="100" y="76" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">SAN FRANCISCO 07/9/1951</text>
    <text x="178" y="76" fill="#113747" font-family="sans-serif" font-size="11" font-weight="900">51 Quốc gia tham dự</text>
    <text x="32" y="98" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="800">
      • Phái đoàn Việt Nam tuyên bố khẳng định chủ quyền đã có
    </text>
    <text x="32" y="114" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="800">
      từ lâu đời đối với hai quần đảo Hoàng Sa và Trường Sa.
    </text>
    <text x="32" y="132" fill="#1A718D" font-family="sans-serif" font-size="10" font-weight="900">
      ✓ Không có bất kỳ quốc gia nào phản đối hay bảo lưu.
    </text>

    <!-- Bottom Box: April 1975 Liberation of Truong Sa -->
    <rect x="20" y="158" width="308" height="122" rx="10" fill="#1A718D" stroke="#B6E0EB" stroke-width="1.5" />
    <text x="174" y="178" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900">
      HẢI QUÂN NHÂN DÂN VIỆT NAM GIẢI PHÓNG TRƯỜNG SA (4/1975)
    </text>

    <!-- 5 Island Liberation Badges -->
    <g transform="translate(30, 190)" font-family="sans-serif">
      <rect x="0" y="0" width="88" height="34" rx="6" fill="#B6E0EB" />
      <text x="44" y="15" text-anchor="middle" fill="#113747" font-size="9.5" font-weight="900">14/4/1975</text>
      <text x="44" y="28" text-anchor="middle" fill="#1A718D" font-size="9.5" font-weight="800">Song Tử Tây</text>

      <rect x="98" y="0" width="88" height="34" rx="6" fill="#B6E0EB" />
      <text x="142" y="15" text-anchor="middle" fill="#113747" font-size="9.5" font-weight="900">25/4/1975</text>
      <text x="142" y="28" text-anchor="middle" fill="#1A718D" font-size="9.5" font-weight="800">Đảo Sơn Ca</text>

      <rect x="196" y="0" width="92" height="34" rx="6" fill="#B6E0EB" />
      <text x="242" y="15" text-anchor="middle" fill="#113747" font-size="9.5" font-weight="900">27/4/1975</text>
      <text x="242" y="28" text-anchor="middle" fill="#1A718D" font-size="9.5" font-weight="800">Đảo Nam Yết</text>

      <rect x="36" y="42" width="102" height="34" rx="6" fill="#B6E0EB" />
      <text x="87" y="57" text-anchor="middle" fill="#113747" font-size="9.5" font-weight="900">28/4/1975</text>
      <text x="87" y="70" text-anchor="middle" fill="#1A718D" font-size="9.5" font-weight="800">Đảo Sinh Tồn</text>

      <rect x="150" y="42" width="114" height="34" rx="6" fill="#29B4D1" stroke="#FFFFFF" stroke-width="1.5" />
      <text x="207" y="57" text-anchor="middle" fill="#113747" font-size="9.5" font-weight="900">29/4/1975</text>
      <text x="207" y="70" text-anchor="middle" fill="#113747" font-size="9.5" font-weight="900">Đảo Trường Sa</text>
    </g>
  </g>

  <!-- Right Panel: 4 Key Historical Milestones of Era 5 -->
  <g transform="translate(388, 88)">
    <rect width="388" height="68" rx="10" fill="url(#era5Card)" stroke="#29B4D1" stroke-width="1.6" />
    <rect x="12" y="12" width="104" height="20" rx="5" fill="#113747" />
    <text x="64" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">NGÀY 07/9/1951</text>
    <text x="126" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Tuyên bố tại Hội nghị San Francisco</text>
    <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
      Khẳng định chủ quyền lâu đời của Việt Nam trước đại diện 51 quốc gia.
    </text>

    <g transform="translate(0, 76)">
      <rect width="388" height="68" rx="10" fill="url(#era5Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="104" height="20" rx="5" fill="#113747" />
      <text x="64" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">1956 – 1973</text>
      <text x="126" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Sắc lệnh 143-NV, 174-NV &amp; NĐ 420-BNV</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Đặt Trường Sa thuộc tỉnh Phước Tuy; Hoàng Sa (xã Định Hải) thuộc Quảng Nam.
      </text>
    </g>

    <g transform="translate(0, 152)">
      <rect width="388" height="68" rx="10" fill="url(#era5Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="104" height="20" rx="5" fill="#113747" />
      <text x="64" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">THÁNG 01/1974</text>
      <text x="126" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Phản đối hành vi dùng vũ lực tại Hoàng Sa</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Luật quốc tế khẳng định dùng vũ lực bất hợp pháp không tạo ra chủ quyền.
      </text>
    </g>

    <g transform="translate(0, 228)">
      <rect width="388" height="68" rx="10" fill="url(#era5Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="104" height="20" rx="5" fill="#1A718D" />
      <text x="64" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9.5" font-weight="900">14/4 – 29/4/1975</text>
      <text x="126" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Hải quân Nhân dân VN giải phóng Trường Sa</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Tiếp quản và bảo vệ vững chắc quần đảo Trường Sa trong mùa Xuân thống nhất.
      </text>
    </g>
  </g>

  <!-- Footer Summary Bar -->
  <rect x="24" y="398" width="752" height="36" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="1.5" />
  <text x="400" y="421" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="12" font-weight="800">
    KẾ THỪA PHÁP LÝ QUỐC TẾ LIÊN TỤC &amp; BẢO VỆ TOÀN VẸN CHỦ QUYỀN BIỂN ĐẢO TỔ QUỐC
  </text>
</svg>
