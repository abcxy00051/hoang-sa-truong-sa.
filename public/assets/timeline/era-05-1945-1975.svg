  <text x="38" y="102" fill="#E0F2FE" font-family="sans-serif" font-size="11">• 1956: Đặt quần đảo Trường Sa thuộc Phước Tuy</text>
  <text x="38" y="124" fill="#E0F2FE" font-family="sans-serif" font-size="11">• 1961: Đặt xã Định Hải (Hoàng Sa) thuộc Quảng Nam</text>
  <text x="38" y="146" fill="#E0F2FE" font-family="sans-serif" font-size="11">• Tháng 4/1975: Hải quân nhân dân VN giải phóng Trường Sa</text>
