<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="era3Bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747" />
      <stop offset="52%" stop-color="#1A718D" />
      <stop offset="100%" stop-color="#113747" />
    </linearGradient>
    <linearGradient id="era3Card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B6E0EB" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="18" fill="url(#era3Bg)" />

  <!-- Nautical Grid Lines -->
  <g stroke="#B6E0EB" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="5 5" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="5 5" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" stroke-dasharray="5 5" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" stroke-dasharray="5 5" />
  </g>

  <!-- Header Banner -->
  <rect x="24" y="20" width="752" height="52" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="2" />
  <rect x="38" y="31" width="136" height="30" rx="8" fill="#29B4D1" />
  <text x="106" y="51" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="12.5" font-weight="900">
    GIAI ĐOẠN 03
  </text>
  <text x="190" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900">
    THỜI NGUYỄN (1802 – 1884): CHÂU BẢN, THỦY QUÂN ĐO ĐẠC &amp; CẮM MỐC
  </text>
  <text x="190" y="63" fill="#B6E0EB" font-family="sans-serif" font-size="11.5" font-weight="700">
    Vua Gia Long (1816) • Vua Minh Mạng (1833–1836) • Phạm Hữu Nhật cắm mốc • Đại Nam nhất thống toàn đồ (1838)
  </text>

  <!-- Left Visual Panel: 1836 Sovereignty Marker & UNESCO Chau Ban -->
  <g transform="translate(24, 88)">
    <rect width="348" height="296" rx="14" fill="#113747" stroke="#29B4D1" stroke-width="1.8" />
    <text x="174" y="28" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="12" font-weight="900">
      CỘT MỐC CHỦ QUYỀN NĂM 1836 &amp; CHÂU BẢN UNESCO
    </text>
    <line x1="20" y1="38" x2="328" y2="38" stroke="#1A718D" stroke-width="1.5" />

    <!-- Wooden Marker Pillar (Bài gỗ năm Bính Thân 1836) -->
    <rect x="24" y="52" width="126" height="224" rx="10" fill="url(#era3Card)" stroke="#29B4D1" stroke-width="2" />
    <rect x="32" y="60" width="110" height="208" rx="6" fill="none" stroke="#113747" stroke-width="1.2" stroke-dasharray="4 3" />
    <rect x="42" y="68" width="90" height="20" rx="5" fill="#113747" />
    <text x="87" y="82" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">BÀI GỖ NĂM 1836</text>
    <text x="87" y="106" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="10" font-weight="900">MINH MẠNG</text>
    <text x="87" y="122" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="10" font-weight="900">THẬP THẤT NIÊN</text>
    <text x="87" y="138" text-anchor="middle" fill="#1A718D" font-family="sans-serif" font-size="9.5" font-weight="800">(Năm Bính Thân)</text>
    <line x1="48" y1="148" x2="126" y2="148" stroke="#1A718D" stroke-width="1" />
    <text x="87" y="166" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9.5" font-weight="800">Thủy quân Chánh</text>
    <text x="87" y="180" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9.5" font-weight="800">đội trưởng suất đội</text>
    <text x="87" y="196" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="900">PHẠM HỮU NHẬT</text>
    <text x="87" y="214" text-anchor="middle" fill="#455C68" font-family="sans-serif" font-size="9" font-weight="700">vâng mệnh ra Hoàng Sa</text>
    <text x="87" y="228" text-anchor="middle" fill="#455C68" font-family="sans-serif" font-size="9" font-weight="700">trông nom đo đạc</text>
    <text x="87" y="242" text-anchor="middle" fill="#455C68" font-family="sans-serif" font-size="9" font-weight="700">lưu dấu để ghi nhớ</text>

    <!-- Right side of Visual Panel: Chau Ban & Maps -->
    <rect x="164" y="52" width="164" height="106" rx="10" fill="#1A718D" stroke="#B6E0EB" stroke-width="1.5" />
    <text x="246" y="74" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900">CHÂU BẢN TRIỀU NGUYỄN</text>
    <text x="246" y="92" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="9.5" font-weight="800">Di sản tư liệu UNESCO (2014)</text>
    <text x="246" y="112" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9.5" font-weight="700">Ngự phê mực son của</text>
    <text x="246" y="126" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9.5" font-weight="700">Hoàng đế cử Thủy quân</text>
    <text x="246" y="140" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">cắm 10 bài gỗ / mỗi thuyền</text>

    <rect x="164" y="170" width="164" height="106" rx="10" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.5" />
    <text x="246" y="192" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="900">QUỐC ĐỒ NĂM 1838</text>
    <text x="246" y="210" text-anchor="middle" fill="#1A718D" font-family="sans-serif" font-size="9.5" font-weight="800">Đại Nam nhất thống toàn đồ</text>
    <text x="246" y="228" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9.5" font-weight="700">&amp; An Nam đại quốc họa đồ</text>
    <text x="246" y="246" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9.5" font-weight="900">&quot;Paracel seu Cát Vàng&quot;</text>
    <text x="246" y="262" text-anchor="middle" fill="#455C68" font-family="sans-serif" font-size="9" font-weight="700">(Hoàng Sa &amp; Vạn Lý Trường Sa)</text>
  </g>

  <!-- Right Panel: 4 Key Historical Milestones of Era 3 -->
  <g transform="translate(388, 88)">
    <rect width="388" height="68" rx="10" fill="url(#era3Card)" stroke="#29B4D1" stroke-width="1.6" />
    <rect x="12" y="12" width="102" height="20" rx="5" fill="#113747" />
    <text x="63" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">NĂM 1815 – 1816</text>
    <text x="124" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Vua Gia Long cử Thủy quân &amp; Phạm Quang Ảnh</text>
    <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
      Chính quy hóa hoạt động thăm dò, đo đạc thủy trình và khẳng định chủ quyền.
    </text>

    <g transform="translate(0, 76)">
      <rect width="388" height="68" rx="10" fill="url(#era3Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="102" height="20" rx="5" fill="#113747" />
      <text x="63" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">NĂM 1833 – 1835</text>
      <text x="124" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Vua Minh Mạng dựng miếu đá, lập bia, trồng cây</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Cai đội Phạm Văn Nguyên dựng miếu Hoàng Sa, lập bia đá, bảo đảm hàng hải.
      </text>
    </g>

    <g transform="translate(0, 152)">
      <rect width="388" height="68" rx="10" fill="url(#era3Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="102" height="20" rx="5" fill="#113747" />
      <text x="63" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">NĂM 1836</text>
      <text x="124" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Suất đội Phạm Hữu Nhật cắm mốc &amp; vẽ bản đồ</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Châu bản Minh Mạng thứ 17 phê chuẩn đo đạc từng đảo và cắm bài gỗ khắc chữ.
      </text>
    </g>

    <g transform="translate(0, 228)">
      <rect width="388" height="68" rx="10" fill="url(#era3Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="102" height="20" rx="5" fill="#1A718D" />
      <text x="63" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9.5" font-weight="900">NĂM 1838</text>
      <text x="124" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Đại Nam nhất thống toàn đồ &amp; Bản đồ Taberd</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Đối chứng song phương Quốc đồ Đại Nam và bản đồ phương Tây thế kỷ XIX.
      </text>
    </g>
  </g>

  <!-- Footer Summary Bar -->
  <rect x="24" y="398" width="752" height="36" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="1.5" />
  <text x="400" y="421" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="12" font-weight="800">
    THỰC THI CHỦ QUYỀN CẤP ĐỘ THỦY QUÂN NHÀ NƯỚC • DI SẢN TƯ LIỆU THẾ GIỚI UNESCO
  </text>
</svg>
