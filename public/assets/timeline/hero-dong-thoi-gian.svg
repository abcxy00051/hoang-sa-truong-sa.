<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" fill="none">
  <defs>
    <linearGradient id="tlHeroBg" x1="0" y1="0" x2="940" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A0F07" />
      <stop offset="48%" stop-color="#2D1A0C" />
      <stop offset="100%" stop-color="#07223F" />
    </linearGradient>
    <linearGradient id="tlParchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="tlGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="940" height="520" rx="24" fill="url(#tlHeroBg)" />

  <!-- Vintage Cartographic Grid -->
  <g stroke="#F59E0B" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="104" x2="940" y2="104" stroke-dasharray="6 6" />
    <line x1="0" y1="208" x2="940" y2="208" />
    <line x1="0" y1="312" x2="940" y2="312" stroke-dasharray="6 6" />
    <line x1="0" y1="416" x2="940" y2="416" />
    <line x1="188" y1="0" x2="188" y2="520" />
    <line x1="376" y1="0" x2="376" y2="520" stroke-dasharray="6 6" />
    <line x1="564" y1="0" x2="564" y2="520" />
    <line x1="752" y1="0" x2="752" y2="520" stroke-dasharray="6 6" />
  </g>

  <!-- Left: Ancient Imperial Scroll (Châu bản triều Nguyễn & Sử liệu gốc) -->
  <g transform="translate(42, 48)">
    <rect width="315" height="352" rx="14" fill="url(#tlParchment)" stroke="#D97706" stroke-width="3" />
    <rect x="12" y="12" width="291" height="328" rx="8" stroke="#92400E" stroke-opacity="0.4" stroke-width="1.5" />
    <!-- Imperial Vermilion Seal -->
    <rect x="222" y="26" width="66" height="66" rx="6" fill="#DC2626" fill-opacity="0.16" stroke="#DC2626" stroke-width="2" />
    <text x="255" y="54" text-anchor="middle" fill="#B91C1C" font-family="serif" font-size="11" font-weight="800">CHÂU BẢN</text>
    <text x="255" y="72" text-anchor="middle" fill="#B91C1C" font-family="serif" font-size="10" font-weight="800">TRIỀU NGUYỄN</text>

    <text x="26" y="46" fill="#78350F" font-family="serif" font-size="15" font-weight="800">DI SẢN TƯ LIỆU LỊCH SỬ</text>
    <line x1="26" y1="58" x2="205" y2="58" stroke="#B45309" stroke-width="2" />

    <text x="26" y="88" fill="#451A03" font-family="sans-serif" font-size="11" font-weight="700">• 1490: Hồng Đức bản đồ (Thời Lê sơ)</text>
    <text x="26" y="114" fill="#451A03" font-family="sans-serif" font-size="11" font-weight="700">• 1686: Thiên Nam tứ chí lộ đồ thư</text>
    <text x="26" y="140" fill="#451A03" font-family="sans-serif" font-size="11" font-weight="700">• 1776: Phủ biên tạp lục (Lê Quý Đôn)</text>
    <text x="26" y="166" fill="#451A03" font-family="sans-serif" font-size="11" font-weight="700">• 1816: Vua Gia Long khảo sát Hoàng Sa</text>
    <text x="26" y="192" fill="#451A03" font-family="sans-serif" font-size="11" font-weight="700">• 1836: Phạm Hữu Nhật dựng bia chủ quyền</text>
    <text x="26" y="218" fill="#451A03" font-family="sans-serif" font-size="11" font-weight="700">• 1838: Đại Nam nhất thống toàn đồ</text>
    <text x="26" y="244" fill="#451A03" font-family="sans-serif" font-size="11" font-weight="700">• 1933 &amp; 1938: Nghị định hành chính</text>
    <text x="26" y="270" fill="#451A03" font-family="sans-serif" font-size="11" font-weight="700">• 1951: Hội nghị San Francisco</text>

    <rect x="26" y="290" width="263" height="36" rx="8" fill="#78350F" />
    <text x="157" y="313" text-anchor="middle" fill="#FEF3C7" font-family="sans-serif" font-size="11" font-weight="800">
      6 GIAI ĐOẠN • 24 CỘT MỐC KIỂM CHỨNG
    </text>
  </g>

  <!-- Right: Historical Map & Timeline Arc across Centuries -->
  <g transform="translate(395, 48)">
    <rect width="503" height="352" rx="18" fill="#071B33" fill-opacity="0.9" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="2" />
    <text x="28" y="38" fill="#FDE68A" font-family="serif" font-size="15" font-weight="800">
      ĐẠI NAM NHẤT THỐNG TOÀN ĐỒ &amp; DÒNG CHẢY THỜI GIAN
    </text>
    <line x1="28" y1="50" x2="475" y2="50" stroke="#38BDF8" stroke-opacity="0.3" />

    <!-- Stylized Coast & Archipelagos -->
    <path d="M95,78 C122,98 112,126 98,150 C84,174 118,205 142,238 C160,265 152,298 122,320"
          stroke="url(#tlGold)" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="215" cy="148" r="11" fill="#EF4444" stroke="#FEF08A" stroke-width="2.5" />
    <text x="234" y="145" fill="#FEF08A" font-family="serif" font-size="13" font-weight="800">HOÀNG SA</text>
    <text x="234" y="162" fill="#BAE6FD" font-family="sans-serif" font-size="10">(Bãi Cát Vàng)</text>

    <circle cx="242" cy="248" r="11" fill="#EF4444" stroke="#FEF08A" stroke-width="2.5" />
    <text x="261" y="245" fill="#FEF08A" font-family="serif" font-size="13" font-weight="800">VẠN LÝ TRƯỜNG SA</text>
    <text x="261" y="262" fill="#BAE6FD" font-family="sans-serif" font-size="10">(Quần đảo Trường Sa)</text>

    <!-- 6 Chronological Era Badges on Right Column -->
    <g transform="translate(345, 72)">
      <rect width="132" height="36" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.6" />
      <text x="66" y="22" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="10" font-weight="700">1. Trước Thế kỷ XVII</text>

      <rect y="44" width="132" height="36" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.6" />
      <text x="66" y="66" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="10" font-weight="700">2. Thế kỷ XVII – XVIII</text>

      <rect y="88" width="132" height="36" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.6" />
      <text x="66" y="110" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="10" font-weight="700">3. Thời Nguyễn</text>

      <rect y="132" width="132" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.6" />
      <text x="66" y="154" text-anchor="middle" fill="#BAE6FD" font-family="sans-serif" font-size="10" font-weight="700">4. Thời Pháp thuộc</text>

      <rect y="176" width="132" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.6" />
      <text x="66" y="198" text-anchor="middle" fill="#BAE6FD" font-family="sans-serif" font-size="10" font-weight="700">5. Giai đoạn 1945–1975</text>

      <rect y="220" width="132" height="36" rx="8" fill="#1E293B" stroke="#34D399" stroke-opacity="0.7" />
      <text x="66" y="242" text-anchor="middle" fill="#A7F3D0" font-family="sans-serif" font-size="10" font-weight="700">6. Từ 1975 đến nay</text>
    </g>
  </g>

  <!-- Bottom Timeline Axis Track -->
  <rect x="42" y="426" width="856" height="58" rx="14" fill="#091526" fill-opacity="0.94" stroke="#F59E0B" stroke-opacity="0.45" />
  <line x1="95" y1="455" x2="845" y2="455" stroke="url(#tlGold)" stroke-width="3" />
  <circle cx="120" cy="455" r="8" fill="#FDE047" />
  <circle cx="265" cy="455" r="8" fill="#FDE047" />
  <circle cx="410" cy="455" r="8" fill="#FDE047" />
  <circle cx="555" cy="455" r="8" fill="#38BDF8" />
  <circle cx="700" cy="455" r="8" fill="#38BDF8" />
  <circle cx="825" cy="455" r="8" fill="#34D399" />
</svg>
