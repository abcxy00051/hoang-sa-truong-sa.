<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="era4Bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747" />
      <stop offset="52%" stop-color="#1A718D" />
      <stop offset="100%" stop-color="#113747" />
    </linearGradient>
    <linearGradient id="era4Card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B6E0EB" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="18" fill="url(#era4Bg)" />

  <!-- Nautical Grid Lines -->
  <g stroke="#B6E0EB" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="5 5" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="5 5" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" stroke-dasharray="5 5" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" stroke-dasharray="5 5" />
  </g>

  <!-- Header Banner -->
  <rect x="24" y="20" width="752" height="52" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="2" />
  <rect x="38" y="31" width="136" height="30" rx="8" fill="#29B4D1" />
  <text x="106" y="51" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="12.5" font-weight="900">
    GIAI ĐOẠN 04
  </text>
  <text x="190" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900">
    THỜI PHÁP THUỘC (1884 – 1945): QUẢN LÝ HÀNH CHÍNH &amp; KHOA HỌC
  </text>
  <text x="190" y="63" fill="#B6E0EB" font-family="sans-serif" font-size="11.5" font-weight="700">
    Tàu De Lanessan (1925) • Nghị định 4762-CP (1933) • Dụ số 10 &amp; Nghị định 156-SC (1938) • Bia chủ quyền &amp; Trạm khí tượng
  </text>

  <!-- Left Visual Panel: 1938 Sovereignty Stele & Pattle Island Weather/Lighthouse Station -->
  <g transform="translate(24, 88)">
    <rect width="348" height="296" rx="14" fill="#113747" stroke="#29B4D1" stroke-width="1.8" />
    <text x="174" y="28" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="12" font-weight="900">
      BIA CHỦ QUYỀN 1938 &amp; HẠ TẦNG HÀNH CHÍNH – KHÍ TƯỢNG
    </text>
    <line x1="20" y1="38" x2="328" y2="38" stroke="#1A718D" stroke-width="1.5" />

    <!-- 1938 Sovereignty Stele on Pattle Island -->
    <rect x="24" y="54" width="152" height="222" rx="10" fill="url(#era4Card)" stroke="#29B4D1" stroke-width="2" />
    <rect x="34" y="64" width="132" height="20" rx="5" fill="#113747" />
    <text x="100" y="78" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">BIA CHỦ QUYỀN 1938</text>
    <text x="100" y="102" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9.5" font-weight="900">RÉPUBLIQUE FRANÇAISE</text>
    <text x="100" y="118" text-anchor="middle" fill="#1A718D" font-family="sans-serif" font-size="10" font-weight="900">ROYAUME D&apos;ANNAM</text>
    <line x1="48" y1="128" x2="152" y2="128" stroke="#1A718D" stroke-width="1.2" />
    <text x="100" y="146" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9.5" font-weight="900">ARCHIPEL DES PARACELS</text>
    <rect x="52" y="156" width="96" height="22" rx="5" fill="#29B4D1" />
    <text x="100" y="171" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="11" font-weight="900">1816 – 1938</text>
    <text x="100" y="196" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="10" font-weight="900">ÎLE DE PATTLE</text>
    <text x="100" y="212" text-anchor="middle" fill="#455C68" font-family="sans-serif" font-size="9.5" font-weight="700">(Đảo Hoàng Sa)</text>
    <text x="100" y="236" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9" font-weight="800">Khẳng định chủ quyền liên tục</text>
    <text x="100" y="250" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9" font-weight="800">từ năm Gia Long 1816</text>

    <!-- Lighthouse & WMO Station Cards -->
    <rect x="190" y="54" width="138" height="104" rx="10" fill="#1A718D" stroke="#B6E0EB" stroke-width="1.5" />
    <text x="259" y="76" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="900">TRẠM KHÍ TƯỢNG WMO</text>
    <text x="259" y="96" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="11" font-weight="900">Số hiệu 48860</text>
    <text x="259" y="112" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="9.5" font-weight="700">(Đảo Hoàng Sa - Pattle)</text>
    <text x="259" y="130" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="11" font-weight="900">Số hiệu 48859</text>
    <text x="259" y="146" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="9.5" font-weight="700">(Đảo Phú Lâm - Boisée)</text>

    <rect x="190" y="172" width="138" height="104" rx="10" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.5" />
    <text x="259" y="194" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="900">ĐƠN VỊ HÀNH CHÍNH</text>
    <text x="259" y="214" text-anchor="middle" fill="#1A718D" font-family="sans-serif" font-size="10" font-weight="900">• Trường Sa (1933):</text>
    <text x="259" y="228" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9.5" font-weight="700">Thuộc tỉnh Bà Rịa</text>
    <text x="259" y="248" text-anchor="middle" fill="#1A718D" font-family="sans-serif" font-size="10" font-weight="900">• Hoàng Sa (1938):</text>
    <text x="259" y="262" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9.5" font-weight="700">Thuộc tỉnh Thừa Thiên</text>
  </g>

  <!-- Right Panel: 4 Key Historical Milestones of Era 4 -->
  <g transform="translate(388, 88)">
    <rect width="388" height="68" rx="10" fill="url(#era4Card)" stroke="#29B4D1" stroke-width="1.6" />
    <rect x="12" y="12" width="102" height="20" rx="5" fill="#113747" />
    <text x="63" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">NĂM 1925 – 1927</text>
    <text x="124" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Viện Hải dương học Nha Trang khảo sát</text>
    <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
      Tàu De Lanessan khảo sát địa chất, san hô và sinh vật biển tại hai quần đảo.
    </text>

    <g transform="translate(0, 76)">
      <rect width="388" height="68" rx="10" fill="url(#era4Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="102" height="20" rx="5" fill="#113747" />
      <text x="63" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">NGÀY 21/12/1933</text>
      <text x="124" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Nghị định 4762-CP sáp nhập Trường Sa</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Thống đốc J. Krautheimer sáp nhập quần đảo Trường Sa vào tỉnh Bà Rịa.
      </text>
    </g>

    <g transform="translate(0, 152)">
      <rect width="388" height="68" rx="10" fill="url(#era4Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="102" height="20" rx="5" fill="#113747" />
      <text x="63" y="26" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="900">NĂM 1938</text>
      <text x="124" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Dụ số 10 Bảo Đại &amp; Nghị định 156-SC</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Lập đơn vị hành chính Hoàng Sa thuộc tỉnh Thừa Thiên, dựng Bia chủ quyền.
      </text>
    </g>

    <g transform="translate(0, 228)">
      <rect width="388" height="68" rx="10" fill="url(#era4Card)" stroke="#29B4D1" stroke-width="1.6" />
      <rect x="12" y="12" width="102" height="20" rx="5" fill="#1A718D" />
      <text x="63" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9.5" font-weight="900">NGÀY 05/5/1939</text>
      <text x="124" y="26" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">Nghị định 3282 lập 2 Đại lý Hành chính</text>
      <text x="12" y="48" fill="#113747" font-family="sans-serif" font-size="10.5" font-weight="700">
        Quản lý thường trực nhóm Lưỡi Liềm (Croissant) &amp; nhóm An Vĩnh (Amphitrite).
      </text>
    </g>
  </g>

  <!-- Footer Summary Bar -->
  <rect x="24" y="398" width="752" height="36" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="1.5" />
  <text x="400" y="421" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="12" font-weight="800">
    THỰC THI CHỦ QUYỀN NHÂN DANH NHÀ NƯỚC VIỆT NAM BẰNG HÀNH CHÍNH &amp; KHOA HỌC HIỆN ĐẠI
  </text>
</svg>
