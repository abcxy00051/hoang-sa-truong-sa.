<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="era1Bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747" />
      <stop offset="55%" stop-color="#1A718D" />
      <stop offset="100%" stop-color="#113747" />
    </linearGradient>
    <linearGradient id="era1Card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B6E0EB" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="18" fill="url(#era1Bg)" />

  <!-- Nautical Grid Lines -->
  <g stroke="#B6E0EB" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" stroke-dasharray="5 5" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="5 5" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" stroke-dasharray="5 5" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" stroke-dasharray="5 5" />
  </g>

  <!-- Header Banner -->
  <rect x="24" y="20" width="752" height="52" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="2" />
  <rect x="38" y="31" width="136" height="30" rx="8" fill="#29B4D1" />
  <text x="106" y="51" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="12.5" font-weight="900">
    GIAI ĐOẠN 01
  </text>
  <text x="190" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900">
    THỜI KỲ TRƯỚC THẾ KỶ XVII: KHỞI NGUỒN VĂN HÓA BIỂN &amp; QUỐC ĐỒ
  </text>
  <text x="190" y="63" fill="#B6E0EB" font-family="sans-serif" font-size="11.5" font-weight="700">
    Văn hóa biển Sa Huỳnh – Lý Sơn • Dư địa chí (1435) • Hồng Đức bản đồ (1490) • Hải đồ Pracel TK XVI
  </text>

  <!-- Left Visual Panel: Ancient Cartography & Compass Rose -->
  <g transform="translate(24, 88)">
    <rect width="340" height="296" rx="14" fill="#113747" stroke="#29B4D1" stroke-width="1.8" />
    <text x="170" y="30" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="12.5" font-weight="900">
      BẢN ĐỒ QUỐC GIA &amp; HẢI ĐỒ THẾ KỶ XV – XVI
    </text>
    <line x1="24" y1="40" x2="316" y2="40" stroke="#1A718D" stroke-width="1.5" />

    <!-- Stylized Coastline & Pracel Sandbank -->
    <path d="M52,62 C88,86 92,120 76,154 C64,182 96,214 114,248 L44,248 L44,62 Z" fill="#1A718D" fill-opacity="0.55" />
    <path d="M52,62 C88,86 92,120 76,154 C64,182 96,214 114,248" stroke="#B6E0EB" stroke-width="3.5" fill="none" />
    <text x="86" y="138" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="800">COSTA DE PRACEL</text>
    <text x="86" y="152" fill="#B6E0EB" font-family="sans-serif" font-size="9.5" font-weight="700">(Bờ biển miền Trung VN)</text>

    <!-- Long Golden Sandbank Shape (I. dos Pracel / Bãi Cát Vàng) -->
    <path d="M210,88 C232,115 236,162 218,210 C206,184 202,128 210,88 Z" fill="#29B4D1" fill-opacity="0.35" stroke="#29B4D1" stroke-width="2" />
    <circle cx="218" cy="118" r="5" fill="#FFFFFF" />
    <circle cx="222" cy="150" r="5" fill="#FFFFFF" />
    <circle cx="216" cy="182" r="5" fill="#FFFFFF" />
    <text x="242" y="142" fill="#29B4D1" font-family="sans-serif" font-size="11.5" font-weight="900">I. DE PRACEL</text>
    <text x="242" y="157" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">(Bãi Cát Vàng)</text>

    <!-- Connecting Maritime Arrow -->
    <path d="M110,164 Q162,158 206,152" stroke="#B6E0EB" stroke-width="2" stroke-dasharray="4 4" fill="none" />

    <!-- Compass Rose Emblem -->
    <g transform="translate(284, 236)">
      <circle r="28" fill="#1A718D" fill-opacity="0.4" stroke="#29B4D1" stroke-width="1.5" />
      <polygon points="0,-24 6,-6 24,0 6,6 0,24 -6,6 -24,0 -6,-6" fill="#B6E0EB" />
      <circle r="5" fill="#113747" stroke="#29B4D1" stroke-width="2" />
    </g>

    <rect x="18" y="254" width="224" height="28" rx="6" fill="#1A718D" />
    <text x="130" y="272" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="800">
      Hồng Đức Bản Đồ (1490) • Lê Thánh Tông
    </text>
  </g>

  <!-- Right Panel: 3 Historical Pillars of Era 1 -->
  <g transform="translate(382, 88)">
    <!-- Pillar 1 -->
    <rect width="394" height="90" rx="12" fill="url(#era1Card)" stroke="#29B4D1" stroke-width="1.8" />
    <rect x="14" y="14" width="110" height="22" rx="6" fill="#113747" />
    <text x="69" y="29" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="10" font-weight="900">
      TIỀN SỬ – TK X
    </text>
    <text x="134" y="29" fill="#113747" font-family="sans-serif" font-size="13" font-weight="900">
      Văn hóa Biển Sa Huỳnh, Hạ Long &amp; Đảo Lý Sơn
    </text>
    <text x="14" y="52" fill="#113747" font-family="sans-serif" font-size="11" font-weight="700">
      • Di chỉ xóm Ốc, suối Chình (đảo Lý Sơn) niên đại hơn 2.000 năm.
    </text>
    <text x="14" y="72" fill="#455C68" font-family="sans-serif" font-size="11" font-weight="700">
      • Cư dân Việt cổ làm chủ kỹ thuật đóng thuyền và hải trình Biển Đông.
    </text>

    <!-- Pillar 2 -->
    <g transform="translate(0, 103)">
      <rect width="394" height="90" rx="12" fill="url(#era1Card)" stroke="#29B4D1" stroke-width="1.8" />
      <rect x="14" y="14" width="110" height="22" rx="6" fill="#113747" />
      <text x="69" y="29" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="10" font-weight="900">
        NĂM 1435 &amp; 1490
      </text>
      <text x="134" y="29" fill="#113747" font-family="sans-serif" font-size="13" font-weight="900">
        Dư địa chí (1435) &amp; Hồng Đức bản đồ (1490)
    </text>
      <text x="14" y="52" fill="#113747" font-family="sans-serif" font-size="11" font-weight="700">
        • Nguyễn Trãi soạn Dư địa chí (1435) ghi chép cương vực, cửa biển.
      </text>
      <text x="14" y="72" fill="#455C68" font-family="sans-serif" font-size="11" font-weight="700">
        • Vua Lê Thánh Tông ban hành Hồng Đức bản đồ (1490) – Quốc đồ Đại Việt.
      </text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(0, 206)">
      <rect width="394" height="90" rx="12" fill="url(#era1Card)" stroke="#29B4D1" stroke-width="1.8" />
      <rect x="14" y="14" width="110" height="22" rx="6" fill="#1A718D" />
      <text x="69" y="29" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="900">
        THẾ KỶ XVI
      </text>
      <text x="134" y="29" fill="#113747" font-family="sans-serif" font-size="13" font-weight="900">
        Hải đồ Phương Tây: Pracel &amp; Costa de Pracel
      </text>
      <text x="14" y="52" fill="#113747" font-family="sans-serif" font-size="11" font-weight="700">
        • Hải đồ Lazaro Luis (1563), Vaz Dourado (1571), Van Langren (1595).
      </text>
      <text x="14" y="72" fill="#455C68" font-family="sans-serif" font-size="11" font-weight="700">
        • Gắn kết hữu cơ Quần đảo Hoàng Sa (Pracel) với bờ biển miền Trung VN.
      </text>
    </g>
  </g>

  <!-- Footer Summary Bar -->
  <rect x="24" y="398" width="752" height="36" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="1.5" />
  <text x="400" y="421" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="12" font-weight="800">
    NỀN TẢNG LỊCH SỬ: XÁC LẬP KHÔNG GIAN SINH TỒN TRÊN BIỂN ĐÔNG &amp; TƯ DUY QUỐC ĐỒ ĐẠI VIỆT
  </text>
</svg>
