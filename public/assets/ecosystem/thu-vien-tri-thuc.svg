    <text x="14" y="66" fill="#B6E0EB" font-family="sans-serif" font-size="9.5">• Tóm tắt ý chính, từ khóa &amp; câu hỏi ôn tập</text>
    <text x="14" y="81" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="700">• Trích dẫn nguồn chính thống phục vụ thuyết trình</text>
