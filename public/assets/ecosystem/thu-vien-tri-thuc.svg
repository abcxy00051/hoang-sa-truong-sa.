    <rect x="34" y="218" width="74" height="22" rx="11" fill="#0C264E" stroke="#38BDF8" stroke-opacity="0.5" />
    <text x="71" y="233" text-anchor="middle" fill="#7DD3FC" font-family="sans-serif" font-size="9.5" font-weight="700">Địa lý biển</text>

