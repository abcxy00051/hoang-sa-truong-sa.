    <text x="155" y="233" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="9.5" font-weight="700">Sử liệu cổ</text>

    <rect x="202" y="218" width="74" height="22" rx="11" fill="#0C264E" stroke="#22C55E" stroke-opacity="0.5" />
