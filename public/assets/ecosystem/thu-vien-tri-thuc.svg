  <g transform="translate(550, 178)">
    <rect width="226" height="94" rx="14" fill="#113747" fill-opacity="0.92" stroke="#B6E0EB" stroke-width="1.5" />
    <rect x="14" y="12" width="112" height="20" rx="10" fill="#1A718D" />
    <text x="70" y="25" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="8.5" font-weight="800">CHUYÊN ĐỀ #05 &amp; #06</text>
    <text x="212" y="25" text-anchor="end" fill="#29B4D1" font-family="monospace" font-size="9" font-weight="800">GDQP &amp; AN NINH</text>
    <text x="14" y="48" fill="#F4FBFE" font-family="sans-serif" font-size="11.5" font-weight="800">Đời sống Đảo xa &amp; Giữ biển</text>
    <text x="14" y="66" fill="#B6E0EB" font-family="sans-serif" font-size="9.5">• Hải quân, Cảnh sát biển, Kiểm ngư, DK1</text>
