    <line x1="178" y1="126" x2="240" y2="126" stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
    <line x1="178" y1="142" x2="236" y2="142" stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" opacity="0.65" />
    <line x1="178" y1="158" x2="230" y2="158" stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" opacity="0.65" />
    <line x1="178" y1="174" x2="220" y2="174" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" />

