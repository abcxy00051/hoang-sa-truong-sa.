    <rect x="14" y="12" width="112" height="20" rx="10" fill="#1A718D" />
    <text x="70" y="25" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="8.5" font-weight="800">CHUYÊN ĐỀ #07</text>
