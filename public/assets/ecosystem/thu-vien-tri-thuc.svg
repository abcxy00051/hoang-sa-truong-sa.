    <text x="14" y="48" fill="#F4FBFE" font-family="sans-serif" font-size="11.5" font-weight="800">Sử liệu &amp; Châu bản Chủ quyền</text>
    <text x="14" y="66" fill="#B6E0EB" font-family="sans-serif" font-size="9.5">• Đội Hoàng Sa – Bắc Hải thế kỷ XVII–XVIII</text>
