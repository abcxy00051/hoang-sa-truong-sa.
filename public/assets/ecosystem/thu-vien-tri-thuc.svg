    <text x="14" y="48" fill="#F4FBFE" font-family="sans-serif" font-size="11.5" font-weight="800">Địa lý &amp; Tự nhiên Biển Đảo</text>
    <text x="14" y="66" fill="#B6E0EB" font-family="sans-serif" font-size="9.5">• Diện tích &gt; 1 triệu km², 3.260 km bờ biển</text>
