    <rect x="20" y="196" width="105" height="7" rx="3.5" fill="#38BDF8" opacity="0.6" />
    <rect x="20" y="216" width="110" height="18" rx="9" fill="#F59E0B" fill-opacity="0.2" />
    <text x="75" y="228" text-anchor="middle" fill="#FCD34D" font-family="sans-serif" font-size="8.5" font-weight="700">KHỐI 10 • 11 • 12</text>
