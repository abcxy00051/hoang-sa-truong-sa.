    <rect width="430" height="42" rx="21" fill="#040D1D" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.2" />
    <circle cx="28" cy="21" r="6" fill="#FBBF24" />
    <text x="48" y="25" fill="#E0F2FE" font-family="sans-serif" font-size="11" font-weight="700">7 Chuyên đề • 35+ Bài viết chuẩn GDPT 2018 • Tra cứu tức thì</text>
