<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="oceanBg3" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747" />
      <stop offset="52%" stop-color="#154A60" />
      <stop offset="100%" stop-color="#1A718D" />
    </linearGradient>
    <radialGradient id="aiAura3" cx="55%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#29B4D1" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#1A718D" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#113747" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="aiNodeGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#29B4D1" />
      <stop offset="100%" stop-color="#1A718D" />
    </linearGradient>
  </defs>

  <!-- Ocean Technology Background -->
  <rect width="800" height="450" fill="url(#oceanBg3)" />
  <rect width="800" height="450" fill="url(#aiAura3)" />

  <!-- Subtle Tech Grid -->
  <g stroke="#B6E0EB" stroke-opacity="0.11" stroke-width="1">
    <line x1="0" y1="68" x2="800" y2="68" />
    <line x1="0" y1="172" x2="800" y2="172" />
    <line x1="0" y1="276" x2="800" y2="276" />
    <line x1="0" y1="382" x2="800" y2="382" />
    <line x1="230" y1="68" x2="230" y2="382" />
  </g>

  <!-- Neural Connectors from Knowledge Base to AI Chat -->
  <g stroke="#29B4D1" stroke-width="1.8" stroke-dasharray="4 3">
    <line x1="208" y1="112" x2="246" y2="145" />
    <line x1="208" y1="192" x2="246" y2="215" />
    <line x1="208" y1="272" x2="246" y2="265" />
    <line x1="208" y1="346" x2="246" y2="320" />
  </g>

  <!-- Left Column: 4 Verified AI Knowledge Sources (x: 24..210, y: 74..376) -->
  <g transform="translate(24, 74)">
    <rect width="186" height="66" rx="12" fill="#113747" fill-opacity="0.94" stroke="#29B4D1" stroke-width="1.5" />
    <circle cx="22" cy="22" r="5" fill="#29B4D1" />
    <text x="34" y="25" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="800">NGUỒN PHÁP LÝ BIỂN</text>
    <text x="16" y="43" fill="#F4FBFE" font-family="sans-serif" font-size="10.5" font-weight="700">UNCLOS 1982 &amp; Luật Biển</text>
    <text x="16" y="57" fill="#B6E0EB" font-family="sans-serif" font-size="8.5">5 vùng biển • Quyền chủ quyền</text>
  </g>

  <g transform="translate(24, 152)">
    <rect width="186" height="66" rx="12" fill="#113747" fill-opacity="0.94" stroke="#B6E0EB" stroke-width="1.5" />
    <circle cx="22" cy="22" r="5" fill="#B6E0EB" />
    <text x="34" y="25" fill="#B6E0EB" font-family="sans-serif" font-size="9.5" font-weight="800">SỬ LIỆU CHÍNH THỐNG</text>
    <text x="16" y="43" fill="#F4FBFE" font-family="sans-serif" font-size="10.5" font-weight="700">Châu bản &amp; Bản đồ cổ</text>
    <text x="16" y="57" fill="#B6E0EB" font-family="sans-serif" font-size="8.5">Đội Hoàng Sa • Di sản UNESCO</text>
  </g>

  <g transform="translate(24, 230)">
    <rect width="186" height="66" rx="12" fill="#113747" fill-opacity="0.94" stroke="#29B4D1" stroke-width="1.5" />
    <circle cx="22" cy="22" r="5" fill="#29B4D1" />
    <text x="34" y="25" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="800">DỮ LIỆU ĐỊA LÝ ĐẢO</text>
    <text x="16" y="43" fill="#F4FBFE" font-family="sans-serif" font-size="10.5" font-weight="700">Hoàng Sa – Trường Sa</text>
    <text x="16" y="57" fill="#B6E0EB" font-family="sans-serif" font-size="8.5">Tọa độ • Hải lý • Nhà giàn DK1</text>
  </g>

  <g transform="translate(24, 308)">
    <rect width="186" height="68" rx="12" fill="#113747" fill-opacity="0.94" stroke="#1A718D" stroke-width="1.5" />
    <circle cx="22" cy="22" r="5" fill="#B6E0EB" />
    <text x="34" y="25" fill="#B6E0EB" font-family="sans-serif" font-size="9.5" font-weight="800">CHƯƠNG TRÌNH THPT</text>
    <text x="16" y="43" fill="#F4FBFE" font-family="sans-serif" font-size="10.5" font-weight="700">Chuẩn GDPT 2018</text>
    <text x="16" y="57" fill="#29B4D1" font-family="sans-serif" font-size="8.5" font-weight="700">Hỗ trợ Học sinh &amp; Giáo viên 24/7</text>
  </g>

  <!-- Right Main Coze AI Interactive Workspace (x: 242..776, y: 72..378) -->
  <g transform="translate(242, 72)">
    <rect width="534" height="306" rx="18" fill="#113747" fill-opacity="0.96" stroke="#29B4D1" stroke-width="2" />

    <!-- AI Window Header -->
    <rect width="534" height="44" rx="18" fill="#164A5F" />
    <circle cx="24" cy="22" r="5.5" fill="#B6E0EB" />
    <circle cx="40" cy="22" r="5.5" fill="#29B4D1" />
    <circle cx="56" cy="22" r="5.5" fill="#1A718D" />
    <text x="80" y="26" fill="#F4FBFE" font-family="sans-serif" font-size="11.5" font-weight="800">COZE AI • TRỢ LÝ HỌC TẬP BIỂN ĐẢO VIỆT NAM</text>
    <rect x="404" y="11" width="114" height="22" rx="11" fill="#29B4D1" />
    <text x="461" y="25" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="8.5" font-weight="900">● TRỰC TUYẾN 24/7</text>

    <!-- Student Query Bubble -->
    <g transform="translate(116, 56)">
      <rect width="398" height="54" rx="12" fill="#1A718D" stroke="#B6E0EB" stroke-width="1.2" />
      <text x="14" y="19" fill="#B6E0EB" font-family="sans-serif" font-size="9" font-weight="800">HỌC SINH THPT HỎI:</text>
      <text x="14" y="34" fill="#F4FBFE" font-family="sans-serif" font-size="10.5" font-weight="700">Vì sao Châu bản triều Nguyễn là bằng chứng lịch sử – pháp lý</text>
      <text x="14" y="48" fill="#F4FBFE" font-family="sans-serif" font-size="10.5" font-weight="700">đanh thép khẳng định chủ quyền đối với Hoàng Sa, Trường Sa?</text>
    </g>

    <!-- AI Verified Answer Bubble -->
    <g transform="translate(18, 120)">
      <circle cx="24" cy="26" r="22" fill="url(#aiNodeGrad3)" stroke="#B6E0EB" stroke-width="2" />
      <text x="24" y="30" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="12" font-weight="900">AI</text>

      <rect x="56" y="0" width="440" height="126" rx="14" fill="#164A5F" stroke="#29B4D1" stroke-width="1.6" />
      <text x="72" y="22" fill="#29B4D1" font-family="sans-serif" font-size="10.5" font-weight="800">✦ Giải đáp chuẩn kiến thức Lịch sử &amp; Pháp lý Biển Đảo THPT:</text>
      <text x="72" y="42" fill="#F4FBFE" font-family="sans-serif" font-size="10">1. Là văn bản hành chính nhà nước chính thức của triều Nguyễn (1802–1945)</text>
      <text x="72" y="56" fill="#B6E0EB" font-family="sans-serif" font-size="9.5">có bút tích phê duyệt trực tiếp bằng mực son (ngự phê) của các Hoàng đế.</text>
      <text x="72" y="76" fill="#F4FBFE" font-family="sans-serif" font-size="10">2. Ghi rõ việc cử thủy quân, Đội Hoàng Sa đi cắm mốc, dựng bia, đo đạc</text>
      <text x="72" y="90" fill="#B6E0EB" font-family="sans-serif" font-size="9.5">thủy trình, vẽ bản đồ và cứu hộ tàu thuyền hàng năm (tiêu biểu năm 1816, 1836).</text>
      <rect x="72" y="100" width="356" height="18" rx="9" fill="#113747" stroke="#29B4D1" stroke-width="1" />
      <text x="250" y="112" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="8.5" font-weight="800">✓ Được UNESCO công nhận là Di sản tư liệu thế giới (năm 2014)</text>
    </g>

    <!-- Bottom Prompt Suggestion Chips -->
    <g transform="translate(18, 258)">
      <rect x="0" y="0" width="154" height="32" rx="16" fill="#164A5F" stroke="#29B4D1" stroke-width="1.2" />
      <text x="77" y="20" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="9" font-weight="700">Phân biệt 5 vùng biển?</text>

      <rect x="164" y="0" width="164" height="32" rx="16" fill="#164A5F" stroke="#B6E0EB" stroke-width="1.2" />
      <text x="246" y="20" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="9" font-weight="700">Tọa độ Hoàng Sa - Trường Sa</text>

      <rect x="338" y="0" width="158" height="32" rx="16" fill="#29B4D1" />
      <text x="417" y="20" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9.5" font-weight="900">Tạo đề ôn tập THPT →</text>
    </g>
  </g>
</svg>