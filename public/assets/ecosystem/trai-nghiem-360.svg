<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="oceanBg6" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747" />
      <stop offset="50%" stop-color="#154B60" />
      <stop offset="100%" stop-color="#1A718D" />
    </linearGradient>
    <linearGradient id="beamRight6" x1="400" y1="152" x2="730" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6E0EB" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#29B4D1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beamLeft6" x1="400" y1="152" x2="70" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6E0EB" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#29B4D1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ocean Technology Background -->
  <rect width="800" height="450" fill="url(#oceanBg6)" />

  <!-- 360 Panoramic Sphere Latitude / Longitude Rings -->
  <ellipse cx="400" cy="240" rx="348" ry="132" stroke="#29B4D1" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="8 6" />
  <ellipse cx="400" cy="240" rx="255" ry="96" stroke="#B6E0EB" stroke-opacity="0.28" stroke-width="1.4" />
  <ellipse cx="400" cy="322" rx="310" ry="44" stroke="#29B4D1" stroke-opacity="0.45" stroke-width="1.6" />

  <!-- Lighthouse Sweeping Beams -->
  <polygon points="400,152 745,88 745,192" fill="url(#beamRight6)" />
  <polygon points="400,152 55,88 55,192" fill="url(#beamLeft6)" />

  <!-- 360 Azimuth Compass Ribbon (Safe Top Zone y = 72..100) -->
  <g transform="translate(155, 72)">
    <rect width="490" height="28" rx="14" fill="#113747" fill-opacity="0.94" stroke="#29B4D1" stroke-width="1.5" />
    <text x="48" y="18" text-anchor="middle" fill="#B6E0EB" font-family="monospace" font-size="9.5" font-weight="700">270° TÂY</text>
    <text x="142" y="18" text-anchor="middle" fill="#29B4D1" font-family="monospace" font-size="9.5" font-weight="700">315° TB</text>
    <rect x="198" y="4" width="94" height="20" rx="10" fill="#29B4D1" />
    <text x="245" y="18" text-anchor="middle" fill="#113747" font-family="monospace" font-size="10" font-weight="900">0° BẮC ★</text>
    <text x="348" y="18" text-anchor="middle" fill="#29B4D1" font-family="monospace" font-size="9.5" font-weight="700">45° ĐB</text>
    <text x="442" y="18" text-anchor="middle" fill="#B6E0EB" font-family="monospace" font-size="9.5" font-weight="700">90° ĐÔNG</text>
  </g>

  <!-- Center Outpost Island, Lighthouse & Sovereignty Stele (x: 280..520, y: 120..368) -->
  <g transform="translate(290, 118)">
    <!-- Coral Reef & Wave Ring -->
    <ellipse cx="110" cy="216" rx="126" ry="26" fill="#29B4D1" fill-opacity="0.24" stroke="#B6E0EB" stroke-width="1.5" />
    <path d="M18 214 Q110 176 202 214 Z" fill="#164A5F" stroke="#29B4D1" stroke-width="2" />

    <!-- Outpost Lighthouse Tower -->
    <path d="M88 56 L122 56 L130 194 L80 194 Z" fill="#113747" stroke="#B6E0EB" stroke-width="2.2" />
    <rect x="82" y="42" width="46" height="15" rx="5" fill="#29B4D1" />
    <circle cx="105" cy="32" r="12" fill="#B6E0EB" stroke="#29B4D1" stroke-width="2" />
    <line x1="86" y1="98" x2="124" y2="98" stroke="#29B4D1" stroke-width="2.5" />
    <line x1="84" y1="142" x2="126" y2="142" stroke="#29B4D1" stroke-width="2.5" />

    <!-- Sovereignty Milestone Stele -->
    <path d="M148 118 L164 98 L180 118 L180 194 L148 194 Z" fill="#113747" stroke="#B6E0EB" stroke-width="2" />
    <circle cx="164" cy="128" r="7" fill="#29B4D1" />
    <text x="164" y="131.5" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9" font-weight="900">★</text>

    <!-- DK1 Rig Silhouette Left of Lighthouse -->
    <line x1="42" y1="148" x2="42" y2="196" stroke="#B6E0EB" stroke-width="2" />
    <line x1="62" y1="148" x2="62" y2="196" stroke="#B6E0EB" stroke-width="2" />
    <rect x="34" y="128" width="36" height="20" rx="3" fill="#1A718D" stroke="#B6E0EB" stroke-width="1.5" />

    <!-- Center Coordinate Pill -->
    <rect x="20" y="226" width="180" height="24" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="1.4" />
    <text x="110" y="242" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="9.5" font-weight="800">↻ XOAY TOÀN CẢNH 360° ĐẢO XA</text>
  </g>

  <!-- Left 2 Interactive 360° Station Cards (x: 24..252) -->
  <g transform="translate(24, 118)">
    <rect width="224" height="114" rx="14" fill="#113747" fill-opacity="0.94" stroke="#29B4D1" stroke-width="1.6" />
    <circle cx="22" cy="22" r="6" fill="#29B4D1" />
    <text x="36" y="26" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="800">TRẠM QUAN SÁT 360° #01 &amp; #02</text>
    <text x="16" y="48" fill="#F4FBFE" font-family="sans-serif" font-size="11.5" font-weight="800">Đảo Trường Sa Lớn &amp; Tiên Nữ</text>
    <text x="16" y="66" fill="#B6E0EB" font-family="monospace" font-size="9.5">08°38′30″B — 111°55′55″Đ</text>
    <text x="16" y="84" fill="#B6E0EB" font-family="sans-serif" font-size="9">• Cột mốc chủ quyền, Âu tàu, Hải đăng</text>
    <text x="16" y="100" fill="#29B4D1" font-family="sans-serif" font-size="9" font-weight="700">• Nơi đón bình minh sớm nhất trên biển</text>
  </g>

  <g transform="translate(24, 248)">
    <rect width="224" height="122" rx="14" fill="#113747" fill-opacity="0.94" stroke="#B6E0EB" stroke-width="1.6" />
    <circle cx="22" cy="22" r="6" fill="#B6E0EB" />
    <text x="36" y="26" fill="#B6E0EB" font-family="sans-serif" font-size="9.5" font-weight="800">TRẠM QUAN SÁT 360° #03 &amp; #04</text>
    <text x="16" y="48" fill="#F4FBFE" font-family="sans-serif" font-size="11.5" font-weight="800">Đảo Hoàng Sa &amp; Đảo Lý Sơn</text>
    <text x="16" y="66" fill="#29B4D1" font-family="monospace" font-size="9.5">16°32′05″B — 111°36′30″Đ</text>
    <text x="16" y="84" fill="#B6E0EB" font-family="sans-serif" font-size="9">• Bia chủ quyền 1938 &amp; Trạm WMO 48860</text>
    <text x="16" y="100" fill="#B6E0EB" font-family="sans-serif" font-size="9">• Đình làng An Vĩnh &amp; Âm linh tự Lý Sơn</text>
  </g>

  <!-- Right 2 Interactive 360° Station & Hotspot Cards (x: 552..776) -->
  <g transform="translate(552, 118)">
    <rect width="224" height="114" rx="14" fill="#113747" fill-opacity="0.94" stroke="#B6E0EB" stroke-width="1.6" />
    <circle cx="22" cy="22" r="6" fill="#B6E0EB" />
    <text x="36" y="26" fill="#B6E0EB" font-family="sans-serif" font-size="9.5" font-weight="800">TRẠM QUAN SÁT 360° #05</text>
    <text x="16" y="48" fill="#F4FBFE" font-family="sans-serif" font-size="11.5" font-weight="800">Cụm Nhà giàn DK1</text>
    <text x="16" y="66" fill="#29B4D1" font-family="monospace" font-size="9.5">Thềm lục địa phía Nam Tổ quốc</text>
    <text x="16" y="84" fill="#B6E0EB" font-family="sans-serif" font-size="9">• Bãi Tư Chính, Phúc Nguyên, Quế Đường</text>
    <text x="16" y="100" fill="#29B4D1" font-family="sans-serif" font-size="9" font-weight="700">• Cột mốc sống giữ thềm lục địa (1989)</text>
  </g>

  <g transform="translate(552, 248)">
    <rect width="224" height="122" rx="14" fill="#113747" fill-opacity="0.94" stroke="#29B4D1" stroke-width="1.6" />
    <text x="16" y="26" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="800">TƯƠNG TÁC ĐIỂM CHẠM (HOTSPOTS)</text>
    <rect x="16" y="38" width="192" height="22" rx="6" fill="#164A5F" />
    <text x="26" y="53" fill="#F4FBFE" font-family="sans-serif" font-size="9" font-weight="700">✦ Xoay phương vị la bàn 0° – 360°</text>
    <rect x="16" y="66" width="192" height="22" rx="6" fill="#164A5F" />
    <text x="26" y="81" fill="#B6E0EB" font-family="sans-serif" font-size="9" font-weight="700">✦ Phóng to chi tiết từng công trình</text>
    <rect x="16" y="94" width="192" height="20" rx="6" fill="#29B4D1" />
    <text x="112" y="108" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9" font-weight="900">CHẾ ĐỘ THAM QUAN TOÀN MÀN HÌNH</text>
  </g>
</svg>