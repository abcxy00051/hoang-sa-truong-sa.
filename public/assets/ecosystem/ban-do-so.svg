<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="bgMap" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040D1D" />
      <stop offset="55%" stop-color="#071936" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#071936" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgMap)" />

  <!-- GIS Coordinate Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="300" x2="640" y2="300" />
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
  </g>

  <!-- Radar & Sonar Circles -->
  <circle cx="340" cy="180" r="145" fill="url(#radarGlow)" />
  <circle cx="340" cy="180" r="130" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="340" cy="180" r="90" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="340" cy="180" r="48" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Stylized Coastline Curve (Illustrative) -->
  <path d="M110 40 C155 85, 195 125, 190 175 C185 225, 225 260, 175 320" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M95 40 C140 85, 180 125, 175 175 C170 225, 210 260, 160 320 L70 320 L70 40 Z" fill="#0EA5E9" fill-opacity="0.18" />

  <!-- Connection Lines to Archipelagos -->
  <line x1="190" y1="135" x2="345" y2="115" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5 5" />
  <line x1="200" y1="245" x2="415" y2="235" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 5" />

  <!-- Hoang Sa Marker Node -->
  <g transform="translate(345, 115)">
    <circle cx="0" cy="0" r="22" fill="#F59E0B" fill-opacity="0.22" />
    <circle cx="0" cy="0" r="11" fill="url(#goldGrad)" />
    <text x="0" y="4" text-anchor="middle" fill="#040D1D" font-family="sans-serif" font-size="10" font-weight="800">★</text>
    <rect x="18" y="-22" width="165" height="42" rx="8" fill="#071936" fill-opacity="0.9" stroke="#FBBF24" stroke-width="1.2" />
    <text x="28" y="-5" fill="#FCD34D" font-family="sans-serif" font-size="11" font-weight="700">QUẦN ĐẢO HOÀNG SA</text>
    <text x="28" y="11" fill="#E0F2FE" font-family="monospace" font-size="9.5">Mô hình Bản đồ số 2D/3D</text>
  </g>

  <!-- Truong Sa Marker Node -->
  <g transform="translate(415, 235)">
    <circle cx="0" cy="0" r="22" fill="#38BDF8" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="11" fill="#38BDF8" />
    <text x="0" y="4" text-anchor="middle" fill="#040D1D" font-family="sans-serif" font-size="10" font-weight="800">★</text>
    <rect x="18" y="-22" width="168" height="42" rx="8" fill="#071936" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.2" />
    <text x="28" y="-5" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">QUẦN ĐẢO TRƯỜNG SA</text>
    <text x="28" y="11" fill="#E0F2FE" font-family="monospace" font-size="9.5">Trực quan hóa Không gian</text>
  </g>

  <!-- Compass Rose Widget Top Right -->
  <g transform="translate(565, 65)">
    <circle cx="0" cy="0" r="34" fill="#071936" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5" />
    <polygon points="0,-24 6,-4 0,-9 -6,-4" fill="#FBBF24" />
    <polygon points="0,24 6,4 0,9 -6,4" fill="#38BDF8" opacity="0.7" />
    <polygon points="-24,0 -4,-6 -9,0 -4,6" fill="#38BDF8" opacity="0.7" />
    <polygon points="24,0 4,-6 9,0 4,6" fill="#38BDF8" opacity="0.7" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Telemetry Badge Bottom Left -->
  <g transform="translate(28, 296)">
    <rect width="230" height="36" rx="8" fill="#040D1D" fill-opacity="0.8" stroke="#38BDF8" stroke-opacity="0.4" />
    <circle cx="18" cy="18" r="5" fill="#22C55E" />
    <text x="32" y="22" fill="#E0F2FE" font-family="sans-serif" font-size="11" font-weight="700">GIS BIỂN ĐẢO • THPT</text>
  </g>
</svg>
