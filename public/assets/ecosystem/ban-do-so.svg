<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" fill="none">
  <defs>
    <linearGradient id="gisBg" x1="0" y1="0" x2="800" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030B18" />
      <stop offset="45%" stop-color="#071936" />
      <stop offset="100%" stop-color="#035388" />
    </linearGradient>
    <radialGradient id="sonarPulse" cx="56%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#040D1D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldPin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="landFill" x1="80" y1="40" x2="260" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.14" />
    </linearGradient>
  </defs>

  <!-- Deep Ocean GIS Background -->
  <rect width="800" height="460" fill="url(#gisBg)" />
  <rect width="800" height="460" fill="url(#sonarPulse)" />

  <!-- Bathymetric Contour Curves -->
  <path d="M220 20 C310 95, 360 190, 330 280 C300 360, 350 410, 420 450" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2" fill="none" />
  <path d="M280 15 C410 100, 470 205, 440 300 C410 380, 470 420, 560 455" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="8 6" fill="none" />
  <path d="M350 10 C510 110, 590 220, 560 330 C535 400, 600 435, 690 455" stroke="#FBBF24" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="10 6" fill="none" />

  <!-- Precision GIS Coordinate Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.13" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="110" y1="0" x2="110" y2="460" />
    <line x1="220" y1="0" x2="220" y2="460" />
    <line x1="330" y1="0" x2="330" y2="460" />
    <line x1="440" y1="0" x2="440" y2="460" />
    <line x1="550" y1="0" x2="550" y2="460" />
    <line x1="660" y1="0" x2="660" y2="460" />
  </g>

  <!-- Coordinate Axis Labels -->
  <g fill="#7DD3FC" fill-opacity="0.55" font-family="monospace" font-size="10">
    <text x="16" y="70">20°00'N</text>
    <text x="16" y="145">16°30'N</text>
    <text x="16" y="220">13°00'N</text>
    <text x="16" y="295">09°30'N</text>
    <text x="225" y="446">108°E</text>
    <text x="335" y="446">111°E</text>
    <text x="445" y="446">114°E</text>
    <text x="555" y="446">117°E</text>
  </g>

  <!-- Radar Rings Centered on East Sea -->
  <g transform="translate(455, 220)">
    <circle cx="0" cy="0" r="175" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" />
    <circle cx="0" cy="0" r="130" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="82" stroke="#FBBF24" stroke-opacity="0.35" stroke-width="1.5" />
    <line x1="-185" y1="0" x2="185" y2="0" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="-185" x2="0" y2="185" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <!-- Stylized Vietnam S-Coastline & Continental Shelf -->
  <path d="M85 38 L175 38 C195 62, 162 92, 182 125 C208 162, 255 198, 252 252 C249 305, 212 342, 168 378 C142 398, 125 385, 118 355 L85 355 Z" fill="url(#landFill)" />
  <path d="M175 38 C195 62, 162 92, 182 125 C208 162, 255 198, 252 252 C249 305, 212 342, 168 378" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <path d="M183 42 C205 66, 172 95, 192 128 C218 165, 265 200, 262 254 C259 308, 222 345, 178 380" stroke="#FBBF24" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />

  <!-- Sovereignty Baseline & Telemetry Vectors -->
  <line x1="218" y1="168" x2="415" y2="138" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 5" />
  <line x1="248" y1="278" x2="505" y2="288" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 5" />
  <line x1="190" y1="358" x2="365" y2="368" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="4 4" />

  <!-- Archipelago Node 1: QUẦN ĐẢO HOÀNG SA -->
  <g transform="translate(415, 138)">
    <circle cx="0" cy="0" r="28" fill="#F59E0B" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="18" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="11" fill="url(#goldPin)" />
    <text x="0" y="4" text-anchor="middle" fill="#040D1D" font-family="sans-serif" font-size="11" font-weight="900">★</text>

    <!-- Island Cluster Dots -->
    <circle cx="-22" cy="-14" r="3" fill="#FDE68A" />
    <circle cx="-12" cy="18" r="2.5" fill="#FDE68A" />
    <circle cx="20" cy="-16" r="3" fill="#FDE68A" />
    <circle cx="26" cy="12" r="2.5" fill="#FDE68A" />

    <!-- Callout Card -->
    <rect x="24" y="-34" width="226" height="58" rx="10" fill="#051329" fill-opacity="0.92" stroke="#FBBF24" stroke-width="1.5" />
    <text x="38" y="-13" fill="#FCD34D" font-family="sans-serif" font-size="12" font-weight="800">QUẦN ĐẢO HOÀNG SA</text>
    <text x="38" y="4" fill="#E0F2FE" font-family="monospace" font-size="10.5">16°32′00″B — 111°38′00″Đ</text>
    <text x="38" y="18" fill="#93C5FD" font-family="sans-serif" font-size="9.5" font-weight="600">TP. Đà Nẵng • 120 hải lý từ Lý Sơn</text>
  </g>

  <!-- Archipelago Node 2: QUẦN ĐẢO TRƯỜNG SA -->
  <g transform="translate(505, 288)">
    <circle cx="0" cy="0" r="30" fill="#38BDF8" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="19" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="11" fill="#38BDF8" />
    <text x="0" y="4" text-anchor="middle" fill="#040D1D" font-family="sans-serif" font-size="11" font-weight="900">★</text>

    <!-- Island Cluster Dots -->
    <circle cx="-26" cy="-18" r="3" fill="#7DD3FC" />
    <circle cx="-18" cy="20" r="2.5" fill="#7DD3FC" />
    <circle cx="22" cy="-22" r="3.5" fill="#7DD3FC" />
    <circle cx="30" cy="14" r="2.5" fill="#7DD3FC" />

    <!-- Callout Card -->
    <rect x="24" y="-34" width="234" height="58" rx="10" fill="#051329" fill-opacity="0.92" stroke="#38BDF8" stroke-width="1.5" />
    <text x="38" y="-13" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="800">QUẦN ĐẢO TRƯỜNG SA</text>
    <text x="38" y="4" fill="#E0F2FE" font-family="monospace" font-size="10.5">08°38′30″B — 111°55′55″Đ</text>
    <text x="38" y="18" fill="#93C5FD" font-family="sans-serif" font-size="9.5" font-weight="600">Tỉnh Khánh Hòa • Tiền tiêu Tổ quốc</text>
  </g>

  <!-- Node 3: Nhà giàn DK1 -->
  <g transform="translate(365, 368)">
    <circle cx="0" cy="0" r="14" fill="#22D3EE" fill-opacity="0.22" />
    <circle cx="0" cy="0" r="6" fill="#22D3EE" />
    <rect x="14" y="-16" width="165" height="32" rx="7" fill="#051329" fill-opacity="0.88" stroke="#22D3EE" stroke-opacity="0.7" />
    <text x="24" y="4" fill="#A5F3FC" font-family="sans-serif" font-size="10" font-weight="700">CỤM NHÀ GIÀN DK1 • THỀM LỤC ĐỊA</text>
  </g>

  <!-- Naval Compass Rose Top Right -->
  <g transform="translate(715, 76)">
    <circle cx="0" cy="0" r="44" fill="#040D1D" fill-opacity="0.85" stroke="#FBBF24" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="0" cy="0" r="35" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 4" />
    <polygon points="0,-32 7,-6 0,-12 -7,-6" fill="#FBBF24" />
    <polygon points="0,32 7,6 0,12 -7,6" fill="#38BDF8" opacity="0.75" />
    <polygon points="-32,0 -6,-7 -12,0 -6,7" fill="#38BDF8" opacity="0.75" />
    <polygon points="32,0 6,-7 12,0 6,7" fill="#38BDF8" opacity="0.75" />
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
    <text x="0" y="-36" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="8.5" font-weight="800">BẮC</text>
  </g>

  <!-- GIS Layer Control HUD Bottom Left -->
  <g transform="translate(26, 386)">
    <rect width="275" height="48" rx="12" fill="#040D1D" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.2" />
    <circle cx="22" cy="24" r="6" fill="#22C55E" />
    <text x="38" y="21" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800">HỆ THỐNG BẢN ĐỒ SỐ GIS 2D/3D</text>
    <text x="38" y="36" fill="#7DD3FC" font-family="monospace" font-size="9.5">Đường cơ sở • Lãnh hải • EEZ 200 hải lý</text>
  </g>
</svg>