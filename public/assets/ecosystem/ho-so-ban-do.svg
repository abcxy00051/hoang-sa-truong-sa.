<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" fill="none">
  <defs>
    <linearGradient id="atlasBg" x1="0" y1="0" x2="800" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040D1D" />
      <stop offset="50%" stop-color="#0A1E3C" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
    <linearGradient id="parchmentGrad" x1="120" y1="60" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="55%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="brassRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>

  <rect width="800" height="460" fill="url(#atlasBg)" />

  <!-- Background Nautical Rhumb Lines (Portolan Chart Style) -->
  <g stroke="#FBBF24" stroke-opacity="0.16" stroke-width="1">
    <line x1="400" y1="220" x2="50" y2="40" />
    <line x1="400" y1="220" x2="750" y2="40" />
    <line x1="400" y1="220" x2="50" y2="400" />
    <line x1="400" y1="220" x2="750" y2="400" />
    <line x1="400" y1="220" x2="400" y2="10" />
    <line x1="400" y1="220" x2="400" y2="450" />
  </g>

  <!-- Antique Map Scroll Showcase (Đại Nam nhất thống toàn đồ / Hồng Đức bản đồ) -->
  <g transform="translate(105, 56)">
    <!-- Scroll Rollers Left & Right -->
    <rect x="-16" y="-10" width="20" height="320" rx="10" fill="url(#brassRing)" />
    <rect x="576" y="-10" width="20" height="320" rx="10" fill="url(#brassRing)" />

    <!-- Main Parchment Sheet -->
    <rect x="4" y="0" width="572" height="300" rx="6" fill="url(#parchmentGrad)" stroke="#92400E" stroke-width="3" />
    <rect x="18" y="14" width="544" height="272" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4" fill="none" />

    <!-- Stylized Historical Coastline & Mountains on Parchment -->
    <path d="M55 32 C105 85, 145 140, 140 205 C135 245, 115 268, 90 278 L32 278 L32 32 Z" fill="#D97706" fill-opacity="0.28" stroke="#78350F" stroke-width="2.5" />

    <!-- Traditional Mountain Motifs -->
    <path d="M52 85 L68 62 L84 85 M68 135 L86 110 L104 135 M58 188 L76 164 L94 188" stroke="#78350F" stroke-width="2" fill="none" />

    <!-- Traditional Cartographic Cartouches: HOÀNG SA & VẠN LÝ TRƯỜNG SA -->
    <g transform="translate(250, 74)">
      <ellipse cx="75" cy="36" rx="82" ry="30" fill="#FEF9C3" stroke="#92400E" stroke-width="2" stroke-dasharray="4 3" />
      <rect x="22" y="18" width="106" height="34" rx="4" fill="#78350F" />
      <text x="75" y="34" text-anchor="middle" fill="#FEF08A" font-family="serif" font-size="12" font-weight="900">BÃI CÁT VÀNG</text>
      <text x="75" y="47" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="9" font-weight="700">(HOÀNG SA)</text>
    </g>

    <g transform="translate(305, 176)">
      <ellipse cx="90" cy="38" rx="98" ry="32" fill="#FEF9C3" stroke="#92400E" stroke-width="2" stroke-dasharray="4 3" />
      <rect x="22" y="20" width="136" height="36" rx="4" fill="#78350F" />
      <text x="90" y="36" text-anchor="middle" fill="#FEF08A" font-family="serif" font-size="11.5" font-weight="900">VẠN LÝ TRƯỜNG SA</text>
      <text x="90" y="49" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="9" font-weight="700">(QUẦN ĐẢO TRƯỜNG SA)</text>
    </g>

    <!-- Red Archival Stamp -->
    <rect x="488" y="34" width="54" height="54" rx="6" fill="#DC2626" fill-opacity="0.16" stroke="#B91C1C" stroke-width="2" />
    <text x="515" y="58" text-anchor="middle" fill="#991B1B" font-family="serif" font-size="11" font-weight="900">ĐẠI NAM</text>
    <text x="515" y="74" text-anchor="middle" fill="#991B1B" font-family="serif" font-size="9.5" font-weight="800">TOÀN ĐỒ</text>
  </g>

  <!-- Optical Inspection Loupe Over Map -->
  <g transform="translate(525, 245)">
    <line x1="48" y1="48" x2="115" y2="115" stroke="url(#brassRing)" stroke-width="14" stroke-linecap="round" />
    <circle cx="0" cy="0" r="68" fill="#040D1D" fill-opacity="0.88" stroke="url(#brassRing)" stroke-width="6" />
    <circle cx="0" cy="0" r="58" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="0" y="-16" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="800">PHÂN TÍCH BẢN ĐỒ</text>
    <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800">Paracel • Cát Vàng</text>
    <text x="0" y="22" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="9.5">Thế kỷ XV – XX</text>
  </g>

  <!-- Bottom Dossier Badge -->
  <g transform="translate(155, 392)">
    <rect width="490" height="38" rx="19" fill="#040D1D" fill-opacity="0.92" stroke="#FBBF24" stroke-opacity="0.6" />
    <text x="245" y="24" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="800">HỒ SƠ BẢN ĐỒ CỔ VIỆT NAM, PHƯƠNG TÂY &amp; BẢN ĐỒ PHÁP LÝ HIỆN ĐẠI</text>
  </g>
</svg>