<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="oceanBg7" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747" />
      <stop offset="52%" stop-color="#154A60" />
      <stop offset="100%" stop-color="#1A718D" />
    </linearGradient>
    <linearGradient id="spotCone7" x1="400" y1="68" x2="400" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6E0EB" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#29B4D1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ocean Technology Background -->
  <rect width="800" height="450" fill="url(#oceanBg7)" />

  <!-- Architectural Gallery Perspective Lines -->
  <line x1="0" y1="68" x2="800" y2="68" stroke="#B6E0EB" stroke-opacity="0.14" />
  <line x1="0" y1="382" x2="800" y2="382" stroke="#B6E0EB" stroke-opacity="0.14" />

  <!-- Overhead Museum Spotlights -->
  <polygon points="136,68 48,345 224,345" fill="url(#spotCone7)" />
  <polygon points="400,68 275,345 525,345" fill="url(#spotCone7)" />
  <polygon points="664,68 576,345 752,345" fill="url(#spotCone7)" />

  <!-- Left Exhibition Wing: KHÔNG GIAN I & II (x: 24..248, y: 76..376) -->
  <g transform="translate(24, 76)">
    <rect width="224" height="300" rx="16" fill="#113747" fill-opacity="0.95" stroke="#29B4D1" stroke-width="1.6" />
    <rect x="16" y="14" width="192" height="22" rx="11" fill="#1A718D" />
    <text x="112" y="29" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="9" font-weight="800">KHÔNG GIAN TRƯNG BÀY I &amp; II</text>

    <!-- Visual Frame: Thuyền câu Đội Hoàng Sa & Cột mốc -->
    <rect x="16" y="46" width="192" height="122" rx="10" fill="#164A5F" stroke="#29B4D1" stroke-opacity="0.5" />
    <!-- Traditional Sailboat Silhouette -->
    <path d="M56 138 L146 138 L132 154 L70 154 Z" fill="#B6E0EB" />
    <path d="M100 68 L100 136 M100 72 L138 122 L100 122 Z" stroke="#29B4D1" stroke-width="2" fill="#29B4D1" fill-opacity="0.35" />
    <path d="M96 78 L68 122 L96 122 Z" fill="#B6E0EB" fill-opacity="0.3" />
    <path d="M32 156 Q112 146 192 156" stroke="#29B4D1" stroke-width="2" fill="none" />

    <text x="112" y="190" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="11.5" font-weight="800">Dấu ấn Lịch sử &amp; Đảo xa</text>
    <text x="16" y="212" fill="#B6E0EB" font-family="sans-serif" font-size="9.5">• Hải đội Hoàng Sa kiêm quản Bắc Hải</text>
    <text x="16" y="230" fill="#B6E0EB" font-family="sans-serif" font-size="9.5">• Không ảnh thực địa Hoàng Sa, Trường Sa</text>
    <text x="16" y="248" fill="#29B4D1" font-family="sans-serif" font-size="9" font-weight="700">• Bia chủ quyền, hải đăng &amp; trạm khí tượng</text>

    <rect x="16" y="264" width="192" height="22" rx="8" fill="#164A5F" />
    <text x="112" y="279" text-anchor="middle" fill="#B6E0EB" font-family="monospace" font-size="8.5" font-weight="700">Tư liệu gốc • Minh bạch nguồn lưu trữ</text>
  </g>

  <!-- Center Grand Pedestal: CHÂU BẢN TRIỀU NGUYỄN & BẢO TÀNG SỐ (x: 264..536, y: 72..378) -->
  <g transform="translate(264, 72)">
    <rect width="272" height="306" rx="18" fill="#113747" fill-opacity="0.97" stroke="#B6E0EB" stroke-width="2.2" />
    <rect x="20" y="14" width="232" height="24" rx="12" fill="#29B4D1" />
    <text x="136" y="30" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="9.5" font-weight="900">BẢO TÀNG SỐ 5 CHUYÊN ĐỀ BIỂN ĐẢO</text>

    <!-- Illuminated Display Case -->
    <rect x="20" y="48" width="232" height="142" rx="12" fill="#164A5F" stroke="#B6E0EB" stroke-width="1.5" />

    <!-- Imperial Document / Châu bản Representation in Ocean Tech Tones -->
    <rect x="44" y="64" width="184" height="110" rx="8" fill="#B6E0EB" stroke="#1A718D" stroke-width="2" />
    <line x1="72" y1="78" x2="72" y2="156" stroke="#113747" stroke-width="2" stroke-opacity="0.7" />
    <line x1="98" y1="78" x2="98" y2="156" stroke="#113747" stroke-width="2" stroke-opacity="0.7" />
    <line x1="124" y1="78" x2="124" y2="156" stroke="#113747" stroke-width="2" stroke-opacity="0.7" />
    <!-- Imperial Seal Box -->
    <rect x="148" y="84" width="60" height="58" rx="6" fill="#1A718D" stroke="#113747" stroke-width="1.8" />
    <text x="178" y="108" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="9.5" font-weight="900">CHÂU BẢN</text>
    <text x="178" y="122" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="8.5" font-weight="800">TRIỀU NGUYỄN</text>
    <text x="178" y="135" text-anchor="middle" fill="#29B4D1" font-family="monospace" font-size="8" font-weight="800">UNESCO 2014</text>

    <text x="136" y="212" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="12" font-weight="900">20+ Hồ sơ Hiện vật &amp; Tư liệu Số</text>
    <text x="136" y="230" text-anchor="middle" fill="#29B4D1" font-family="sans-serif" font-size="9.5" font-weight="700">Hộp đèn (Lightbox) phóng to chi tiết 100% – 250%</text>

    <!-- 2 Filter Badges -->
    <rect x="20" y="242" width="112" height="22" rx="8" fill="#1A718D" />
    <text x="76" y="257" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="8.5" font-weight="800">Tư liệu lịch sử gốc</text>
    <rect x="140" y="242" width="112" height="22" rx="8" fill="#164A5F" stroke="#29B4D1" stroke-width="1" />
    <text x="196" y="257" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="8.5" font-weight="800">Đồ họa giáo dục</text>

    <!-- Bottom Strip -->
    <rect x="20" y="272" width="232" height="22" rx="11" fill="#164A5F" stroke="#B6E0EB" stroke-opacity="0.5" />
    <text x="136" y="287" text-anchor="middle" fill="#B6E0EB" font-family="sans-serif" font-size="9" font-weight="700">4 Bộ sưu tập Chuyên đề • Lưu Hiện vật Yêu thích</text>
  </g>

  <!-- Right Exhibition Wing: KHÔNG GIAN III, IV & V (x: 552..776, y: 76..376) -->
  <g transform="translate(552, 76)">
    <rect width="224" height="300" rx="16" fill="#113747" fill-opacity="0.95" stroke="#29B4D1" stroke-width="1.6" />
    <rect x="16" y="14" width="192" height="22" rx="11" fill="#1A718D" />
    <text x="112" y="29" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="9" font-weight="800">KHÔNG GIAN III, IV &amp; V</text>

    <!-- Visual Frame: Người giữ biển, Sinh thái & Sổ vàng THPT -->
    <rect x="16" y="46" width="192" height="122" rx="10" fill="#164A5F" stroke="#B6E0EB" stroke-opacity="0.5" />
    <circle cx="112" cy="106" r="38" fill="#1A718D" fill-opacity="0.5" stroke="#29B4D1" stroke-width="1.8" />
    <polygon points="112,78 120,97 140,99 125,112 129,132 112,121 95,132 99,112 84,99 104,97" fill="#B6E0EB" />

    <text x="112" y="190" text-anchor="middle" fill="#F4FBFE" font-family="sans-serif" font-size="11.5" font-weight="800">Người Giữ Biển &amp; Tuổi Trẻ</text>
    <text x="16" y="212" fill="#B6E0EB" font-family="sans-serif" font-size="9.5">• Hải quân, Cảnh sát biển &amp; Ngư dân</text>
    <text x="16" y="230" fill="#B6E0EB" font-family="sans-serif" font-size="9.5">• Đa dạng sinh học rạn san hô, cỏ biển</text>
    <text x="16" y="248" fill="#29B4D1" font-family="sans-serif" font-size="9" font-weight="700">• Sổ vàng lưu bút THPT gửi đảo tiền tiêu</text>

    <rect x="16" y="264" width="192" height="22" rx="8" fill="#29B4D1" />
    <text x="112" y="279" text-anchor="middle" fill="#113747" font-family="sans-serif" font-size="8.5" font-weight="900">GỬI THÔNG ĐIỆP RA ĐẢO XA →</text>
  </g>
</svg>