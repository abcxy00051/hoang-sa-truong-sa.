<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="bgClass" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071936" />
      <stop offset="50%" stop-color="#0C264E" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="trophyGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgClass)" />

  <!-- Interactive Quiz & Game Board -->
  <g transform="translate(80, 50)">
    <rect width="310" height="255" rx="18" fill="#040D1D" fill-opacity="0.9" stroke="#38BDF8" stroke-width="2" />
    <rect x="20" y="20" width="135" height="24" rx="12" fill="#0284C7" />
    <text x="87" y="36" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="800">TRÒ CHƠI HỌC TẬP</text>
    <text x="275" y="36" text-anchor="end" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="800">★ 100 điểm</text>

    <!-- Question Box -->
    <rect x="20" y="58" width="270" height="54" rx="10" fill="#0F2952" />
    <rect x="34" y="74" width="210" height="8" rx="4" fill="#E0F2FE" />
    <rect x="34" y="90" width="165" height="8" rx="4" fill="#94A3B8" />

    <!-- 4 Multiple Choice Options -->
    <rect x="20" y="126" width="128" height="46" rx="10" fill="#0C264E" stroke="#38BDF8" stroke-opacity="0.5" />
    <text x="36" y="153" fill="#E0F2FE" font-family="sans-serif" font-size="11" font-weight="700">A. Đáp án 01</text>

    <rect x="162" y="126" width="128" height="46" rx="10" fill="#065F46" stroke="#22C55E" stroke-width="2" />
    <text x="178" y="153" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800">B. Chính xác ✓</text>

    <rect x="20" y="184" width="128" height="46" rx="10" fill="#0C264E" stroke="#38BDF8" stroke-opacity="0.5" />
    <text x="36" y="211" fill="#E0F2FE" font-family="sans-serif" font-size="11" font-weight="700">C. Đáp án 03</text>

    <rect x="162" y="184" width="128" height="46" rx="10" fill="#0C264E" stroke="#38BDF8" stroke-opacity="0.5" />
    <text x="178" y="211" fill="#E0F2FE" font-family="sans-serif" font-size="11" font-weight="700">D. Đáp án 04</text>
  </g>

  <!-- Right Achievement & Badge Card -->
  <g transform="translate(415, 75)">
    <rect width="155" height="210" rx="18" fill="#071936" stroke="#FBBF24" stroke-width="2" />
    <circle cx="77.5" cy="72" r="40" fill="#F59E0B" fill-opacity="0.2" stroke="#FBBF24" stroke-width="2" />
    <polygon points="77.5,42 86,60 106,62 91,75 95,94 77.5,84 60,94 64,75 49,62 69,60" fill="url(#trophyGold)" />
    <text x="77.5" y="138" text-anchor="middle" fill="#FCD34D" font-family="sans-serif" font-size="11.5" font-weight="800">HUY HIỆU CHỦ QUYỀN</text>
    <text x="77.5" y="156" text-anchor="middle" fill="#E0F2FE" font-family="sans-serif" font-size="10">Phòng học tương tác</text>
    <rect x="24" y="172" width="107" height="20" rx="10" fill="#F59E0B" />
    <text x="77.5" y="186" text-anchor="middle" fill="#040D1D" font-family="sans-serif" font-size="9.5" font-weight="800">KHỐI 10 • 11 • 12</text>
  </g>
</svg>
