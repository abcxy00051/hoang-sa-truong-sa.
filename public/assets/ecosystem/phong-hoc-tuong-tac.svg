<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" fill="none">
  <defs>
    <linearGradient id="classBg" x1="0" y1="0" x2="800" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040D1D" />
      <stop offset="52%" stop-color="#0A2248" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="goldMedal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="460" fill="url(#classBg)" />

  <!-- Subtle Background Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Left Main Interactive Classroom Board -->
  <g transform="translate(52, 46)">
    <rect width="450" height="365" rx="22" fill="#051329" fill-opacity="0.95" stroke="#38BDF8" stroke-width="2" />

    <!-- Header Strip -->
    <rect x="22" y="20" width="168" height="28" rx="14" fill="#0284C7" />
    <text x="106" y="38" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800">8 CHUYÊN ĐỀ HỌC TẬP</text>

    <!-- Progress Bar -->
    <rect x="215" y="25" width="145" height="18" rx="9" fill="#0B254B" stroke="#38BDF8" stroke-opacity="0.4" />
    <rect x="217" y="27" width="112" height="14" rx="7" fill="#22C55E" />
    <text x="422" y="38" text-anchor="end" fill="#FCD34D" font-family="sans-serif" font-size="12" font-weight="800">80 Câu hỏi</text>

    <!-- Question Prompt Card -->
    <rect x="22" y="64" width="406" height="78" rx="14" fill="#091E40" stroke="#38BDF8" stroke-opacity="0.4" />
    <text x="40" y="88" fill="#FCD34D" font-family="sans-serif" font-size="10.5" font-weight="800">CÂU HỎI TƯƠNG TÁC CHỦ QUYỀN BIỂN ĐẢO:</text>
    <text x="40" y="109" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Đội Hoàng Sa được chúa Nguyễn thành lập vào thời kỳ nào</text>
    <text x="40" y="127" fill="#E0F2FE" font-family="sans-serif" font-size="11.5">để thực thi chủ quyền tại quần đảo Hoàng Sa?</text>

    <!-- 4 Answer Cards -->
    <rect x="22" y="158" width="196" height="54" rx="12" fill="#065F46" stroke="#22C55E" stroke-width="2" />
    <text x="38" y="183" fill="#FFFFFF" font-family="sans-serif" font-size="11.5" font-weight="800">A. Đầu thế kỷ XVII ✓</text>
    <text x="38" y="200" fill="#A7F3D0" font-family="sans-serif" font-size="9.5">Chính xác • Có giải thích chi tiết</text>

    <rect x="232" y="158" width="196" height="54" rx="12" fill="#0B254B" stroke="#38BDF8" stroke-opacity="0.4" />
    <text x="248" y="189" fill="#E0F2FE" font-family="sans-serif" font-size="11.5" font-weight="600">B. Cuối thế kỷ XVIII</text>

    <rect x="22" y="224" width="196" height="54" rx="12" fill="#0B254B" stroke="#38BDF8" stroke-opacity="0.4" />
    <text x="38" y="255" fill="#E0F2FE" font-family="sans-serif" font-size="11.5" font-weight="600">C. Giữa thế kỷ XIX</text>

    <rect x="232" y="224" width="196" height="54" rx="12" fill="#0B254B" stroke="#38BDF8" stroke-opacity="0.4" />
    <text x="248" y="255" fill="#E0F2FE" font-family="sans-serif" font-size="11.5" font-weight="600">D. Đầu thế kỷ XX</text>

    <!-- Interactive Activity Modes Strip -->
    <g transform="translate(22, 296)">
      <rect width="128" height="46" rx="10" fill="#091E40" stroke="#FBBF24" stroke-opacity="0.6" />
      <text x="64" y="21" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="10" font-weight="800">ĐÚNG / SAI</text>
      <text x="64" y="36" text-anchor="middle" fill="#E0F2FE" font-family="sans-serif" font-size="9">Giải thích sử liệu</text>

      <rect x="139" y="0" width="128" height="46" rx="10" fill="#091E40" stroke="#38BDF8" stroke-opacity="0.6" />
      <text x="203" y="21" text-anchor="middle" fill="#7DD3FC" font-family="sans-serif" font-size="10" font-weight="800">GHÉP NIÊN BIỂU</text>
      <text x="203" y="36" text-anchor="middle" fill="#E0F2FE" font-family="sans-serif" font-size="9">Mốc sự kiện lịch sử</text>

      <rect x="278" y="0" width="128" height="46" rx="10" fill="#091E40" stroke="#22D3EE" stroke-opacity="0.6" />
      <text x="342" y="21" text-anchor="middle" fill="#67E8F9" font-family="sans-serif" font-size="10" font-weight="800">NHẬN DIỆN ĐẢO</text>
      <text x="342" y="36" text-anchor="middle" fill="#E0F2FE" font-family="sans-serif" font-size="9">Tọa độ trên bản đồ</text>
    </g>
  </g>

  <!-- Right Mastery & Sovereignty Trophy Card -->
  <g transform="translate(530, 66)">
    <rect width="218" height="325" rx="22" fill="#071936" fill-opacity="0.96" stroke="url(#goldMedal)" stroke-width="2.2" />

    <circle cx="109" cy="100" r="56" fill="#F59E0B" fill-opacity="0.16" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5 4" />
    <circle cx="109" cy="100" r="42" fill="#040D1D" stroke="#FBBF24" stroke-width="1.5" />
    <polygon points="109,64 119,86 143,89 125,105 130,129 109,117 88,129 93,105 75,89 99,86" fill="url(#goldMedal)" />

    <text x="109" y="182" text-anchor="middle" fill="#FCD34D" font-family="sans-serif" font-size="13" font-weight="900">THỬ THÁCH 3 CẤP ĐỘ</text>
    <text x="109" y="202" text-anchor="middle" fill="#E0F2FE" font-family="sans-serif" font-size="10.5">Dễ • Trung bình • Nâng cao</text>

    <!-- 3 Tier Bars -->
    <rect x="28" y="220" width="162" height="22" rx="11" fill="#0B254B" />
    <text x="109" y="235" text-anchor="middle" fill="#86EFAC" font-family="sans-serif" font-size="9.5" font-weight="700">★ Cấp độ 1: Khởi động</text>

    <rect x="28" y="248" width="162" height="22" rx="11" fill="#0B254B" />
    <text x="109" y="263" text-anchor="middle" fill="#7DD3FC" font-family="sans-serif" font-size="9.5" font-weight="700">★★ Cấp độ 2: Vượt sóng</text>

    <rect x="28" y="276" width="162" height="24" rx="12" fill="url(#goldMedal)" />
    <text x="109" y="292" text-anchor="middle" fill="#040D1D" font-family="sans-serif" font-size="10" font-weight="900">★★★ Cấp độ 3: Vững chủ quyền</text>
  </g>
</svg>