<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" fill="none">
  <defs>
    <linearGradient id="timeBg" x1="0" y1="0" x2="800" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040D1D" />
      <stop offset="50%" stop-color="#091E40" />
      <stop offset="100%" stop-color="#153B75" />
    </linearGradient>
    <linearGradient id="axisGold" x1="50" y1="240" x2="750" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <rect width="800" height="460" fill="url(#timeBg)" />

  <!-- Subtle Historical Compass & Rings -->
  <circle cx="400" cy="230" r="185" stroke="#FBBF24" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="400" cy="230" r="125" stroke="#38BDF8" stroke-opacity="0.14" stroke-width="1.2" />

  <!-- Top Banner Pill -->
  <rect x="225" y="28" width="350" height="32" rx="16" fill="#051329" stroke="#FBBF24" stroke-opacity="0.6" />
  <text x="400" y="48" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="800">BIÊN NIÊN SỬ 6 THỜI KỲ • 25 CỘT MỐC CHỦ QUYỀN</text>

  <!-- Main Chronological Axis Line -->
  <line x1="65" y1="240" x2="735" y2="240" stroke="url(#axisGold)" stroke-width="6" stroke-linecap="round" />

  <!-- Era Node 1: Thế kỷ XVII - XVIII (Đội Hoàng Sa) -->
  <g transform="translate(145, 240)">
    <line x1="0" y1="0" x2="0" y2="-68" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="0" cy="0" r="13" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
    <rect x="-95" y="-158" width="190" height="88" rx="14" fill="#051329" fill-opacity="0.95" stroke="#F59E0B" stroke-width="1.6" />
    <text x="0" y="-134" text-anchor="middle" fill="#FCD34D" font-family="sans-serif" font-size="11" font-weight="800">THẾ KỶ XVII – XVIII</text>
    <text x="0" y="-114" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">Đội Hoàng Sa &amp; Bắc Hải</text>
    <text x="0" y="-95" text-anchor="middle" fill="#93C5FD" font-family="sans-serif" font-size="9.5">Phủ biên tạp lục (1776)</text>
    <text x="0" y="-80" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="9">Thực thi chủ quyền liên tục</text>
  </g>

  <!-- Era Node 2: Thời Nguyễn (1816 - 1836) -->
  <g transform="translate(320, 240)">
    <line x1="0" y1="0" x2="0" y2="62" stroke="#FBBF24" stroke-width="2.5" />
    <circle cx="0" cy="0" r="14" fill="#FDE047" stroke="#FFFFFF" stroke-width="3" />
    <rect x="-100" y="64" width="200" height="92" rx="14" fill="#051329" fill-opacity="0.95" stroke="#FDE047" stroke-width="1.8" />
    <text x="0" y="88" text-anchor="middle" fill="#FDE047" font-family="sans-serif" font-size="11" font-weight="800">TRIỀU NGUYỄN (1802–1884)</text>
    <text x="0" y="108" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">Châu bản &amp; Cắm mốc 1816, 1836</text>
    <text x="0" y="127" text-anchor="middle" fill="#93C5FD" font-family="sans-serif" font-size="9.5">Đại Nam nhất thống toàn đồ</text>
    <text x="0" y="143" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="9">Di sản tư liệu thế giới UNESCO</text>
  </g>

  <!-- Era Node 3: 1938 - 1951 - 1975 -->
  <g transform="translate(495, 240)">
    <line x1="0" y1="0" x2="0" y2="-68" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="13" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />
    <rect x="-95" y="-158" width="190" height="88" rx="14" fill="#051329" fill-opacity="0.95" stroke="#38BDF8" stroke-width="1.6" />
    <text x="0" y="-134" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="800">THẾ KỶ XX (1938 – 1975)</text>
    <text x="0" y="-114" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">Bia chủ quyền &amp; San Francisco</text>
    <text x="0" y="-95" text-anchor="middle" fill="#93C5FD" font-family="sans-serif" font-size="9.5">Nghị định 156-SC (1938)</text>
    <text x="0" y="-80" text-anchor="middle" fill="#7DD3FC" font-family="sans-serif" font-size="9">Giải phóng Trường Sa (4/1975)</text>
  </g>

  <!-- Era Node 4: 1982 - 2012 - Nay -->
  <g transform="translate(665, 240)">
    <line x1="0" y1="0" x2="0" y2="62" stroke="#22D3EE" stroke-width="2.5" />
    <circle cx="0" cy="0" r="13" fill="#22D3EE" stroke="#FFFFFF" stroke-width="3" />
    <rect x="-98" y="64" width="196" height="92" rx="14" fill="#051329" fill-opacity="0.95" stroke="#22D3EE" stroke-width="1.6" />
    <text x="0" y="88" text-anchor="middle" fill="#67E8F9" font-family="sans-serif" font-size="11" font-weight="800">1975 ĐẾN NAY</text>
    <text x="0" y="108" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">UNCLOS 1982 &amp; Luật Biển 2012</text>
    <text x="0" y="127" text-anchor="middle" fill="#93C5FD" font-family="sans-serif" font-size="9.5">Huyện đảo Hoàng Sa &amp; Trường Sa</text>
    <text x="0" y="143" text-anchor="middle" fill="#A5F3FC" font-family="sans-serif" font-size="9">Nhà giàn DK1 • Kinh tế biển</text>
  </g>

  <!-- Bottom Verification Footer -->
  <rect x="195" y="408" width="410" height="32" rx="16" fill="#040D1D" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.4" />
  <text x="400" y="428" text-anchor="middle" fill="#E0F2FE" font-family="sans-serif" font-size="10.5" font-weight="700">✦ Đối chiếu Chính sử, Châu bản triều Nguyễn &amp; Văn bản Pháp luật</text>
</svg>