<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="bgTime" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040D1D" />
      <stop offset="55%" stop-color="#0C264E" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="60" y1="180" x2="580" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgTime)" />

  <!-- Subtle Historical Compass Background -->
  <circle cx="320" cy="180" r="140" stroke="#FBBF24" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="8 8" />

  <!-- Main Timeline Axis -->
  <line x1="65" y1="190" x2="575" y2="190" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Milestone 1 -->
  <g transform="translate(130, 190)">
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#FBBF24" stroke-width="2" />
    <circle cx="0" cy="0" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
    <rect x="-70" y="-120" width="140" height="62" rx="10" fill="#071936" stroke="#FBBF24" stroke-width="1.5" />
    <text x="0" y="-96" text-anchor="middle" fill="#FCD34D" font-family="sans-serif" font-size="11" font-weight="800">GIAI ĐOẠN I</text>
    <text x="0" y="-78" text-anchor="middle" fill="#E0F2FE" font-family="sans-serif" font-size="10">Xác lập chủ quyền</text>
  </g>

  <!-- Milestone 2 -->
  <g transform="translate(320, 190)">
    <line x1="0" y1="0" x2="0" y2="55" stroke="#FBBF24" stroke-width="2" />
    <circle cx="0" cy="0" r="13" fill="#FBBF24" stroke="#FFFFFF" stroke-width="3" />
    <rect x="-80" y="58" width="160" height="64" rx="10" fill="#071936" stroke="#FBBF24" stroke-width="1.8" />
    <text x="0" y="82" text-anchor="middle" fill="#FCD34D" font-family="sans-serif" font-size="11" font-weight="800">GIAI ĐOẠN II</text>
    <text x="0" y="100" text-anchor="middle" fill="#E0F2FE" font-family="sans-serif" font-size="10">Thực thi liên tục</text>
  </g>

  <!-- Milestone 3 -->
  <g transform="translate(510, 190)">
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#38BDF8" stroke-width="2" />
    <circle cx="0" cy="0" r="11" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />
    <rect x="-75" y="-120" width="150" height="62" rx="10" fill="#071936" stroke="#38BDF8" stroke-width="1.5" />
    <text x="0" y="-96" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="800">HIỆN ĐẠI</text>
    <text x="0" y="-78" text-anchor="middle" fill="#E0F2FE" font-family="sans-serif" font-size="10">Bảo vệ &amp; Phát triển</text>
  </g>

  <!-- Bottom Banner Label -->
  <rect x="190" y="302" width="260" height="32" rx="16" fill="#040D1D" fill-opacity="0.85" stroke="#FBBF24" stroke-opacity="0.5" />
  <text x="320" y="322" text-anchor="middle" fill="#FCD34D" font-family="sans-serif" font-size="11" font-weight="800">TRỤC THỜI GIAN TƯƠNG TÁC SỐ</text>
</svg>
