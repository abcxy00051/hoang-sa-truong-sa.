<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgCd08" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747"/>
      <stop offset="55%" stop-color="#1A718D"/>
      <stop offset="100%" stop-color="#113747"/>
    </linearGradient>
    <pattern id="gridCd08" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#B6E0EB" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgCd08)"/>
  <rect width="800" height="450" rx="16" fill="url(#gridCd08)"/>

  <!-- Header in Safe Zone (y: 60..388) -->
  <rect x="28" y="60" width="744" height="46" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="1.5"/>
  <rect x="40" y="69" width="118" height="28" rx="14" fill="#29B4D1"/>
  <text x="99" y="87" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">CHUYÊN ĐỀ 08</text>
  <text x="172" y="88" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="800">TRÁCH NHIỆM TUỔI TRẺ: BẢO VỆ CHỦ QUYỀN SỐ &amp; LUẬT ĐO ĐẠC BẢN ĐỒ 2018</text>

  <!-- Left Panel: 5-Step Digital Map Verification Protocol -->
  <rect x="28" y="118" width="430" height="264" rx="14" fill="#113747" stroke="#29B4D1" stroke-width="1.8"/>
  <text x="46" y="142" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="12.5" font-weight="800">5 BƯỚC KIỂM CHỨNG BẢN ĐỒ SỐ TRÊN KHÔNG GIAN MẠNG</text>

  <rect x="44" y="152" width="398" height="38" rx="8" fill="#1A718D" stroke="#29B4D1" stroke-width="1"/>
  <text x="56" y="169" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">BƯỚC 1: KIỂM TRA HAI QUẦN ĐẢO HOÀNG SA &amp; TRƯỜNG SA</text>
  <text x="56" y="183" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Bắt buộc thể hiện đầy đủ quần đảo Hoàng Sa (Đà Nẵng) &amp; Trường Sa (Khánh Hòa)</text>

  <rect x="44" y="196" width="398" height="38" rx="8" fill="#1A718D" stroke="#29B4D1" stroke-width="1"/>
  <text x="56" y="213" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">BƯỚC 2: PHÁT HIỆN ĐƯỜNG ĐỨT ĐOẠN PHI PHÁP</text>
  <text x="56" y="227" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Tuyệt đối không sử dụng bản đồ cài cắm “đường chín đoạn” trái UNCLOS 1982</text>

  <rect x="44" y="240" width="398" height="38" rx="8" fill="#1A718D" stroke="#29B4D1" stroke-width="1"/>
  <text x="56" y="257" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">BƯỚC 3: ĐỐI CHIẾU DANH XƯNG ĐỊA DANH TIẾNG VIỆT</text>
  <text x="56" y="271" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Ghi đúng tên Biển Đông, Hoàng Sa, Trường Sa, Phú Quốc, Côn Đảo, Bạch Long Vĩ</text>

  <rect x="44" y="284" width="398" height="38" rx="8" fill="#1A718D" stroke="#29B4D1" stroke-width="1"/>
  <text x="56" y="301" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">BƯỚC 4: XÁC MINH NGUỒN XUẤT BẢN HỢP PHÁP</text>
  <text x="56" y="315" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Ưu tiên dữ liệu Cục Đo đạc, Bản đồ và Thông tin địa lý Việt Nam (Bộ TN&amp;MT)</text>

  <rect x="44" y="328" width="398" height="40" rx="8" fill="#29B4D1"/>
  <text x="56" y="345" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="900">BƯỚC 5: BÁO CÁO VI PHẠM THEO LUẬT ĐO ĐẠC VÀ BẢN ĐỒ 2018</text>
  <text x="56" y="360" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="700">Vi phạm Khoản 1 Điều 6 Luật Đo đạc và Bản đồ 2018: Gỡ bỏ &amp; thông báo cơ quan</text>

  <!-- Right Panel: Youth Action & Digital Citizenship -->
  <rect x="472" y="118" width="300" height="264" rx="14" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8"/>
  <text x="488" y="142" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="12.5" font-weight="800">HÀNH ĐỘNG CỦA TUỔI TRẺ VIỆT NAM</text>

  <rect x="486" y="152" width="272" height="64" rx="10" fill="#113747"/>
  <text x="500" y="172" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">1. Năng lực Học thuật &amp; Pháp lý</text>
  <text x="500" y="190" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Nắm vững Châu bản triều Nguyễn,</text>
  <text x="500" y="205" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">UNCLOS 1982 &amp; Luật Biển Việt Nam 2012</text>

  <rect x="486" y="224" width="272" height="64" rx="10" fill="#1A718D"/>
  <text x="500" y="244" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">2. Công nghệ Số &amp; Truyền thông</text>
  <text x="500" y="262" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Xây dựng bản đồ GIS, triển lãm số,</text>
  <text x="500" y="277" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Infographic song ngữ Việt – Anh chuẩn xác</text>

  <rect x="486" y="296" width="272" height="72" rx="10" fill="#113747"/>
  <text x="500" y="316" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">3. Hướng về Biển đảo Tiền tiêu</text>
  <text x="500" y="334" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">• Phong trào “Nghĩa tình biên giới, hải đảo”</text>
  <text x="500" y="350" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">• “Hãy làm sạch biển” &amp; Khởi nghiệp biển</text>
</svg>
