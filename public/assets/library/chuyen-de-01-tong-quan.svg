<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="bg01" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041E3A" />
      <stop offset="55%" stop-color="#073B6B" />
      <stop offset="100%" stop-color="#0A588A" />
    </linearGradient>
    <linearGradient id="gold01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="20" fill="url(#bg01)" />
  <g stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120" stroke-dasharray="5 5" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" stroke-dasharray="5 5" />
    <line x1="200" y1="0" x2="200" y2="480" stroke-dasharray="5 5" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" stroke-dasharray="5 5" />
  </g>
  <!-- Vietnam Coastline & 1 Million km2 Sea Space -->
  <path d="M295,65 C330,90 315,120 295,148 C275,176 320,210 355,255 C385,295 375,350 335,388 C305,415 280,425 265,440"
        stroke="url(#gold01)" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M310,65 C430,105 535,190 540,295 C545,375 470,435 350,455"
        stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="8 6" fill="#0284C7" fill-opacity="0.18" />
  <!-- 5 UNCLOS Zones Concentric Arcs -->
  <circle cx="445" cy="210" r="14" fill="#EF4444" stroke="#FEF08A" stroke-width="2.5" />
  <text x="468" y="215" fill="#FEF08A" font-family="sans-serif" font-size="14" font-weight="700">Hoàng Sa</text>
  <circle cx="485" cy="345" r="14" fill="#EF4444" stroke="#FEF08A" stroke-width="2.5" />
  <text x="508" y="350" fill="#FEF08A" font-family="sans-serif" font-size="14" font-weight="700">Trường Sa</text>
  <!-- Key Metrics Cards -->
  <g transform="translate(42, 48)">
    <rect width="215" height="92" rx="14" fill="#06192E" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.5" />
    <text x="18" y="32" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">ĐƯỜNG BỜ BIỂN VIỆT NAM</text>
    <text x="18" y="64" fill="#FDE68A" font-family="sans-serif" font-size="26" font-weight="800">&gt; 3.260 km</text>
    <text x="18" y="82" fill="#BAE6FD" font-family="sans-serif" font-size="11">Móng Cái (Quảng Ninh) → Hà Tiên</text>
  </g>
  <g transform="translate(42, 158)">
    <rect width="215" height="92" rx="14" fill="#06192E" fill-opacity="0.88" stroke="#F59E0B" stroke-opacity="0.5" />
    <text x="18" y="32" fill="#FDE68A" font-family="sans-serif" font-size="12" font-weight="700">KHÔNG GIAN BIỂN VIỆT NAM</text>
    <text x="18" y="64" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800">~ 1 Triệu km²</text>
    <text x="18" y="82" fill="#BAE6FD" font-family="sans-serif" font-size="11">Hơn 3.000 đảo lớn nhỏ &amp; 2 quần đảo</text>
  </g>
  <g transform="translate(545, 52)">
    <rect width="215" height="118" rx="14" fill="#06192E" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.45" />
    <text x="18" y="28" fill="#FDE68A" font-family="sans-serif" font-size="12" font-weight="700">5 VÙNG BIỂN (UNCLOS 1982)</text>
    <text x="18" y="48" fill="#E0F2FE" font-family="sans-serif" font-size="11">1. Nội thủy (Chủ quyền tuyệt đối)</text>
    <text x="18" y="65" fill="#E0F2FE" font-family="sans-serif" font-size="11">2. Lãnh hải (12 hải lý)</text>
    <text x="18" y="82" fill="#E0F2FE" font-family="sans-serif" font-size="11">3. Vùng tiếp giáp lãnh hải (12 hải lý)</text>
    <text x="18" y="99" fill="#E0F2FE" font-family="sans-serif" font-size="11">4. Vùng đặc quyền kinh tế (200 HL)</text>
  </g>
  <rect x="42" y="405" width="716" height="44" rx="10" fill="#041527" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.35" />
  <text x="400" y="432" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="14" font-weight="700">CHUYÊN ĐỀ 01: TỔNG QUAN BIỂN ĐẢO VIỆT NAM &amp; VỊ TRÍ ĐỊA CHIẾN LƯỢC</text>
</svg>
