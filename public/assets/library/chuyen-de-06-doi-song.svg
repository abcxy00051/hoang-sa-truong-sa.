<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgCd06" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747"/>
      <stop offset="55%" stop-color="#1A718D"/>
      <stop offset="100%" stop-color="#113747"/>
    </linearGradient>
    <pattern id="gridCd06" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#B6E0EB" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgCd06)"/>
  <rect width="800" height="450" rx="16" fill="url(#gridCd06)"/>

  <!-- Header in Safe Zone (y: 60..388) -->
  <rect x="28" y="60" width="744" height="46" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="1.5"/>
  <rect x="40" y="69" width="118" height="28" rx="14" fill="#29B4D1"/>
  <text x="99" y="87" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">CHUYÊN ĐỀ 06</text>
  <text x="172" y="88" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="800">ĐỜI SỐNG DÂN SINH, 12 ĐƠN VỊ HÀNH CHÍNH ĐẢO &amp; NHÀ GIÀN DK1</text>

  <!-- Left Panel: 12 Island Districts & City System -->
  <rect x="28" y="118" width="356" height="264" rx="14" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8"/>
  <text x="44" y="142" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="12.5" font-weight="800">HỆ THỐNG 12 ĐƠN VỊ HÀNH CHÍNH CẤP HUYỆN/TP ĐẢO</text>

  <rect x="42" y="152" width="328" height="50" rx="8" fill="#113747"/>
  <text x="54" y="171" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">Bắc Bộ (04 huyện đảo):</text>
  <text x="54" y="189" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">Cô Tô, Vân Đồn (Quảng Ninh) • Cát Hải, Bạch Long Vĩ (Hải Phòng)</text>

  <rect x="42" y="210" width="328" height="50" rx="8" fill="#1A718D"/>
  <text x="54" y="229" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">Bắc &amp; Trung Trung Bộ (03 huyện đảo):</text>
  <text x="54" y="247" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">Cồn Cỏ (Quảng Trị) • Hoàng Sa (Đà Nẵng) • Lý Sơn (Quảng Ngãi)</text>

  <rect x="42" y="268" width="328" height="50" rx="8" fill="#113747"/>
  <text x="54" y="287" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">Nam Trung Bộ (02 huyện đảo):</text>
  <text x="54" y="305" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">Trường Sa (Khánh Hòa: 1 thị trấn, 2 xã đảo) • Phú Quý (Bình Thuận)</text>

  <rect x="42" y="326" width="328" height="44" rx="8" fill="#29B4D1"/>
  <text x="54" y="344" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="900">Nam Bộ (02 huyện đảo &amp; 01 TP đảo):</text>
  <text x="54" y="361" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="700">Côn Đảo (BR-VT) • Kiên Hải &amp; TP. Phú Quốc (Kiên Giang)</text>

  <!-- Right Panel: 4 Pillars of Civil & Defense Institutions at Sea -->
  <rect x="398" y="118" width="374" height="264" rx="14" fill="#113747" stroke="#29B4D1" stroke-width="1.8"/>
  <text x="416" y="142" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="12.5" font-weight="800">THIẾT CHẾ DÂN SINH &amp; THẾ TRẬN NƠI ĐẦU SÓNG</text>

  <!-- 2x2 Grid of Institutions -->
  <rect x="414" y="154" width="166" height="102" rx="10" fill="#1A718D" stroke="#29B4D1" stroke-width="1.2"/>
  <text x="426" y="176" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">1. Hành chính &amp; Trường học</text>
  <text x="426" y="195" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">• TT. Trường Sa, xã Song Tử Tây,</text>
  <text x="426" y="210" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">  xã Sinh Tồn (NĐ 65/2007/NĐ-CP)</text>
  <text x="426" y="226" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">• Trường học, hộ dân, chùa đảo</text>
  <text x="426" y="242" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="700">• Điện gió – mặt trời &amp; 4G/5G</text>

  <rect x="590" y="154" width="166" height="102" rx="10" fill="#1A718D" stroke="#29B4D1" stroke-width="1.2"/>
  <text x="602" y="176" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">2. Âu tàu &amp; Quân dân y</text>
  <text x="602" y="195" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">• Âu tàu Đá Tây, Song Tử Tây,</text>
  <text x="602" y="210" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">  Sinh Tồn tránh trú bão an toàn</text>
  <text x="602" y="226" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">• Trung tâm Y tế Trường Sa kết</text>
  <text x="602" y="242" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="700">  nối Telemedicine BV Quân y 175</text>

  <rect x="414" y="266" width="166" height="102" rx="10" fill="#B6E0EB"/>
  <text x="426" y="288" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="900">3. Hải đăng &amp; Khí tượng</text>
  <text x="426" y="307" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">• Hải đăng Song Tử Tây, Đá Lát,</text>
  <text x="426" y="322" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">  Đá Tây, An Bang, Tiên Nữ...</text>
  <text x="426" y="338" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">• Trạm Khí tượng WMO quốc tế</text>
  <text x="426" y="354" fill="#1A718D" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="800">• Bảo đảm an toàn hàng hải</text>

  <rect x="590" y="266" width="166" height="102" rx="10" fill="#29B4D1"/>
  <text x="602" y="288" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="900">4. Cụm Nhà giàn DK1</text>
  <text x="602" y="307" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="700">• Thành lập từ ngày 05/07/1989</text>
  <text x="602" y="322" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="700">• Trên thềm lục địa phía Nam:</text>
  <text x="602" y="338" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="700">  Tư Chính, Phúc Nguyên, Quế</text>
  <text x="602" y="354" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="800">  Đường, Ba Kè, Huyền Trân...</text>
</svg>
