<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="bg06" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2239" />
      <stop offset="50%" stop-color="#133B5C" />
      <stop offset="100%" stop-color="#1E5F74" />
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="20" fill="url(#bg06)" />
  <!-- Sun & Warm Horizon Glow -->
  <circle cx="570" cy="145" r="78" fill="#F59E0B" fill-opacity="0.22" />
  <circle cx="570" cy="145" r="48" fill="#FDE047" fill-opacity="0.38" />
  <!-- DK1 Platform & Lighthouse Silhouette -->
  <g transform="translate(495, 115)">
    <!-- Steel Jacket Legs -->
    <line x1="40" y1="95" x2="22" y2="215" stroke="#F59E0B" stroke-width="4" />
    <line x1="110" y1="95" x2="128" y2="215" stroke="#F59E0B" stroke-width="4" />
    <line x1="32" y1="145" x2="118" y2="145" stroke="#F59E0B" stroke-width="3" />
    <line x1="36" y1="105" x2="122" y2="195" stroke="#F59E0B" stroke-width="2" />
    <line x1="114" y1="105" x2="28" y2="195" stroke="#F59E0B" stroke-width="2" />
    <!-- Upper Deck -->
    <rect x="20" y="58" width="110" height="38" rx="4" fill="#F8FAFC" stroke="#0284C7" stroke-width="2" />
    <!-- Red Flag with Yellow Star -->
    <line x1="75" y1="12" x2="75" y2="58" stroke="#F8FAFC" stroke-width="2.5" />
    <rect x="75" y="12" width="38" height="24" rx="2" fill="#EF4444" />
    <circle cx="94" cy="24" r="5" fill="#FDE047" />
    <text x="75" y="245" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="13" font-weight="700">NHÀ GIÀN DK1 &amp; ĐẢO TIỀN TIÊU</text>
  </g>
  <!-- Left Card: Life & Community on the Islands -->
  <g transform="translate(42, 48)">
    <rect width="375" height="330" rx="14" fill="#061626" fill-opacity="0.9" stroke="#F59E0B" stroke-opacity="0.45" />
    <text x="22" y="36" fill="#FDE68A" font-family="sans-serif" font-size="14" font-weight="800">NHỊP SỐNG NƠI ĐẦU SÓNG NGỌN GIÓ</text>
    <line x1="22" y1="48" x2="345" y2="48" stroke="#F59E0B" stroke-opacity="0.35" />
    <text x="22" y="80" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">• Trường học &amp; Bệnh xá nơi đảo xa</text>
    <text x="22" y="100" fill="#E0F2FE" font-family="sans-serif" font-size="11">Trường tiểu học tại thị trấn Trường Sa, Song Tử Tây,</text>
    <text x="22" y="117" fill="#E0F2FE" font-family="sans-serif" font-size="11">Sinh Tồn; hệ thống y tế quân dân y cấp cứu ngư dân.</text>

    <text x="22" y="150" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">• Âu tàu &amp; Điểm tựa cho ngư dân vươn khơi</text>
    <text x="22" y="170" fill="#E0F2FE" font-family="sans-serif" font-size="11">Cung cấp nước ngọt, nhiên liệu, sửa chữa tàu thuyền</text>
    <text x="22" y="187" fill="#E0F2FE" font-family="sans-serif" font-size="11">và tránh trú bão an toàn giữa ngư trường truyền thống.</text>

    <text x="22" y="220" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">• Phủ xanh đảo đá &amp; Năng lượng sạch</text>
    <text x="22" y="240" fill="#E0F2FE" font-family="sans-serif" font-size="11">Bàng vuông, phong ba, bão táp, vườn rau tăng gia</text>
    <text x="22" y="257" fill="#E0F2FE" font-family="sans-serif" font-size="11">và hệ thống điện mặt trời, điện gió trên các đảo.</text>

    <rect x="22" y="276" width="330" height="36" rx="8" fill="#0F2942" stroke="#38BDF8" stroke-opacity="0.4" />
    <text x="187" y="299" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="700">"Đảo là nhà, biển cả là quê hương"</text>
  </g>
  <rect x="42" y="405" width="716" height="44" rx="10" fill="#051321" fill-opacity="0.92" stroke="#F59E0B" stroke-opacity="0.4" />
  <text x="400" y="432" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="14" font-weight="700">CHUYÊN ĐỀ 06: ĐỜI SỐNG CON NGƯỜI NƠI BIỂN ĐẢO TIỀN TIÊU</text>
</svg>
