<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="histBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040D1D" />
      <stop offset="55%" stop-color="#0C264E" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="scrollGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#histBg)" />
  <circle cx="320" cy="180" r="145" stroke="#FBBF24" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 6" />
  <!-- Royal Scroll / Chau Ban Illustration -->
  <g transform="translate(150, 62)">
    <rect x="0" y="10" width="16" height="216" rx="8" fill="url(#scrollGold)" />
    <rect x="324" y="10" width="16" height="216" rx="8" fill="url(#scrollGold)" />
    <rect x="16" y="22" width="308" height="192" fill="#071936" stroke="#FBBF24" stroke-width="2" />
    <rect x="36" y="42" width="110" height="22" rx="6" fill="#F59E0B" fill-opacity="0.25" stroke="#FBBF24" />
    <text x="91" y="57" text-anchor="middle" fill="#FCD34D" font-family="sans-serif" font-size="10" font-weight="800">SỬ LIỆU CHỦ QUYỀN</text>
    <!-- Red Seal Stamp -->
    <rect x="248" y="42" width="48" height="48" rx="6" fill="#DC2626" fill-opacity="0.28" stroke="#EF4444" stroke-width="2" />
    <text x="272" y="70" text-anchor="middle" fill="#FCA5A5" font-family="serif" font-size="11" font-weight="800">CHÂU BẢN</text>
    <!-- Text lines -->
    <line x1="36" y1="88" x2="215" y2="88" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="110" x2="200" y2="110" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="36" y1="130" x2="275" y2="130" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="36" y1="150" x2="250" y2="150" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <rect x="36" y="172" width="268" height="26" rx="13" fill="url(#scrollGold)" />
    <text x="170" y="189" text-anchor="middle" fill="#040D1D" font-family="sans-serif" font-size="10.5" font-weight="800">HOÀNG SA &amp; TRƯỜNG SA TRONG LỊCH SỬ</text>
  </g>
</svg>
