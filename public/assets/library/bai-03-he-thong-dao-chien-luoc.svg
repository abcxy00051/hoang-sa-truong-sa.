<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113747" />
      <stop offset="60%" stop-color="#1A718D" />
      <stop offset="100%" stop-color="#113747" />
    </linearGradient>
    <pattern id="grid03" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#29B4D1" stroke-width="0.6" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg03)" />
  <rect width="800" height="500" fill="url(#grid03)" />

  <!-- Top Header Badge -->
  <rect x="36" y="28" width="350" height="34" rx="8" fill="#113747" stroke="#29B4D1" stroke-width="1.5" />
  <text x="54" y="50" fill="#29B4D1" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800">BÀI 1.3 • HỆ THỐNG ĐẢO &amp; VAI TRÒ CHIẾN LƯỢC</text>

  <!-- Central Strategic Defense & Economic Arc Diagram -->
  <g transform="translate(40, 82)">
    <rect x="0" y="0" width="340" height="310" rx="16" fill="#113747" fill-opacity="0.9" stroke="#29B4D1" stroke-width="1.8" />
    <text x="170" y="32" text-anchor="middle" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800">THẾ TRẬN LIÊN HOÀN BỜ – ĐẢO – KHƠI XA</text>

    <!-- 3 Concentric Defensive & Economic Arcs -->
    <path d="M 55 60 Q 115 165 55 270" fill="none" stroke="#B6E0EB" stroke-width="6" stroke-linecap="round" />
    <text x="86" y="88" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="800">1. DẢI VEN BỜ (28 TỈNH)</text>

    <path d="M 135 55 Q 205 165 135 275" fill="none" stroke="#29B4D1" stroke-width="4" stroke-dasharray="8 5" />
    <circle cx="156" cy="110" r="6" fill="#29B4D1" />
    <circle cx="168" cy="165" r="6" fill="#29B4D1" />
    <circle cx="156" cy="220" r="6" fill="#29B4D1" />
    <text x="166" y="106" fill="#29B4D1" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="800">2. HƠN 3.000 ĐẢO VEN BỜ</text>
    <text x="178" y="168" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="700">12 Huyện / TP Đảo</text>

    <path d="M 235 50 Q 315 165 235 280" fill="none" stroke="#B6E0EB" stroke-width="2.5" stroke-dasharray="4 4" />
    <circle cx="268" cy="115" r="9" fill="#29B4D1" stroke="#B6E0EB" stroke-width="2" />
    <text x="268" y="96" text-anchor="middle" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="900">HOÀNG SA</text>
    <circle cx="272" cy="225" r="9" fill="#29B4D1" stroke="#B6E0EB" stroke-width="2" />
    <text x="272" y="250" text-anchor="middle" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="900">TRƯỜNG SA</text>
  </g>

  <!-- Right 3 Strategic Pillars -->
  <g transform="translate(404, 82)">
    <rect x="0" y="0" width="360" height="94" rx="12" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8" />
    <rect x="14" y="14" width="160" height="22" rx="6" fill="#113747" />
    <text x="94" y="29" text-anchor="middle" fill="#29B4D1" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="800">HỆ THỐNG ĐẢO VEN BỜ</text>
    <text x="16" y="56" fill="#113747" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="900">Hơn 3.000 đảo lớn nhỏ (~80% ở Vịnh Bắc Bộ)</text>
    <text x="16" y="76" fill="#455C68" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700">Phú Quốc (574 km²) • Cát Bà • Cái Bầu • Lý Sơn • Côn Đảo</text>

    <rect x="0" y="108" width="360" height="94" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="1.8" />
    <rect x="14" y="122" width="184" height="22" rx="6" fill="#29B4D1" />
    <text x="106" y="137" text-anchor="middle" fill="#113747" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="900">12 ĐƠN VỊ HÀNH CHÍNH ĐẢO</text>
    <text x="16" y="164" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="900">11 Huyện đảo &amp; 1 Thành phố đảo (Phú Quốc)</text>
    <text x="16" y="184" fill="#29B4D1" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700">Cô Tô • Vân Đồn • Bạch Long Vĩ • Cồn Cỏ • Phú Quý...</text>

    <rect x="0" y="216" width="360" height="94" rx="12" fill="#113747" stroke="#B6E0EB" stroke-width="1.8" />
    <rect x="14" y="230" width="210" height="22" rx="6" fill="#1A718D" />
    <text x="119" y="245" text-anchor="middle" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="800">VAI TRÒ CHIẾN LƯỢC TOÀN DIỆN</text>
    <text x="16" y="272" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="900">Pháo đài tiền tiêu • Căn cứ hậu cần • Mốc đường cơ sở</text>
    <text x="16" y="292" fill="#29B4D1" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700">Kết hợp chặt chẽ Kinh tế biển xanh với Quốc phòng – An ninh</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="36" y="414" width="728" height="58" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="1.5" />
  <text x="400" y="439" text-anchor="middle" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="800">HỆ THỐNG ĐẢO VÀ QUẦN ĐẢO VIỆT NAM – KHÔNG GIAN SINH TỒN &amp; LÁ CHẮN TIỀN TIÊU TỔ QUỐC</text>
  <text x="400" y="459" text-anchor="middle" fill="#29B4D1" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700">Chuẩn kiến thức Địa lý &amp; Giáo dục Quốc phòng – An ninh THPT (GDPT 2018)</text>
</svg>
