  <text x="96" y="305" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="700">UNCLOS 1982 • Luật Biển 2012</text>

  <!-- CĐ 04 -->
  <rect x="28" y="336" width="228" height="68" rx="14" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8"/>
