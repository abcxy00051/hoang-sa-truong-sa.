<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041527" />
      <stop offset="50%" stop-color="#0A2B4C" />
      <stop offset="100%" stop-color="#061E38" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.88" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#heroBg)" />

  <!-- Nautical Grid & Latitude/Longitude Lines -->
  <g stroke="#38BDF8" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90" stroke-dasharray="6 6" />
    <line x1="0" y1="180" x2="960" y2="180" />
    <line x1="0" y1="270" x2="960" y2="270" stroke-dasharray="6 6" />
    <line x1="0" y1="360" x2="960" y2="360" />
    <line x1="0" y1="450" x2="960" y2="450" stroke-dasharray="6 6" />
    <line x1="160" y1="0" x2="160" y2="540" />
    <line x1="320" y1="0" x2="320" y2="540" stroke-dasharray="6 6" />
    <line x1="480" y1="0" x2="480" y2="540" />
    <line x1="640" y1="0" x2="640" y2="540" stroke-dasharray="6 6" />
    <line x1="800" y1="0" x2="800" y2="540" />
  </g>

  <!-- Compass Rose Background -->
  <g transform="translate(730, 195)">
    <circle r="135" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle r="100" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5" />
    <circle r="65" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1" />
    <polygon points="0,-125 14,-20 0,-35 -14,-20" fill="url(#goldGlow)" opacity="0.85" />
    <polygon points="0,125 14,20 0,35 -14,20" fill="#38BDF8" opacity="0.45" />
    <polygon points="-125,0 -20,-14 -35,0 -20,14" fill="#38BDF8" opacity="0.45" />
    <polygon points="125,0 20,-14 35,0 20,14" fill="#38BDF8" opacity="0.45" />
    <circle r="8" fill="#FDE68A" />
  </g>

  <!-- Stylized Vietnam S-Coastline & Archipelagos Map Layer -->
  <path d="M450,65 C485,82 475,112 452,135 C430,158 468,195 505,235 C538,270 535,325 500,362 C472,390 442,408 430,432"
        stroke="url(#goldGlow)" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M465,65 C555,110 640,195 645,295 C650,375 585,445 480,475"
        stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.7" />

  <!-- Hoang Sa Marker -->
  <g transform="translate(575, 195)">
    <circle r="22" fill="#EF4444" fill-opacity="0.22" />
    <circle r="11" fill="#EF4444" stroke="#FEF08A" stroke-width="2" />
    <text x="18" y="-6" fill="#FEF08A" font-family="sans-serif" font-size="13" font-weight="700">QUẦN ĐẢO HOÀNG SA</text>
    <text x="18" y="11" fill="#BAE6FD" font-family="monospace" font-size="10">16°32'N - 111°37'E</text>
  </g>

  <!-- Truong Sa Marker -->
  <g transform="translate(615, 345)">
    <circle r="24" fill="#EF4444" fill-opacity="0.22" />
    <circle r="11" fill="#EF4444" stroke="#FEF08A" stroke-width="2" />
    <text x="18" y="-6" fill="#FEF08A" font-family="sans-serif" font-size="13" font-weight="700">QUẦN ĐẢO TRƯỜNG SA</text>
    <text x="18" y="11" fill="#BAE6FD" font-family="monospace" font-size="10">08°38'N - 111°55'E</text>
  </g>

  <!-- Historical Scroll / Chau Ban Document Panel (Left) -->
  <g transform="translate(65, 85)">
    <rect x="0" y="0" width="290" height="340" rx="14" fill="url(#parchment)" stroke="#D97706" stroke-width="3" />
    <rect x="14" y="14" width="262" height="312" rx="8" fill="none" stroke="#92400E" stroke-opacity="0.35" stroke-width="1.5" />
    <!-- Imperial Seal Stamp -->
    <rect x="200" y="34" width="54" height="54" rx="6" fill="#DC2626" fill-opacity="0.16" stroke="#DC2626" stroke-width="2" />
    <text x="227" y="58" text-anchor="middle" fill="#B91C1C" font-family="serif" font-size="11" font-weight="700">CHÂU BẢN</text>
    <text x="227" y="74" text-anchor="middle" fill="#B91C1C" font-family="serif" font-size="10" font-weight="700">TRIỀU NGUYỄN</text>

    <text x="30" y="52" fill="#78350F" font-family="serif" font-size="15" font-weight="700">TƯ LIỆU LỊCH SỬ &amp; PHÁP LÝ</text>
    <line x1="30" y1="65" x2="180" y2="65" stroke="#B45309" stroke-width="2" />
    <text x="30" y="95" fill="#451A03" font-family="sans-serif" font-size="12" font-weight="600">• Thiên Nam tứ chí lộ đồ thư (1686)</text>
    <text x="30" y="122" fill="#451A03" font-family="sans-serif" font-size="12" font-weight="600">• Phủ biên tạp lục – Lê Quý Đôn (1776)</text>
    <text x="30" y="149" fill="#451A03" font-family="sans-serif" font-size="12" font-weight="600">• Đại Nam thực lục &amp; Châu bản</text>
    <text x="30" y="176" fill="#451A03" font-family="sans-serif" font-size="12" font-weight="600">• Đại Nam nhất thống toàn đồ (1838)</text>
    <text x="30" y="203" fill="#451A03" font-family="sans-serif" font-size="12" font-weight="600">• Công ước Luật Biển UNCLOS 1982</text>
    <text x="30" y="230" fill="#451A03" font-family="sans-serif" font-size="12" font-weight="600">• Luật Biển Việt Nam năm 2012</text>

    <!-- Open Book Emblem inside Scroll -->
    <g transform="translate(30, 252)">
      <rect width="230" height="54" rx="10" fill="#0F172A" fill-opacity="0.9" />
      <text x="115" y="24" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="700">8 CHUYÊN ĐỀ • 24 BÀI HỌC CHUYÊN SÂU</text>
      <text x="115" y="42" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="10">Chuẩn Chương trình GDPT 2018 (Cấp THPT)</text>
    </g>
  </g>

  <!-- Sovereignty Lighthouse & Ocean Waves (Bottom Right) -->
  <g transform="translate(765, 295)">
    <polygon points="35,150 55,150 49,40 41,40" fill="#F8FAFC" stroke="#0284C7" stroke-width="2" />
    <rect x="37" y="65" width="16" height="18" fill="#EF4444" />
    <rect x="36" y="105" width="18" height="18" fill="#EF4444" />
    <rect x="38" y="24" width="14" height="16" rx="3" fill="#FDE047" />
    <polygon points="45,32 -90,-10 -90,55" fill="#FDE047" fill-opacity="0.2" />
    <path d="M5,165 C25,148 65,148 85,165 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  </g>

  <!-- Ocean Waves Bottom -->
  <path d="M0,475 Q160,445 320,475 T640,475 T960,475 L960,540 L0,540 Z" fill="#0284C7" fill-opacity="0.28" />
  <path d="M0,498 Q240,468 480,498 T960,498 L960,540 L0,540 Z" fill="#0369A1" fill-opacity="0.45" />
</svg>
