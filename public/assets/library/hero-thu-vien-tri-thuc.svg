  <text x="96" y="125" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="13.5" font-weight="800">Tổng quan Biển đảo</text>
  <text x="96" y="145" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="700">&gt;1 triệu km² • 3.260 km bờ biển</text>

  <!-- CĐ 02 -->
  <rect x="28" y="176" width="228" height="68" rx="14" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8"/>
  <rect x="40" y="188" width="44" height="44" rx="10" fill="#113747"/>
  <text x="62" y="215" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="900">02</text>
  <text x="96" y="205" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="13.5" font-weight="800">Lịch sử Hoàng Sa - Trường Sa</text>
