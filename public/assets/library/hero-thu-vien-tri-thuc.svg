  <text x="772" y="305" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="700">3 hệ sinh thái • 16 Khu bảo tồn</text>

  <!-- CĐ 08 -->
  <rect x="704" y="336" width="228" height="68" rx="14" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8"/>
  <rect x="716" y="348" width="44" height="44" rx="10" fill="#113747"/>
  <text x="738" y="375" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="900">08</text>
  <text x="772" y="365" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="13.5" font-weight="800">Tuổi trẻ &amp; Chủ quyền số</text>
  <text x="772" y="385" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="700">Kiểm chứng GIS • Luật Bản đồ 2018</text>

  <!-- Bottom Summary Bar -->
  <rect x="28" y="428" width="904" height="86" rx="16" fill="#113747" stroke="#29B4D1" stroke-width="1.5"/>
  <g transform="translate(52, 448)">
    <rect x="0" y="0" width="268" height="46" rx="10" fill="#1A718D"/>
    <text x="134" y="20" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">TƯ LIỆU LỊCH SỬ &amp; PHÁP LÝ GỐC</text>
    <text x="134" y="37" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="12" font-weight="700">Châu bản Nguyễn • UNCLOS 1982</text>
  </g>
  <g transform="translate(346, 448)">
    <rect x="0" y="0" width="268" height="46" rx="10" fill="#1A718D"/>
    <text x="134" y="20" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">TRỰC QUAN HÓA HỌC THUẬT (MỤC III)</text>
    <text x="134" y="37" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="12" font-weight="700">Mặt cắt vùng biển • Sơ đồ tư duy</text>
  </g>
  <g transform="translate(640, 448)">
    <rect x="0" y="0" width="268" height="46" rx="10" fill="#29B4D1"/>
    <text x="134" y="20" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">THEO DÕI TIẾN ĐỘ HỌC TẬP</text>
    <text x="134" y="37" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="12" font-weight="800">Lưu yêu thích &amp; Đánh dấu hoàn thành</text>
  </g>
