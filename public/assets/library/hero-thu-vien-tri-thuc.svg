<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <linearGradient id="bgHeroLib" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747"/>
      <stop offset="55%" stop-color="#1A718D"/>
      <stop offset="100%" stop-color="#113747"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#113747" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1A718D" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="techGridLib" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B6E0EB" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="22" fill="url(#bgHeroLib)"/>
  <rect width="960" height="540" rx="22" fill="url(#techGridLib)"/>

  <!-- Ambient Glows -->
  <circle cx="480" cy="250" r="210" fill="#29B4D1" fill-opacity="0.12"/>
  <circle cx="480" cy="250" r="155" stroke="#29B4D1" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="480" cy="250" r="205" stroke="#B6E0EB" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Top Header Banner -->
  <rect x="28" y="22" width="904" height="50" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="1.5"/>
  <circle cx="54" cy="47" r="7" fill="#29B4D1"/>
  <text x="72" y="52" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="800" letter-spacing="0.8">HỆ THỐNG HỌC LIỆU SỐ BIỂN ĐẢO VIỆT NAM • 8 CHUYÊN ĐỀ HỌC THUẬT TRỌNG TÂM</text>
  <rect x="736" y="33" width="180" height="28" rx="14" fill="#29B4D1"/>
  <text x="826" y="51" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="12" font-weight="800">CHUẨN HÓA DỮ LIỆU</text>

  <!-- Connector Lines from Central Hub to 8 Modules -->
  <g stroke="#29B4D1" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75">
    <line x1="380" y1="190" x2="250" y2="132"/>
    <line x1="380" y1="225" x2="250" y2="212"/>
    <line x1="380" y1="265" x2="250" y2="292"/>
    <line x1="380" y1="300" x2="250" y2="372"/>
    <line x1="580" y1="190" x2="710" y2="132"/>
    <line x1="580" y1="225" x2="710" y2="212"/>
    <line x1="580" y1="265" x2="710" y2="292"/>
    <line x1="580" y1="300" x2="710" y2="372"/>
  </g>

  <!-- Central Scholarly Hub -->
  <rect x="366" y="130" width="228" height="240" rx="22" fill="url(#cardDark)" stroke="#29B4D1" stroke-width="2.5"/>
  <rect x="386" y="146" width="188" height="26" rx="13" fill="#29B4D1"/>
