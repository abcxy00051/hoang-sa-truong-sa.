    <path d="M-22 -8 C-10 -14, -2 -10, 0 -4 C2 -10, 10 -14, 22 -8 L22 14 C10 8, 2 12, 0 18 C-2 12, -10 8, -22 14 Z" fill="#B6E0EB" stroke="#113747" stroke-width="1.5"/>
    <line x1="0" y1="-4" x2="0" y2="18" stroke="#113747" stroke-width="1.8"/>
    <polygon points="0,-28 4,-16 0,-19 -4,-16" fill="#29B4D1"/>
