  <!-- CĐ 05 -->
  <rect x="704" y="96" width="228" height="68" rx="14" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8"/>
  <rect x="716" y="108" width="44" height="44" rx="10" fill="#113747"/>
  <text x="738" y="135" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="900">05</text>
