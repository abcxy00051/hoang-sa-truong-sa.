<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgCd05" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747"/>
      <stop offset="55%" stop-color="#1A718D"/>
      <stop offset="100%" stop-color="#113747"/>
    </linearGradient>
    <pattern id="gridCd05" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#B6E0EB" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgCd05)"/>
  <rect width="800" height="450" rx="16" fill="url(#gridCd05)"/>

  <!-- Header in Safe Zone (y: 60..388) -->
  <rect x="28" y="60" width="744" height="46" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="1.5"/>
  <rect x="40" y="69" width="118" height="28" rx="14" fill="#29B4D1"/>
  <text x="99" y="87" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">CHUYÊN ĐỀ 05</text>
  <text x="172" y="88" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="800">KINH TẾ BIỂN BỀN VỮNG: 6 NGÀNH MŨI NHỌN &amp; 4 NGƯ TRƯỜNG LỚN</text>

  <!-- Left Panel: 6 Key Marine Economic Sectors (Resolution 36-NQ/TW) -->
  <rect x="28" y="118" width="464" height="264" rx="14" fill="#113747" stroke="#29B4D1" stroke-width="1.8"/>
  <text x="46" y="142" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="12.5" font-weight="800">6 NGÀNH KINH TẾ BIỂN MŨI NHỌN (NGHỊ QUYẾT 36-NQ/TW)</text>

  <!-- Row 1 -->
  <rect x="44" y="154" width="432" height="32" rx="7" fill="#1A718D"/>
  <rect x="44" y="154" width="388" height="32" rx="7" fill="#29B4D1"/>
  <text x="56" y="174" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">01. Du lịch và dịch vụ biển (Phú Quốc, Hạ Long, Nha Trang, Đà Nẵng)</text>
  <text x="466" y="174" text-anchor="end" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">#1</text>

  <!-- Row 2 -->
  <rect x="44" y="192" width="432" height="32" rx="7" fill="#1A718D"/>
  <rect x="44" y="192" width="366" height="32" rx="7" fill="#B6E0EB"/>
  <text x="56" y="212" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">02. Kinh tế hàng hải &amp; Cảng nước sâu (Lạch Huyện, Cái Mép - Thị Vải)</text>
  <text x="466" y="212" text-anchor="end" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">#2</text>

  <!-- Row 3 -->
  <rect x="44" y="230" width="432" height="32" rx="7" fill="#1A718D"/>
  <rect x="44" y="230" width="344" height="32" rx="7" fill="#29B4D1"/>
  <text x="56" y="250" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">03. Dầu khí &amp; Khoáng sản biển (Bể Cửu Long, Nam Côn Sơn, Mã Lai)</text>
  <text x="466" y="250" text-anchor="end" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">#3</text>

  <!-- Row 4 -->
  <rect x="44" y="268" width="432" height="32" rx="7" fill="#1A718D"/>
  <rect x="44" y="268" width="322" height="32" rx="7" fill="#B6E0EB"/>
  <text x="56" y="288" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">04. Nuôi trồng &amp; Khai thác hải sản xa bờ bền vững (~9 triệu tấn)</text>
  <text x="466" y="288" text-anchor="end" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">#4</text>

  <!-- Row 5 -->
  <rect x="44" y="306" width="432" height="32" rx="7" fill="#1A718D"/>
  <rect x="44" y="306" width="298" height="32" rx="7" fill="#29B4D1"/>
  <text x="56" y="326" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">05. Công nghiệp ven biển &amp; Khu kinh tế ven biển</text>
  <text x="466" y="326" text-anchor="end" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">#5</text>

  <!-- Row 6 -->
  <rect x="44" y="344" width="432" height="28" rx="7" fill="#1A718D"/>
  <rect x="44" y="344" width="276" height="28" rx="7" fill="#B6E0EB"/>
  <text x="56" y="362" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">06. Năng lượng tái tạo &amp; Ngành kinh tế biển mới</text>
  <text x="466" y="362" text-anchor="end" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">#6</text>

  <!-- Right Panel: 4 Major Fishing Grounds & Strategic Corridors -->
  <rect x="506" y="118" width="266" height="264" rx="14" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8"/>
  <text x="522" y="142" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="12.5" font-weight="800">4 NGƯ TRƯỜNG TRỌNG ĐIỂM</text>

  <rect x="520" y="152" width="238" height="46" rx="8" fill="#113747"/>
  <text x="532" y="171" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">1. Hải Phòng – Quảng Ninh</text>
  <text x="532" y="188" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Ngư trường Vịnh Bắc Bộ giàu cá đáy</text>

  <rect x="520" y="204" width="238" height="46" rx="8" fill="#1A718D"/>
  <text x="532" y="223" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">2. Hoàng Sa – Trường Sa</text>
  <text x="532" y="240" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Ngư trường đại dương cá ngừ, cá nổi</text>

  <rect x="520" y="256" width="238" height="46" rx="8" fill="#113747"/>
  <text x="532" y="275" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">3. Ninh Thuận – Bình Thuận – BR-VT</text>
  <text x="532" y="292" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Vùng nước trồi giàu dinh dưỡng bậc nhất</text>

  <rect x="520" y="308" width="238" height="60" rx="8" fill="#29B4D1"/>
  <text x="532" y="327" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="900">4. Cà Mau – Kiên Giang</text>
  <text x="532" y="344" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="700">Ngư trường thềm lục địa Tây Nam</text>
  <text x="532" y="359" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="800">Hàng hải: 45% thương mại thế giới</text>
</svg>
