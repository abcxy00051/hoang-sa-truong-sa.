<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgCd02" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747"/>
      <stop offset="55%" stop-color="#1A718D"/>
      <stop offset="100%" stop-color="#113747"/>
    </linearGradient>
    <pattern id="gridCd02" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#B6E0EB" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgCd02)"/>
  <rect width="800" height="450" rx="16" fill="url(#gridCd02)"/>

  <!-- Header in Safe Zone (y: 60..388) -->
  <rect x="28" y="60" width="744" height="46" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="1.5"/>
  <rect x="40" y="69" width="118" height="28" rx="14" fill="#29B4D1"/>
  <text x="99" y="87" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">CHUYÊN ĐỀ 02</text>
  <text x="172" y="88" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="800">LỊCH SỬ XÁC LẬP &amp; THỰC THI CHỦ QUYỀN HOÀNG SA – TRƯỜNG SA</text>

  <!-- Horizontal Timeline Spine -->
  <line x1="60" y1="152" x2="740" y2="152" stroke="#29B4D1" stroke-width="3"/>

  <!-- Milestone 1: TK XVII - 1776 -->
  <circle cx="115" cy="152" r="11" fill="#29B4D1" stroke="#113747" stroke-width="3"/>
  <rect x="28" y="174" width="174" height="206" rx="12" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.5"/>
  <rect x="40" y="186" width="150" height="24" rx="6" fill="#113747"/>
  <text x="115" y="202" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">TK XVII – 1776</text>
  <text x="42" y="228" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="12.5" font-weight="800">Chúa Nguyễn &amp; Đội Hoàng Sa</text>
  <text x="42" y="248" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Đội Hoàng Sa (70 suất/năm)</text>
  <text x="42" y="266" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Đội Bắc Hải quản lý Trường Sa</text>
  <text x="42" y="284" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Thiên Nam tứ chí lộ đồ (1686)</text>
  <rect x="40" y="302" width="150" height="64" rx="8" fill="#1A718D"/>
  <text x="115" y="322" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">Phủ biên tạp lục (1776)</text>
  <text x="115" y="340" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Lê Quý Đôn chép rõ lệ</text>
  <text x="115" y="355" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">cấp bằng đi Hoàng Sa</text>

  <!-- Milestone 2: 1816 - 1838 -->
  <circle cx="305" cy="152" r="11" fill="#29B4D1" stroke="#113747" stroke-width="3"/>
  <rect x="218" y="174" width="174" height="206" rx="12" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.5"/>
  <rect x="230" y="186" width="150" height="24" rx="6" fill="#113747"/>
  <text x="305" y="202" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">1816 – 1838</text>
  <text x="232" y="228" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="12.5" font-weight="800">Vương triều Nguyễn</text>
  <text x="232" y="248" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• 1816: Vua Gia Long cắm cờ</text>
  <text x="232" y="266" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• 1836: Minh Mạng sai cắm mốc</text>
  <text x="232" y="284" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• 1838: Đại Nam nhất thống toàn đồ</text>
  <rect x="230" y="302" width="150" height="64" rx="8" fill="#113747"/>
  <text x="305" y="322" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">Châu bản &amp; Mộc bản</text>
  <text x="305" y="340" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Di sản tư liệu thế giới</text>
  <text x="305" y="355" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">UNESCO công nhận</text>

  <!-- Milestone 3: 1884 - 1951 -->
  <circle cx="495" cy="152" r="11" fill="#29B4D1" stroke="#113747" stroke-width="3"/>
  <rect x="408" y="174" width="174" height="206" rx="12" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.5"/>
  <rect x="420" y="186" width="150" height="24" rx="6" fill="#113747"/>
  <text x="495" y="202" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">1930s – 1951</text>
  <text x="422" y="228" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="12.5" font-weight="800">Quản lý Hành chính &amp; Quốc tế</text>
  <text x="422" y="248" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• 1933: Sát nhập Trường Sa vào Bà Rịa</text>
  <text x="422" y="266" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• 1938: Nghị định 156-SC Hoàng Sa</text>
  <text x="422" y="284" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Dựng bia, hải đăng, trạm WMO</text>
  <rect x="420" y="302" width="150" height="64" rx="8" fill="#1A718D"/>
  <text x="495" y="322" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">Hội nghị San Francisco</text>
  <text x="495" y="340" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">07/09/1951: Tuyên bố chủ</text>
  <text x="495" y="355" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">quyền trước 51 quốc gia</text>

  <!-- Milestone 4: 1975 - Hiện nay -->
  <circle cx="685" cy="152" r="11" fill="#29B4D1" stroke="#113747" stroke-width="3"/>
  <rect x="598" y="174" width="174" height="206" rx="12" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.5"/>
  <rect x="610" y="186" width="150" height="24" rx="6" fill="#29B4D1"/>
  <text x="685" y="202" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="900">1975 – HIỆN NAY</text>
  <text x="612" y="228" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="12.5" font-weight="800">Nhà nước CHXHCN Việt Nam</text>
  <text x="612" y="248" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Huyện đảo Hoàng Sa (Đà Nẵng)</text>
  <text x="612" y="266" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Huyện đảo Trường Sa (Khánh Hòa)</text>
  <text x="612" y="284" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Phê chuẩn UNCLOS 1982 (1994)</text>
  <rect x="610" y="302" width="150" height="64" rx="8" fill="#113747"/>
  <text x="685" y="322" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">Luật Biển Việt Nam 2012</text>
  <text x="685" y="340" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">Thực thi chủ quyền liên tục,</text>
  <text x="685" y="355" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10" font-weight="600">hòa bình &amp; đúng luật quốc tế</text>
</svg>
