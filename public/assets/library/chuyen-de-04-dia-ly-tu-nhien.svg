<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="bg04" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#032639" />
      <stop offset="50%" stop-color="#064E6E" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="reefAtoll" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="20" fill="url(#bg04)" />
  <!-- Topographic & Bathymetric Contours -->
  <g transform="translate(415, 215)">
    <ellipse rx="235" ry="145" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="8 6" />
    <ellipse rx="185" ry="112" fill="#0284C7" fill-opacity="0.25" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="2" />
    <ellipse rx="132" ry="78" fill="url(#reefAtoll)" fill-opacity="0.35" stroke="#6EE7B7" stroke-width="2" />
    <ellipse rx="78" ry="44" fill="#FDE68A" fill-opacity="0.88" stroke="#F59E0B" stroke-width="2" />
    <ellipse rx="46" ry="24" fill="#10B981" />
    <text x="0" y="4" text-anchor="middle" fill="#064E3B" font-family="sans-serif" font-size="11" font-weight="800">ĐẢO SAN HÔ</text>
    <text x="0" y="-56" text-anchor="middle" fill="#A7F3D0" font-family="sans-serif" font-size="11" font-weight="700">Thềm rạn san hô vòng (Atoll)</text>
    <text x="0" y="98" text-anchor="middle" fill="#BAE6FD" font-family="sans-serif" font-size="11" font-weight="700">Sườn dốc thềm lục địa &amp; biển sâu</text>
  </g>
  <!-- Left Panel: Hoang Sa vs Truong Sa Geography -->
  <g transform="translate(36, 48)">
    <rect width="235" height="330" rx="14" fill="#041E2E" fill-opacity="0.9" stroke="#2DD4BF" stroke-opacity="0.45" />
    <text x="18" y="34" fill="#6EE7B7" font-family="sans-serif" font-size="13" font-weight="800">ĐỊA LÝ TỰ NHIÊN BIỂN ĐẢO</text>
    <line x1="18" y1="46" x2="215" y2="46" stroke="#2DD4BF" stroke-opacity="0.35" />
    <text x="18" y="76" fill="#FDE68A" font-family="sans-serif" font-size="12" font-weight="700">1. Quần đảo Hoàng Sa</text>
    <text x="18" y="95" fill="#CCFBF1" font-family="sans-serif" font-size="11">• Nhóm An Vĩnh &amp; Nhóm Lưỡi Liềm</text>
    <text x="18" y="113" fill="#CCFBF1" font-family="sans-serif" font-size="11">• Đảo Phú Lâm (~1,5–2 km²)</text>
    <text x="18" y="131" fill="#CCFBF1" font-family="sans-serif" font-size="11">• Đảo Đá Bắc (cao ~15,9 m)</text>
    <text x="18" y="164" fill="#FDE68A" font-family="sans-serif" font-size="12" font-weight="700">2. Quần đảo Trường Sa</text>
    <text x="18" y="183" fill="#CCFBF1" font-family="sans-serif" font-size="11">• Chia thành 8 cụm đảo, đá, bãi</text>
    <text x="18" y="201" fill="#CCFBF1" font-family="sans-serif" font-size="11">• Đảo tự nhiên lớn nhất: Ba Bình</text>
    <text x="18" y="219" fill="#CCFBF1" font-family="sans-serif" font-size="11">• Đảo cao nhất: Song Tử Tây</text>
    <text x="18" y="252" fill="#FDE68A" font-family="sans-serif" font-size="12" font-weight="700">3. Khí hậu &amp; Hải văn</text>
    <text x="18" y="271" fill="#CCFBF1" font-family="sans-serif" font-size="11">• Nhiệt đới gió mùa hải dương</text>
    <text x="18" y="289" fill="#CCFBF1" font-family="sans-serif" font-size="11">• Dòng biển theo 2 mùa gió</text>
    <text x="18" y="307" fill="#CCFBF1" font-family="sans-serif" font-size="11">• Độ muối trung bình 32–34‰</text>
  </g>
  <rect x="36" y="405" width="728" height="44" rx="10" fill="#031824" fill-opacity="0.92" stroke="#2DD4BF" stroke-opacity="0.4" />
  <text x="400" y="432" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="14" font-weight="700">CHUYÊN ĐỀ 04: ĐỊA LÝ VÀ ĐẶC ĐIỂM TỰ NHIÊN BIỂN ĐẢO VIỆT NAM</text>
</svg>
