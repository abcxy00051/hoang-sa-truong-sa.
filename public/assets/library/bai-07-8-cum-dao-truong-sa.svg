      <rect x="12" y="12" width="148" height="24" rx="6" fill="#113747" />
      <text x="86" y="28" text-anchor="middle" fill="#29B4D1" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="900">8. CỤM BÌNH NGUYÊN</text>
