      <text x="86" y="76" text-anchor="middle" fill="#455C68" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="700">Đảo Bình Nguyên • Vĩnh Viễn</text>
      <text x="86" y="94" text-anchor="middle" fill="#455C68" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="700">Bãi Cỏ Rong • Đá Suối Ngọc</text>
