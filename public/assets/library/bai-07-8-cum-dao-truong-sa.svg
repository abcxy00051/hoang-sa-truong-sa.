  <!-- Bottom Banner -->
  <rect x="36" y="408" width="728" height="62" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="1.5" />
  <text x="400" y="434" text-anchor="middle" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="800">QUẦN ĐẢO TRƯỜNG SA (HUYỆN TRƯỜNG SA, TỈNH KHÁNH HÒA): 06°30&apos;B – 12°00&apos;B • 111°30&apos;Đ – 117°20&apos;Đ</text>
  <text x="400" y="455" text-anchor="middle" fill="#29B4D1" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700">Gồm Thị trấn Trường Sa, Xã đảo Song Tử Tây và Xã đảo Sinh Tồn • Cách bán đảo Cam Ranh ~248 hải lý</text>
