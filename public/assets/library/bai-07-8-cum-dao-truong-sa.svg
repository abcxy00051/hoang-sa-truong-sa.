<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg07ts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113747" />
      <stop offset="55%" stop-color="#1A718D" />
      <stop offset="100%" stop-color="#113747" />
    </linearGradient>
    <pattern id="grid07ts" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#29B4D1" stroke-width="0.6" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg07ts)" />
  <rect width="800" height="500" fill="url(#grid07ts)" />

  <!-- Top Header Badge -->
  <rect x="36" y="28" width="410" height="34" rx="8" fill="#113747" stroke="#29B4D1" stroke-width="1.5" />
  <text x="54" y="50" fill="#29B4D1" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800">BÀI 4.2 • CẤU TRÚC 8 CỤM ĐẢO QUẦN ĐẢO TRƯỜNG SA</text>

  <!-- 8 Clusters Grid (2 rows x 4 columns) -->
  <g transform="translate(36, 80)">
