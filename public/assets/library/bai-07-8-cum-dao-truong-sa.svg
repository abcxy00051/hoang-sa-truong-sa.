    <g transform="translate(0, 0)">
      <rect width="172" height="145" rx="12" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8" />
      <rect x="12" y="12" width="148" height="24" rx="6" fill="#113747" />
      <text x="86" y="28" text-anchor="middle" fill="#29B4D1" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="900">1. CỤM SONG TỬ</text>
      <text x="86" y="56" text-anchor="middle" fill="#113747" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="900">Cực Bắc Trường Sa</text>
      <text x="86" y="76" text-anchor="middle" fill="#455C68" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="700">Song Tử Tây (Cao ~4–6m)</text>
      <text x="86" y="94" text-anchor="middle" fill="#455C68" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="700">Song Tử Đông • Đá Bắc</text>
      <rect x="16" y="108" width="140" height="24" rx="6" fill="#1A718D" />
      <text x="86" y="124" text-anchor="middle" fill="#B6E0EB" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="800">Xã đảo Song Tử Tây</text>
