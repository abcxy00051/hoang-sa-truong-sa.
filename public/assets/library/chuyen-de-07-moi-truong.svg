<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgCd07" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#113747"/>
      <stop offset="55%" stop-color="#1A718D"/>
      <stop offset="100%" stop-color="#113747"/>
    </linearGradient>
    <pattern id="gridCd07" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#B6E0EB" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgCd07)"/>
  <rect width="800" height="450" rx="16" fill="url(#gridCd07)"/>

  <!-- Header in Safe Zone (y: 60..388) -->
  <rect x="28" y="60" width="744" height="46" rx="10" fill="#113747" stroke="#29B4D1" stroke-width="1.5"/>
  <rect x="40" y="69" width="118" height="28" rx="14" fill="#29B4D1"/>
  <text x="99" y="87" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">CHUYÊN ĐỀ 07</text>
  <text x="172" y="88" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="800">3 HỆ SINH THÁI BIỂN TIÊU BIỂU, BLUE CARBON &amp; 16 KHU BẢO TỒN BIỂN</text>

  <!-- 3 Marine Ecosystems Cards -->
  <!-- 1. Mangrove -->
  <rect x="28" y="118" width="236" height="196" rx="14" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8"/>
  <rect x="42" y="132" width="208" height="28" rx="7" fill="#113747"/>
  <text x="146" y="150" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">1. RỪNG NGẬP MẶN VEN BỜ</text>
  <text x="44" y="178" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">Cần Giờ, Mũi Cà Mau, Xuân Thủy</text>
  <text x="44" y="198" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Giảm 50–70% năng lượng sóng bão</text>
  <text x="44" y="216" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Chống xói lở bờ biển &amp; xâm nhập mặn</text>
  <text x="44" y="234" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">• Hấp thụ Blue Carbon gấp 4–10 lần</text>
  <text x="44" y="250" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">  rừng nhiệt đới trên cạn</text>
  <rect x="42" y="268" width="208" height="32" rx="7" fill="#1A718D"/>
  <text x="146" y="288" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">Lá chắn sinh học ven biển</text>

  <!-- 2. Seagrass -->
  <rect x="282" y="118" width="236" height="196" rx="14" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8"/>
  <rect x="296" y="132" width="208" height="28" rx="7" fill="#1A718D"/>
  <text x="400" y="150" text-anchor="middle" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="800">2. THẢM CỎ BIỂN NƯỚC NÔNG</text>
  <text x="298" y="178" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">Phú Quốc, Côn Đảo, Khánh Hòa</text>
  <text x="298" y="198" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Bãi đẻ và ươm giống hải sản non</text>
  <text x="298" y="216" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Lọc trầm tích, tạo oxy hòa tan</text>
  <text x="298" y="234" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">• Sinh cảnh của Bò biển (Dugong)</text>
  <text x="298" y="250" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">  và Rùa biển quý hiếm Sách Đỏ</text>
  <rect x="296" y="268" width="208" height="32" rx="7" fill="#113747"/>
  <text x="400" y="288" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">Bể lưu trữ Carbon đáy biển</text>

  <!-- 3. Coral Reefs -->
  <rect x="536" y="118" width="236" height="196" rx="14" fill="#B6E0EB" stroke="#29B4D1" stroke-width="1.8"/>
  <rect x="550" y="132" width="208" height="28" rx="7" fill="#29B4D1"/>
  <text x="654" y="150" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="900">3. RẠN SAN HÔ NHIỆT ĐỚI</text>
  <text x="552" y="178" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="800">&gt; 1.200 km² (Hoàng Sa, Trường Sa...)</text>
  <text x="552" y="198" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• ~400 loài san hô tạo rạn cứng</text>
  <text x="552" y="216" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">• Nơi cư trú của 25% loài sinh vật</text>
  <text x="552" y="234" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Xây dựng nền móng đảo san hô vòng</text>
  <text x="552" y="250" fill="#455C68" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="600">• Đê chắn sóng tự nhiên ngoài khơi</text>
  <rect x="550" y="268" width="208" height="32" rx="7" fill="#113747"/>
  <text x="654" y="288" text-anchor="middle" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="800">“Rừng mưa nhiệt đới đáy biển”</text>

  <!-- Bottom Strip: 16 Marine Protected Areas & Action Plan -->
  <rect x="28" y="326" width="744" height="56" rx="12" fill="#113747" stroke="#29B4D1" stroke-width="1.5"/>
  <rect x="44" y="339" width="186" height="30" rx="8" fill="#29B4D1"/>
  <text x="137" y="358" text-anchor="middle" fill="#113747" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="900">16 KHU BẢO TỒN BIỂN</text>
  <text x="244" y="352" fill="#B6E0EB" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" font-weight="700">Bạch Long Vĩ, Cát Bà, Cô Tô, Cồn Cỏ, Cù Lao Chàm, Lý Sơn, vịnh Nha Trang, Núi Chúa, Phú Quý, Côn Đảo, Phú Quốc...</text>
  <text x="244" y="370" fill="#29B4D1" font-family="Be Vietnam Pro, sans-serif" font-size="11" font-weight="700">Quyết định 1423/QĐ-TTg &amp; 1746/QĐ-TTg: Giảm thiểu rác thải nhựa đại dương, chống khai thác IUU</text>
</svg>
