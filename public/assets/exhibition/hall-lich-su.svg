<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071936" />
      <stop offset="55%" stop-color="#132f5c" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgHist)" />
  <circle cx="680" cy="110" r="140" fill="rgba(251, 191, 36, 0.08)" />
  <circle cx="120" cy="400" r="160" fill="rgba(56, 189, 248, 0.08)" />

  <!-- Khung cuộn thư tịch & Châu bản mô phỏng -->
  <rect x="110" y="70" width="580" height="330" rx="14" fill="url(#parchment)" stroke="#d97706" stroke-width="4" />
  <rect x="128" y="88" width="544" height="294" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Dấu ấn triều Nguyễn mô phỏng -->
  <rect x="160" y="115" width="86" height="86" rx="6" fill="rgba(220, 38, 38, 0.14)" stroke="#dc2626" stroke-width="3" />
  <text x="203" y="152" text-anchor="middle" fill="#b91c1c" font-family="serif" font-size="14" font-weight="bold">CHÂU BẢN</text>
  <text x="203" y="174" text-anchor="middle" fill="#b91c1c" font-family="serif" font-size="13" font-weight="bold">TRIỀU NGUYỄN</text>

  <!-- Nội dung mô phỏng tư liệu -->
  <text x="275" y="135" fill="#78350f" font-family="sans-serif" font-size="18" font-weight="bold">HỒ SƠ TƯ LIỆU LỊCH SỬ &amp; BẢN ĐỒ CỔ</text>
  <text x="275" y="162" fill="#92400e" font-family="sans-serif" font-size="13" font-weight="bold">• Toản tập Thiên Nam tứ chí lộ đồ thư (1686)</text>
  <text x="275" y="186" fill="#92400e" font-family="sans-serif" font-size="13" font-weight="bold">• Phủ biên tạp lục – Lê Quý Đôn (1776)</text>
  <text x="275" y="210" fill="#92400e" font-family="sans-serif" font-size="13" font-weight="bold">• Đại Nam thực lục &amp; Đại Nam nhất thống toàn đồ (1838)</text>

  <!-- Sơ đồ hải trình Đội Hoàng Sa -->
  <path d="M 170 310 Q 320 260 470 300 T 620 280" fill="none" stroke="#0369a1" stroke-width="3.5" stroke-dasharray="8 5" />
  <circle cx="170" cy="310" r="8" fill="#0284c7" />
  <text x="170" y="335" text-anchor="middle" fill="#075985" font-family="sans-serif" font-size="12" font-weight="bold">Cù lao Ré (Lý Sơn)</text>

  <circle cx="410" cy="285" r="10" fill="#d97706" />
  <text x="410" y="265" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="13" font-weight="bold">HOÀNG SA (Bãi Cát Vàng)</text>

  <circle cx="620" cy="280" r="10" fill="#d97706" />
  <text x="595" y="312" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="13" font-weight="bold">VẠN LÝ TRƯỜNG SA</text>

  <!-- Nhãn minh bạch học thuật -->
  <rect x="110" y="422" width="580" height="42" rx="21" fill="rgba(4, 13, 29, 0.85)" stroke="#fbbf24" stroke-width="1.5" />
  <text x="400" y="448" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="13" font-weight="bold">
    ĐỒ HỌA MÔ PHỎNG HỒ SƠ TƯ LIỆU PHỤC VỤ GIÁO DỤC THPT • BIỂN ĐẢO VIỆT NAM
  </text>
</svg>
