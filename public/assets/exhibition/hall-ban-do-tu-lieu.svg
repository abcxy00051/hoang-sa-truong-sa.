<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" fill="none">
  <defs>
    <linearGradient id="hallMapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041026" />
      <stop offset="55%" stop-color="#0A254D" />
      <stop offset="100%" stop-color="#061938" />
    </linearGradient>
    <linearGradient id="hallGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="900" height="540" rx="20" fill="url(#hallMapBg)" />

  <!-- Cartographic Grid & Compass Rose -->
  <g stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="6 6">
    <line x1="0" y1="135" x2="900" y2="135" />
    <line x1="0" y1="270" x2="900" y2="270" />
    <line x1="0" y1="405" x2="900" y2="405" />
    <line x1="225" y1="0" x2="225" y2="540" />
    <line x1="450" y1="0" x2="450" y2="540" />
    <line x1="675" y1="0" x2="675" y2="540" />
  </g>

  <!-- Left Archival Map Scroll -->
  <g transform="translate(75, 95)">
    <rect x="0" y="0" width="335" height="310" rx="14" fill="#0B2246" stroke="url(#hallGold)" stroke-width="2.5" />
    <circle cx="168" cy="145" r="78" stroke="#FDE047" stroke-width="2" stroke-dasharray="6 5" fill="#06152D" />
    <text x="168" y="138" text-anchor="middle" fill="#FEF08A" font-family="Inter, sans-serif" font-size="15" font-weight="800">ĐẠI NAM NHẤT THỐNG TOÀN ĐỒ</text>
    <text x="168" y="162" text-anchor="middle" fill="#7DD3FC" font-family="Inter, sans-serif" font-size="12" font-weight="700">HOÀNG SA • VẠN LÝ TRƯỜNG SA (1838)</text>
    <text x="168" y="275" text-anchor="middle" fill="#BAE6FD" font-family="Inter, sans-serif" font-size="13" font-weight="700">KHO BẢN ĐỒ CỔ VIỆT NAM &amp; PHƯƠNG TÂY</text>
  </g>

  <!-- Right Legal & Geographic Dossier Frame -->
  <g transform="translate(465, 95)">
    <rect x="0" y="0" width="360" height="310" rx="14" fill="#081E3E" stroke="#38BDF8" stroke-width="2.5" />
    <rect x="28" y="34" width="304" height="58" rx="8" fill="#0F2952" stroke="#FBBF24" stroke-width="1.5" />
    <text x="180" y="68" text-anchor="middle" fill="#FEF08A" font-family="Inter, sans-serif" font-size="13.5" font-weight="800">CÔNG ƯỚC LUẬT BIỂN UNCLOS 1982</text>
    <rect x="28" y="112" width="304" height="58" rx="8" fill="#0F2952" stroke="#38BDF8" stroke-width="1.5" />
    <text x="180" y="146" text-anchor="middle" fill="#BAE6FD" font-family="Inter, sans-serif" font-size="13.5" font-weight="800">LUẬT BIỂN VIỆT NAM NĂM 2012</text>
    <rect x="28" y="190" width="304" height="58" rx="8" fill="#0F2952" stroke="#34D399" stroke-width="1.5" />
    <text x="180" y="224" text-anchor="middle" fill="#A7F3D0" font-family="Inter, sans-serif" font-size="13.5" font-weight="800">HỒ SƠ ĐỊA LÝ HOÀNG SA – TRƯỜNG SA</text>
    <text x="180" y="282" text-anchor="middle" fill="#FEF08A" font-family="Inter, sans-serif" font-size="13" font-weight="700">PHÒNG 02: BẢN ĐỒ VÀ TƯ LIỆU</text>
  </g>
</svg>
